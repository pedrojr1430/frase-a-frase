<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frase a Frase</title>
<meta name="description" content="Aprenda espanhol frase a frase: cartões, leitura guiada, prática e podcasts reais.">
<meta name="theme-color" content="#F4F6FC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Frase a Frase">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#F4F6FC;--deck:#FFFFFF;--deck2:#ECEFFB;--line:#E1E6F3;--line2:#C9D2EA;--text:#141A33;--muted:#5D6788;--red:#5B3DF5;--saffron:#5B3DF5;--cyan:#2F6FE0;--tr-size:18px}
html,body{margin:0;background:var(--ink);height:100%;color-scheme:light}
body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;font-family:Manrope,system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
a{color:#5B3DF5}a:hover{color:#3B2DB8}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}
::selection{background:rgba(91,61,245,.22)}
#app{height:100%}
#app nav{background:rgba(255,255,255,.94)!important;border-top-color:#E1E6F3!important;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
body.has-dock #scroller{padding-bottom:132px !important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* mini player */
#faf-dock{position:fixed;left:0;right:0;bottom:80px;z-index:20;display:flex;justify-content:center;pointer-events:none;padding:0 10px}
#faf-dock[hidden]{display:none}
.faf-dock-card{pointer-events:auto;width:100%;max-width:540px;box-sizing:border-box;background:#FFFFFF;border:1px solid var(--line2);color:var(--text);border-radius:16px;padding:10px 12px 8px;box-shadow:0 18px 40px rgba(20,26,51,.14);display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.faf-dock-top{display:flex;align-items:center;gap:8px}
#faf-dock-info{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:none;color:inherit;text-align:left;padding:0}
#faf-dock-art{width:40px;height:40px;border-radius:8px;object-fit:cover;flex:0 0 auto;background:var(--deck2)}
.faf-dock-text{min-width:0;display:flex;flex-direction:column}
#faf-dock-title{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#faf-dock-show{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.faf-ic{flex:0 0 auto;width:40px;height:40px;border-radius:999px;border:none;background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
#faf-toggle{width:44px;height:44px;background:var(--red);color:#FFFFFF}
#faf-speed{width:auto;min-width:44px;padding:0 8px;border:1px solid var(--line2);height:30px;font-size:12px}
.faf-dock-bottom{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
#faf-seek{flex:1 1 auto;accent-color:var(--red);height:20px;margin:0}

/* sheet */
#faf-sheet{position:fixed;inset:0;z-index:30;background:rgba(20,26,51,.45);display:flex;align-items:flex-end;justify-content:center}
#faf-sheet[hidden]{display:none}
.faf-panel{width:100%;max-width:600px;max-height:90vh;max-height:90dvh;background:var(--ink);border:1px solid var(--line);border-bottom:none;border-radius:20px 20px 0 0;display:flex;flex-direction:column;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom);position:relative}
.faf-head{display:flex;align-items:flex-start;gap:12px;padding:18px 18px 10px}
.faf-head-text{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px}
#faf-sheet-title{margin:0;font-family:Unbounded,Manrope,sans-serif;font-size:19px;line-height:1.25;font-weight:600;letter-spacing:-.01em}
#faf-sheet-sub{font-size:13px;color:var(--muted)}
#faf-sheet-close{width:40px;height:40px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
#faf-sheet-body{overflow-y:auto;padding:4px 18px 22px;display:flex;flex-direction:column;gap:12px}
.faf-video{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.faf-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.faf-tip{margin:0;padding:12px 14px;background:var(--deck);border:1px solid var(--line);border-radius:12px;font-size:14px;line-height:1.5;color:#3E4770}
.faf-note{margin:0;font-size:13px;line-height:1.5;color:var(--muted)}
.faf-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.faf-btn{min-height:46px;display:flex;align-items:center;justify-content:center;border-radius:12px;font-size:14px;font-weight:700;text-decoration:none;padding:0 14px;box-sizing:border-box;text-align:center}
.faf-btn-red{border:none;background:var(--red);color:#FFFFFF}
.faf-btn-light{border:1px solid var(--line2);background:transparent;color:var(--text)}
a.faf-btn-light{color:var(--text)}
.faf-list{display:flex;flex-direction:column}
.faf-ep{display:flex;align-items:center;gap:14px;text-align:left;background:transparent;border:none;border-bottom:1px solid var(--line);padding:14px 2px;color:var(--text);min-height:60px}
.faf-ep:first-child{border-top:1px solid var(--line)}
.faf-ep-icon{flex:0 0 auto;width:36px;height:36px;border-radius:999px;border:1px solid var(--line2);color:var(--text);display:flex;align-items:center;justify-content:center}
.faf-ep.is-playing .faf-ep-icon{background:var(--red);border-color:var(--red);color:#FFFFFF}
.faf-ep.is-playing .faf-ep-title{color:#5B3DF5}
.faf-ep-text{min-width:0;display:flex;flex-direction:column;gap:3px}
.faf-ep-title{font-size:15px;font-weight:700;line-height:1.35}
.faf-ep-meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* transcrição */
body.tr-open #faf-dock{z-index:40;bottom:0 !important}
body.tr-open .faf-panel{height:96vh;height:96dvh;max-height:none}
body.tr-open .faf-head{display:none}
body.tr-open #faf-sheet-body{padding:0 0 150px;gap:0}
.faf-tr-top{position:sticky;top:0;z-index:2;background:rgba(244,246,252,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 16px 10px;display:flex;flex-direction:column;gap:10px}
.faf-tr-bar{display:flex;align-items:center;gap:10px}
.faf-round{flex:0 0 auto;width:38px;height:38px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center}
.faf-tr-heading{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:1px}
.faf-tr-show{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.faf-tr-title{margin:0;font-size:15px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.faf-tools{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.faf-tools::-webkit-scrollbar{display:none}
.faf-chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 11px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:#3E4770;font-size:13px;font-weight:600;white-space:nowrap}
.faf-chip .dot{width:8px;height:8px;border-radius:999px;background:currentColor;opacity:.5}
.faf-chip[aria-pressed="true"]{background:var(--deck2);border-color:transparent;color:var(--text)}
.faf-chip[aria-pressed="true"] .dot{opacity:1}
.faf-chip.pt[aria-pressed="true"] .dot{background:var(--saffron)}
.faf-chip.en[aria-pressed="true"] .dot{background:var(--cyan)}
.faf-chip.es[aria-pressed="true"] .dot{background:var(--red)}
.faf-sep{flex:0 0 auto;width:1px;height:20px;background:var(--line2);margin:0}
.faf-size{flex:0 0 auto;min-width:34px;height:34px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--text);font-weight:700;font-size:13px}
.faf-tr{display:flex;flex-direction:column;padding:18px 16px 0}
.faf-line{position:relative;display:grid;grid-template-columns:44px 1fr;gap:4px 10px;align-items:baseline;text-align:left;width:100%;border:none;background:transparent;color:#4A537A;padding:12px 10px 12px 0;border-radius:0;font-size:var(--tr-size);line-height:1.55;transition:color .25s}
.faf-line-time{font-size:11px;color:#8A93B2;font-variant-numeric:tabular-nums;text-align:right;padding-top:.35em}
.faf-line-body{display:flex;flex-direction:column;gap:4px;min-width:0}
.faf-line-text{font-weight:500}
.faf-line.is-past{color:#9AA2BF}
.faf-line.is-now{color:#141A33}
.faf-line.is-now .faf-line-text{font-weight:700;font-size:1.12em;line-height:1.45}
.faf-line.is-now .faf-line-time{color:var(--red)}
.faf-line.is-now::before{content:"";position:absolute;left:52px;right:0;bottom:4px;height:2px;border-radius:2px;background:var(--line)}
.faf-line.is-now::after{content:"";position:absolute;left:52px;bottom:4px;height:2px;border-radius:2px;background:var(--red);width:calc((100% - 52px) * var(--p,0));transition:width .25s linear}
.faf-line:hover .faf-line-text{color:var(--red)}
.faf-tl{display:none;font-size:.86em;line-height:1.5;font-weight:500}
.faf-tl-pt{color:#5B3DF5}
.faf-tl-en{color:#2F6FE0}
.faf-line.is-past .faf-tl{opacity:.6}
.faf-tl.is-err{color:var(--muted);font-size:12px}
.show-pt .faf-tl-pt,.show-en .faf-tl-en{display:block}
.faf-tr.is-blur .faf-line-text{filter:blur(7px);transition:filter .2s}
.faf-tr.is-blur .faf-line:focus .faf-line-text,.faf-tr.is-blur .faf-line:active .faf-line-text{filter:none}
.faf-tr-foot{padding:18px 16px 0 70px}
#faf-follow{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(122px + env(safe-area-inset-bottom));z-index:3;min-height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line2);background:#FFFFFF;color:var(--text);font-size:13px;font-weight:700;box-shadow:0 10px 24px rgba(20,26,51,.14)}
#faf-follow[hidden]{display:none}
.faf-rd-ctl{flex:0 0 auto;z-index:3;display:flex;align-items:center;justify-content:center;gap:14px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line)}
body.rd-open #faf-sheet-body{padding-bottom:24px}
.faf-rd-play{width:60px;height:60px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(135deg,#5B3DF5,#2F6FE0);box-shadow:0 6px 18px rgba(91,61,245,.35)}
.faf-rd-play svg{width:26px;height:26px}
.faf-rd-btn{width:48px;height:48px;border-radius:50%;border:1px solid var(--line2);background:#fff;color:var(--text);display:flex;align-items:center;justify-content:center}
.faf-rd-speed{min-width:56px;height:40px;border-radius:999px;border:1px solid var(--line2);background:#fff;color:var(--text);font-weight:700;font-size:14px}
.faf-line-time.is-who{font-size:10.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:#5B3DF5;width:auto;min-width:56px;max-width:none;white-space:nowrap;overflow:visible}
.faf-rd-pos{min-width:56px;font-size:13px;color:var(--muted);text-align:center}
/* Curso Premium */
#faf-course{position:fixed;z-index:40;overflow-y:auto;overscroll-behavior:contain;background:var(--ink);--ca:#5B3DF5;--cb:#2F6FE0;--csoft:#EDE9FF;padding:20px 20px 40px;box-sizing:border-box}
#faf-course[hidden]{display:none}
.cc-ico{display:inline-flex;line-height:0}
.cc-loading{padding:40px 8px;color:var(--muted);text-align:center;font-size:15px}
.cc-link{border:none;background:none;color:var(--ca);font-weight:700;text-decoration:underline;padding:0;font-size:inherit}
.cc-head{display:flex;flex-direction:column;gap:14px;margin-bottom:22px}
.cc-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.cc-title{margin:0;font-family:Unbounded,Manrope,sans-serif;font-weight:600;font-size:28px;letter-spacing:-.01em;color:var(--text)}
.cc-sub{margin:4px 0 0;color:var(--muted);font-size:14px}
.cc-premium{flex:0 0 auto;font-size:12px;font-weight:800;letter-spacing:.04em;color:#fff;background:linear-gradient(135deg,var(--ca),var(--cb));padding:6px 12px;border-radius:999px}
.cc-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cc-stat{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.cc-stat strong{font-size:20px;font-weight:800;color:var(--text);line-height:1.1}
.cc-stat-l{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cc-stat.is-flame .cc-ico{color:#B8BFD6}.cc-stat.is-flame.is-lit .cc-ico{color:#FF8A1F}
.cc-stat.is-xp .cc-ico{color:#F2A900}.cc-stat.is-heart .cc-ico{color:#F0476D}
.cc-level{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:7px}
.cc-level-top{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.cc-level-top strong{color:var(--text);font-size:14px}
.cc-bar{height:10px;border-radius:999px;background:var(--deck2);overflow:hidden}
.cc-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--ca),var(--cb));transition:width .5s ease}
.cc-bar.is-goal i{background:linear-gradient(90deg,#FFB020,#FF8A1F)}
.cc-tools{display:flex;flex-wrap:wrap;gap:8px}
.cc-tool{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:#fff;color:var(--text);font-size:13px;font-weight:600}
.cc-tool b{color:var(--ca)}
.cc-tool:hover,.cc-opt:hover:not(:disabled),.cc-chip:hover:not(:disabled){border-color:var(--ca)}
.cc-levels{display:flex;flex-direction:column;gap:26px}
.cc-lv{display:flex;flex-direction:column;gap:12px}
.cc-lv-title{margin:0;display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;color:var(--text)}
.cc-lv-code{font-family:Unbounded,Manrope,sans-serif;font-size:13px;font-weight:600;color:#fff;background:var(--text);border-radius:8px;padding:4px 8px}
.cc-unit{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.cc-unit.is-locked{background:transparent;border-style:dashed;opacity:.8}
.cc-unit.is-open{border-color:var(--ca);box-shadow:0 10px 30px rgba(20,26,51,.06)}
.cc-unit.is-done{border-color:#33C08D}
.cc-unit-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.cc-unit-n{font-size:12px;font-weight:700;color:var(--muted)}
.cc-unit h3{margin:2px 0 0;font-size:16px;color:var(--text)}
.cc-unit p{margin:6px 0 0;font-size:13.5px;color:var(--muted);line-height:1.45}
.cc-badge{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--muted);background:var(--deck2);border-radius:999px;padding:5px 10px}
.cc-badge.is-done{color:#0E6B45;background:#E3F6EC}
.cc-path{list-style:none;margin:34px 0 6px;padding:0;display:flex;flex-direction:column;align-items:center;gap:40px}
.cc-step{display:flex;flex-direction:column;align-items:center;gap:6px;transform:translateX(calc(var(--x) * 34px));position:relative}
.cc-node{width:68px;height:68px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(145deg,var(--ca),var(--cb));box-shadow:0 6px 0 rgba(20,26,51,.18);transition:transform .12s}
.cc-node:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 rgba(20,26,51,.18)}
.cc-node.is-done{background:linear-gradient(145deg,#33C08D,#14915D)}
.cc-node.is-locked{background:#DDE2F0;color:#97A0BD;box-shadow:0 6px 0 #C9D2EA;cursor:not-allowed}
.cc-node.is-current{animation:cc-pulse 1.8s ease-in-out infinite}
.cc-node.is-chest{background:linear-gradient(145deg,#FFC93C,#F29A1F)}
.cc-node.is-chest.is-locked{background:#EFE6CF;color:#C7B98F;box-shadow:0 6px 0 #E3D6B5}
.cc-node.is-chest.is-done{background:#E9EDF8;color:#9AA2BF;box-shadow:0 6px 0 #D6DCEC}
.cc-node.is-test{width:76px;height:76px}
.cc-node.is-big{width:80px;height:80px}
.cc-node-label{font-size:12.5px;font-weight:700;color:var(--text);text-align:center;max-width:140px}
.cc-stars{display:flex;gap:1px;color:#DDE2F0}
.cc-stars .is-on{color:#F2A900}
.cc-start{position:absolute;top:-32px;white-space:nowrap;z-index:1;font-size:12px;font-weight:800;color:var(--ca);background:#fff;border:2px solid var(--ca);border-radius:10px;padding:3px 10px;animation:cc-bob 1.6s ease-in-out infinite}
@keyframes cc-pulse{0%,100%{box-shadow:0 6px 0 rgba(20,26,51,.18),0 0 0 0 rgba(91,61,245,.35)}50%{box-shadow:0 6px 0 rgba(20,26,51,.18),0 0 0 12px rgba(91,61,245,0)}}
@keyframes cc-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* modais e avisos */
.cc-modal{position:fixed;inset:0;z-index:90;background:rgba(20,26,51,.45);display:flex;align-items:center;justify-content:center;padding:20px}
.cc-modal-box{position:relative;overflow:hidden;width:100%;max-width:380px;max-height:86vh;overflow-y:auto;background:#fff;border-radius:22px;padding:24px 20px;display:flex;flex-direction:column;gap:12px;text-align:center;color:var(--text);box-sizing:border-box}
.cc-modal-box.is-wide{max-width:460px;text-align:left}
.cc-modal-box h2{margin:0;font-size:20px}
.cc-muted{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.cc-muted.is-center{text-align:center;width:100%}
.cc-btn{min-height:50px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--ca),var(--cb));color:#fff;font-size:16px;font-weight:800;padding:0 20px;box-shadow:0 4px 0 rgba(20,26,51,.2)}
.cc-btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 rgba(20,26,51,.2)}
.cc-btn:disabled{background:#DDE2F0;color:#8A93B2;box-shadow:none;cursor:not-allowed}
.cc-btn.is-ghost{background:#fff;color:var(--text);border:1px solid var(--line2);box-shadow:none}
.cc-btn.is-wide{width:100%}
.cc-hidden{display:none}
.cc-ach{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.cc-ach li{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--deck2);color:#9AA2BF}
.cc-ach li div{display:flex;flex-direction:column;gap:2px}
.cc-ach li strong{color:var(--muted);font-size:14px}.cc-ach li span{font-size:12.5px}
.cc-ach li.is-got{background:var(--csoft);color:var(--ca)}
.cc-ach li.is-got strong{color:var(--text)}.cc-ach li.is-got span{color:var(--muted)}
.cc-themes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cc-theme{display:flex;align-items:center;gap:8px;min-height:52px;padding:0 12px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--text);font-weight:700;font-size:14px}
.cc-theme.is-on{border-color:var(--ca)}
.cc-theme:disabled{opacity:.55;cursor:not-allowed}
.cc-swatch{display:inline-block;width:22px;height:22px;border-radius:7px;flex:0 0 auto}
.cc-big-ico{width:84px;height:84px;margin:4px auto 0;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(145deg,var(--ca),var(--cb))}
.cc-big-ico .cc-ico svg{width:40px;height:40px}
.cc-big-ico.is-heart{background:linear-gradient(145deg,#FF7A93,#F0476D)}
.cc-big-ico.is-level{background:linear-gradient(145deg,#FFC93C,#F29A1F)}
.cc-big-ico strong{font-family:Unbounded,Manrope,sans-serif;font-size:34px}
.cc-toast{position:fixed;left:50%;top:14px;z-index:120;transform:translate(-50%,-140%);transition:transform .3s ease;display:flex;gap:12px;align-items:center;background:var(--text);color:#fff;border-radius:16px;padding:12px 16px;box-shadow:0 14px 30px rgba(20,26,51,.25);max-width:calc(100vw - 32px)}
.cc-toast.is-in{transform:translate(-50%,0)}
.cc-toast .cc-ico{color:#FFC93C}
.cc-toast div{display:flex;flex-direction:column;font-size:13px}.cc-toast strong{font-size:14px}
.cc-confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.cc-chest{margin:6px auto 0;width:120px;height:120px;border:none;border-radius:28px;background:linear-gradient(145deg,#FFC93C,#F29A1F);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 0 #D9800F}
.cc-chest .cc-ico svg{width:64px;height:64px}
.cc-chest.is-shake{animation:cc-shake .6s ease}
.cc-chest.is-open{transform:scale(1.08);background:linear-gradient(145deg,#FFE08A,#FFC93C)}
@keyframes cc-shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
.cc-chest-info{display:flex;flex-direction:column;gap:10px}
.cc-rewards{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;text-align:left}
.cc-rewards li{display:flex;align-items:center;gap:10px;background:var(--deck2);border-radius:12px;padding:10px 12px;font-weight:700}
.cc-rewards .cc-ico{color:var(--ca)}

/* lição */
body.cc-locked{overflow:hidden}
.cc-lesson{position:fixed;inset:0;z-index:80;background:#fff;display:flex;flex-direction:column;color:var(--text);overflow:hidden}
.cc-lesson.is-shake{animation:cc-nudge .35s ease}
@keyframes cc-nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.cc-l-top{display:flex;align-items:center;gap:12px;padding:14px 16px 6px;padding-top:max(14px,env(safe-area-inset-top));max-width:680px;width:100%;margin:0 auto;box-sizing:border-box}
.cc-bar.is-lesson{flex:1 1 auto;height:14px}
.cc-icon-btn{width:44px;height:44px;border:none;background:none;color:#8A93B2;display:flex;align-items:center;justify-content:center;border-radius:12px;flex:0 0 auto}
.cc-l-hearts{display:flex;align-items:center;gap:4px;color:#F0476D;font-weight:800;font-size:17px;min-width:40px;justify-content:flex-end}
.cc-l-score{color:var(--text);font-size:15px}
.cc-combo{height:22px;text-align:center;font-size:13px;font-weight:800;color:#FF8A1F;opacity:0;transform:scale(.8);transition:all .2s}
.cc-combo.is-on{opacity:1;transform:scale(1)}
.cc-l-main{flex:1 1 auto;overflow-y:auto;padding:10px 20px 20px;max-width:640px;width:100%;margin:0 auto;box-sizing:border-box;display:flex;flex-direction:column;gap:16px;position:relative}
.cc-kicker{margin:0;font-size:13px;font-weight:800;color:var(--ca);letter-spacing:.02em}
.cc-kicker.is-retry{color:#E0663A}
.cc-l-title{margin:0;font-size:24px;font-weight:800;text-align:inherit}
.cc-tip{margin:0;font-size:15.5px;line-height:1.55;color:#3E4770;background:var(--csoft);border-radius:14px;padding:14px 16px}
.cc-tip.is-center{text-align:center;background:none;padding:0}
.cc-vocab{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.cc-vocab li{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.cc-vocab li div{display:flex;flex-direction:column}
.cc-vocab strong{font-size:17px;line-height:1.35}.cc-vocab span{font-size:13.5px;color:var(--muted)}
.cc-say{width:44px;height:44px;flex:0 0 auto;border-radius:12px;border:none;background:var(--csoft);color:var(--ca);display:inline-flex;align-items:center;justify-content:center}
.cc-say.is-inline{width:40px;height:40px;margin-right:10px;vertical-align:middle}
.cc-q{margin:0;font-size:22px;line-height:1.35;font-weight:700}
.cc-blank{display:inline-block;min-width:80px;border-bottom:3px solid var(--ca);color:var(--ca);text-align:center;padding:0 6px;white-space:pre}
.cc-listen{display:flex;gap:14px;justify-content:center;padding:12px 0}
.cc-play{width:96px;height:96px;border-radius:24px;border:none;background:linear-gradient(145deg,var(--ca),var(--cb));color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 rgba(20,26,51,.2)}
.cc-play .cc-ico svg{width:44px;height:44px}
.cc-play.is-slow{width:64px;height:64px;align-self:flex-end;border-radius:18px}
.cc-play.is-slow .cc-ico svg{width:28px;height:28px}
.cc-opts{display:flex;flex-direction:column;gap:10px}
.cc-opt{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--text);font-size:16.5px;font-weight:600;text-align:left;box-shadow:0 3px 0 var(--line)}
.cc-opt-n{width:26px;height:26px;flex:0 0 auto;border-radius:8px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.cc-opt.is-sel{border-color:var(--ca);background:var(--csoft);box-shadow:0 3px 0 var(--ca)}
.cc-opt.is-sel .cc-opt-n{border-color:var(--ca);color:var(--ca)}
.cc-opt:disabled{cursor:default}
.cc-match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cc-col{display:flex;flex-direction:column;gap:10px}
.cc-opt.is-match{justify-content:center;text-align:center;min-height:58px}
.cc-opt.is-ok{border-color:#33C08D;background:#E3F6EC;color:#0E6B45;box-shadow:none;opacity:.7}
.cc-opt.is-bad{border-color:#F0476D;background:#FDECF0;color:#B4234A}
.cc-build{min-height:62px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:10px 0;border-bottom:2px solid var(--line);border-top:2px solid var(--line)}
.cc-bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-top:6px}
.cc-chip{min-height:46px;padding:0 14px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--text);font-size:16px;font-weight:600;box-shadow:0 3px 0 var(--line)}
.cc-chip.is-used{color:transparent;background:var(--deck2);border-color:var(--deck2);box-shadow:none}
.cc-l-foot{flex:0 0 auto;padding:14px 20px;padding-bottom:max(18px,env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px;max-width:680px;width:100%;margin:0 auto;box-sizing:border-box;transition:background .2s}
.cc-l-foot.is-ok{background:#E3F6EC;border-color:#BFE8D3}
.cc-l-foot.is-bad{background:#FDECF0;border-color:#F7C9D5}
.cc-l-foot.is-ok .cc-btn{background:linear-gradient(135deg,#33C08D,#14915D)}
.cc-l-foot.is-bad .cc-btn{background:linear-gradient(135deg,#FF6B8B,#E0365E)}
.cc-fb{display:flex;flex-direction:column;gap:4px}
.cc-fb strong{font-size:19px}
.cc-l-foot.is-ok .cc-fb strong{color:#0E6B45}.cc-l-foot.is-bad .cc-fb strong{color:#B4234A}
.cc-fb span{font-size:15px;color:var(--text)}
.cc-result{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-top:20px}
.cc-res-stars{display:flex;gap:10px;color:#DDE2F0}
.cc-res-stars .cc-ico svg{width:58px;height:58px}
.cc-res-stars .is-on{color:#F2A900;animation:cc-pop .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes cc-pop{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
.cc-res-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:360px}
.cc-res-grid div{border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.cc-res-grid strong{font-size:22px;color:var(--ca)}
.cc-res-grid span{font-size:12.5px;color:var(--muted)}
.cc-streak-line{display:flex;align-items:center;gap:6px;margin:0;font-weight:800;color:#FF8A1F}
@media (prefers-reduced-motion:reduce){.cc-node.is-current,.cc-start,.cc-chest.is-shake,.cc-lesson.is-shake{animation:none}}

/* ===== Visual de jogo (futurista) ===== */
#faf-course{background:radial-gradient(120% 60% at 50% 0%,#6C4BFF 0%,rgba(108,75,255,0) 60%),linear-gradient(180deg,#3A23C9 0%,#4B33E0 30%,#3567EA 70%,#2A86E8 100%);color:#fff;isolation:isolate}
#faf-course::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:34px 34px;mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.35) 60%,transparent 100%);-webkit-mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.35) 60%,transparent 100%)}
.cc-stars-bg{position:absolute;inset:0;height:100%;min-height:100%;z-index:-1;pointer-events:none;background-image:radial-gradient(2px 2px at 12% 18%,#fff,transparent),radial-gradient(1.5px 1.5px at 78% 9%,#fff,transparent),radial-gradient(2px 2px at 64% 34%,rgba(255,255,255,.8),transparent),radial-gradient(1.5px 1.5px at 30% 52%,#fff,transparent),radial-gradient(2px 2px at 88% 61%,rgba(255,255,255,.7),transparent),radial-gradient(1.5px 1.5px at 8% 78%,#fff,transparent),radial-gradient(2px 2px at 46% 88%,rgba(255,255,255,.8),transparent);background-size:100% 900px;animation:cc-twinkle 4s ease-in-out infinite alternate}
@keyframes cc-twinkle{from{opacity:.55}to{opacity:1}}
#faf-course .cc-loading{color:rgba(255,255,255,.85)}
#faf-course .cc-title{color:#fff;font-size:30px;text-shadow:0 0 24px rgba(124,243,255,.45)}
#faf-course .cc-sub{color:rgba(255,255,255,.78)}
#faf-course .cc-premium{background:linear-gradient(135deg,#FFE27A,#FFB020);color:#3A2400;box-shadow:0 0 0 1px rgba(255,255,255,.4) inset,0 0 18px rgba(255,200,60,.55)}
.cc-stat,.cc-level,#faf-course .cc-unit.is-open,#faf-course .cc-tool{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.26);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 28px rgba(16,8,80,.25),inset 0 1px 0 rgba(255,255,255,.25)}
#faf-course .cc-stat strong{color:#fff;font-family:Unbounded,Manrope,sans-serif;font-size:19px}
#faf-course .cc-stat-l{color:rgba(255,255,255,.75)}
#faf-course .cc-stat.is-flame .cc-ico{color:rgba(255,255,255,.45)}
#faf-course .cc-stat.is-flame.is-lit .cc-ico{color:#FFB547;filter:drop-shadow(0 0 6px #FF8A1F)}
#faf-course .cc-stat.is-xp .cc-ico{color:#FFE27A;filter:drop-shadow(0 0 6px rgba(255,210,80,.8))}
#faf-course .cc-stat.is-heart .cc-ico{color:#FF6B8B;filter:drop-shadow(0 0 6px rgba(255,80,120,.8))}
.cc-hud{display:flex;align-items:center;gap:14px}
.cc-ring{position:relative;width:72px;height:72px;flex:0 0 auto;filter:drop-shadow(0 0 10px rgba(124,243,255,.45))}
.cc-ring svg{display:block}
.cc-ring-p{transition:stroke-dashoffset 1s ease}
.cc-ring strong{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Unbounded,Manrope,sans-serif;font-size:22px;color:#fff}
.cc-hud-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.cc-hud-k{font-size:11px;font-weight:800;letter-spacing:.14em;color:#7CF3FF}
.cc-hud-txt strong{font-size:18px;color:#fff}
.cc-hud-s{font-size:12.5px;color:rgba(255,255,255,.75)}
#faf-course .cc-level-top{color:rgba(255,255,255,.8)}
#faf-course .cc-level-top strong{color:#fff}
#faf-course .cc-bar{background:rgba(255,255,255,.16);height:12px;position:relative}
#faf-course .cc-bar i{background:linear-gradient(90deg,#7CF3FF,#C38BFF);box-shadow:0 0 12px rgba(124,243,255,.7);position:relative;overflow:hidden}
#faf-course .cc-bar.is-goal i{background:linear-gradient(90deg,#FFE27A,#FF8A1F);box-shadow:0 0 12px rgba(255,160,40,.7)}
.cc-bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.55) 50%,transparent 80%);transform:translateX(-100%);animation:cc-shine 2.4s ease-in-out infinite}
@keyframes cc-shine{60%,100%{transform:translateX(100%)}}
#faf-course .cc-tool{color:#fff;border-radius:12px}
#faf-course .cc-tool b{color:#7CF3FF}
#faf-course .cc-tool:hover{border-color:#7CF3FF;box-shadow:0 0 16px rgba(124,243,255,.35)}
#faf-course .cc-lv-title{color:#fff;font-family:Unbounded,Manrope,sans-serif;font-weight:600;font-size:16px;letter-spacing:.01em}
#faf-course .cc-lv-code{background:linear-gradient(135deg,#7CF3FF,#C38BFF);color:#1B1060;box-shadow:0 0 14px rgba(124,243,255,.55)}
#faf-course .cc-unit{color:#fff}
#faf-course .cc-unit.is-open{border-color:rgba(124,243,255,.55);border-radius:22px}
#faf-course .cc-unit.is-done{border-color:rgba(80,240,170,.7)}
#faf-course .cc-unit.is-locked{background:rgba(10,6,60,.18);border:1px dashed rgba(255,255,255,.28);opacity:1}
#faf-course .cc-unit.is-locked h3{color:rgba(255,255,255,.7)}
#faf-course .cc-unit-n{color:#7CF3FF;letter-spacing:.08em;text-transform:uppercase;font-size:11px}
#faf-course .cc-unit h3{color:#fff;font-size:18px}
#faf-course .cc-unit p{color:rgba(255,255,255,.78)}
#faf-course .cc-badge{background:rgba(255,255,255,.14);color:rgba(255,255,255,.85)}
#faf-course .cc-badge.is-done{background:rgba(80,240,170,.2);color:#9CFFD5}
#faf-course .cc-path{position:relative}
.cc-wire{position:absolute;left:0;top:0;z-index:0;pointer-events:none;overflow:visible}
.cc-wire-bg{fill:none;stroke:rgba(255,255,255,.28);stroke-width:5;stroke-dasharray:2 12;stroke-linecap:round}
.cc-wire-on{fill:none;stroke:#7CF3FF;stroke-width:5;stroke-linecap:round;filter:drop-shadow(0 0 6px #7CF3FF)}
#faf-course .cc-step{z-index:1}
#faf-course .cc-node{background:radial-gradient(circle at 35% 30%,#B9A6FF 0%,#7B5CFF 35%,#4B2FE0 100%);box-shadow:0 7px 0 #2A178F,0 0 0 4px rgba(255,255,255,.18),0 0 26px rgba(160,130,255,.75)}
#faf-course .cc-node.is-done{background:radial-gradient(circle at 35% 30%,#B8FFE2 0%,#3FE0A0 38%,#139A69 100%);box-shadow:0 7px 0 #0B6B48,0 0 0 4px rgba(255,255,255,.18),0 0 24px rgba(63,224,160,.7)}
#faf-course .cc-node.is-locked{background:rgba(255,255,255,.14);color:rgba(255,255,255,.55);box-shadow:0 7px 0 rgba(16,8,80,.35),inset 0 0 0 2px rgba(255,255,255,.2)}
#faf-course .cc-node.is-chest{background:radial-gradient(circle at 35% 30%,#FFF1B0 0%,#FFC93C 40%,#F08A10 100%);box-shadow:0 7px 0 #A85A00,0 0 0 4px rgba(255,255,255,.18),0 0 26px rgba(255,190,60,.8);color:#5A3300}
#faf-course .cc-node.is-chest.is-locked{background:rgba(255,220,120,.18);color:rgba(255,230,160,.7);box-shadow:0 7px 0 rgba(16,8,80,.35),inset 0 0 0 2px rgba(255,220,120,.35)}
#faf-course .cc-node.is-chest.is-done{background:rgba(255,255,255,.14);color:rgba(255,255,255,.6);box-shadow:0 7px 0 rgba(16,8,80,.35)}
#faf-course .cc-node.is-test{border-radius:22px;transform:rotate(45deg)}
#faf-course .cc-node.is-test .cc-ico{transform:rotate(-45deg)}
#faf-course .cc-node.is-test:not(.is-locked):not(.is-done){background:radial-gradient(circle at 35% 30%,#FFD1F3 0%,#FF5FC8 40%,#B21F9A 100%);box-shadow:0 7px 0 #74115F,0 0 0 4px rgba(255,255,255,.18),0 0 28px rgba(255,95,200,.75)}
#faf-course .cc-node.is-current{animation:cc-glow 1.6s ease-in-out infinite}
@keyframes cc-glow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.18)}}
#faf-course .cc-node.is-current::after{content:"";position:absolute;inset:-12px;border-radius:inherit;border:2px solid rgba(124,243,255,.85);animation:cc-ripple 1.8s ease-out infinite;pointer-events:none}
#faf-course .cc-node{position:relative}
@keyframes cc-ripple{0%{transform:scale(.85);opacity:1}100%{transform:scale(1.35);opacity:0}}
#faf-course .cc-node-label{color:#fff;text-shadow:0 2px 8px rgba(16,8,80,.6);font-size:13px}
#faf-course .cc-stars{color:rgba(255,255,255,.3)}
#faf-course .cc-stars .is-on{color:#FFE27A;filter:drop-shadow(0 0 4px rgba(255,210,80,.9))}
#faf-course .cc-start{background:#fff;color:#4B2FE0;border:none;box-shadow:0 0 0 3px #7CF3FF,0 0 22px rgba(124,243,255,.8);letter-spacing:.06em;text-transform:uppercase;font-size:11.5px}

/* lição com acabamento de jogo */
.cc-lesson{background:radial-gradient(90% 40% at 50% 0%,var(--csoft) 0%,#fff 70%)}
.cc-bar.is-lesson{height:16px;background:#E9EDF8;box-shadow:inset 0 2px 3px rgba(20,26,51,.08)}
.cc-bar.is-lesson i{background:linear-gradient(90deg,#3FE0A0,#7CF3FF,var(--ca));box-shadow:0 0 12px rgba(63,224,160,.6);position:relative;overflow:hidden}
.cc-combo{display:flex;align-items:center;justify-content:center;gap:4px;height:26px}
.cc-combo.is-on{color:#fff;background:linear-gradient(135deg,#FFB020,#FF5F3C);border-radius:999px;width:max-content;margin:0 auto;padding:0 12px;box-shadow:0 0 18px rgba(255,120,40,.6);letter-spacing:.05em;animation:cc-combo .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes cc-combo{0%{transform:scale(.6)}100%{transform:scale(1)}}
.cc-kicker{text-transform:uppercase;letter-spacing:.1em;font-size:11.5px}
.cc-opt{transition:transform .08s,border-color .15s,box-shadow .15s}
.cc-opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 var(--line)}
.cc-opt.is-sel{box-shadow:0 3px 0 var(--ca),0 0 0 4px rgba(91,61,245,.12)}
.cc-play{box-shadow:0 6px 0 rgba(20,26,51,.2),0 0 26px rgba(91,61,245,.45)}
.cc-l-foot.is-ok{background:linear-gradient(180deg,#E3F6EC,#D2F5E3)}
.cc-l-foot.is-bad{background:linear-gradient(180deg,#FDECF0,#FBDDE5)}
.cc-l-foot.is-ok .cc-fb strong::before{content:"✓ ";}
.cc-l-foot.is-bad .cc-fb strong::before{content:"✕ ";}
.cc-result{position:relative}
.cc-lesson:has(.cc-result){background:radial-gradient(120% 60% at 50% 0%,#6C4BFF 0%,rgba(108,75,255,0) 60%),linear-gradient(180deg,#3A23C9,#3567EA)}
.cc-lesson:has(.cc-result) .cc-l-title{color:#fff;font-family:Unbounded,Manrope,sans-serif;font-weight:600;text-shadow:0 0 22px rgba(124,243,255,.5)}
.cc-lesson:has(.cc-result) .cc-tip.is-center{color:rgba(255,255,255,.85)}
.cc-lesson:has(.cc-result) .cc-res-grid div{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.28);backdrop-filter:blur(10px)}
.cc-lesson:has(.cc-result) .cc-res-grid strong{color:#fff;font-family:Unbounded,Manrope,sans-serif;font-size:20px}
.cc-lesson:has(.cc-result) .cc-res-grid .is-xp strong{color:#FFE27A;text-shadow:0 0 14px rgba(255,210,80,.7)}
.cc-lesson:has(.cc-result) .cc-res-grid span{color:rgba(255,255,255,.75)}
.cc-lesson:has(.cc-result) .cc-res-stars{color:rgba(255,255,255,.25)}
.cc-lesson:has(.cc-result) .cc-res-stars .is-on{color:#FFE27A;filter:drop-shadow(0 0 12px rgba(255,210,80,.9))}
.cc-lesson:has(.cc-result) .cc-streak-line{color:#FFD08A}
.cc-lesson:has(.cc-result) .cc-l-foot{border-top-color:rgba(255,255,255,.2);background:transparent}
.cc-lesson:has(.cc-result) .cc-l-foot .cc-btn{background:#fff;color:#4B2FE0;box-shadow:0 5px 0 #2A178F,0 0 24px rgba(124,243,255,.6)}
.cc-lesson:has(.cc-result) .cc-l-top .cc-bar{background:rgba(255,255,255,.2)}
.cc-lesson:has(.cc-result) .cc-icon-btn,.cc-lesson:has(.cc-result) .cc-l-hearts{color:#fff}
.cc-lesson:has(.cc-result) .cc-big-ico{box-shadow:0 0 34px rgba(255,210,80,.7)}
.cc-modal-box{box-shadow:0 30px 80px rgba(16,8,80,.35)}
.cc-big-ico.is-level{box-shadow:0 0 40px rgba(255,200,60,.75);animation:cc-pop .5s cubic-bezier(.2,1.6,.4,1)}
@media (prefers-reduced-motion:reduce){.cc-stars-bg,.cc-bar i::after,#faf-course .cc-node.is-current::after,#faf-course .cc-node.is-current{animation:none}}

/* ===== Conversa com a Lía ===== */
.cc-lia-card{display:flex;align-items:center;gap:14px;width:100%;margin:0 0 24px;padding:16px;border-radius:22px;border:1px solid rgba(255,255,255,.35);text-align:left;color:#fff;background:linear-gradient(120deg,rgba(255,95,200,.35),rgba(124,243,255,.25));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(16,8,80,.3),0 0 30px rgba(255,95,200,.25),inset 0 1px 0 rgba(255,255,255,.3);position:relative;overflow:hidden}
.cc-lia-card::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.25) 50%,transparent 70%);transform:translateX(-100%);animation:cc-shine 3.2s ease-in-out infinite;pointer-events:none}
.cc-lia-avatar{flex:0 0 auto;width:54px;height:54px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-family:Unbounded,Manrope,sans-serif;font-weight:600;font-size:24px;color:#fff;background:conic-gradient(from 210deg,#7CF3FF,#C38BFF,#FF5FC8,#7CF3FF);box-shadow:0 0 0 3px rgba(255,255,255,.35),0 0 22px rgba(195,139,255,.8);animation:cc-avatar 6s linear infinite}
@keyframes cc-avatar{0%,100%{filter:hue-rotate(0deg)}50%{filter:hue-rotate(25deg)}}
.cc-lia-avatar.is-sm{width:38px;height:38px;border-radius:12px;font-size:17px}
.cc-lia-avatar.is-xl{width:84px;height:84px;border-radius:26px;font-size:38px;margin:0 auto}
.cc-lia-txt{display:flex;flex-direction:column;gap:4px;font-size:13.5px;line-height:1.4;color:rgba(255,255,255,.9)}
.cc-lia-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cc-lia-top strong{font-size:17px;color:#fff}
.cc-lia-tag{font-size:10.5px;font-weight:800;letter-spacing:.1em;color:#1B1060;background:#7CF3FF;border-radius:999px;padding:3px 8px;box-shadow:0 0 12px rgba(124,243,255,.7)}
.cc-chat{background:radial-gradient(120% 50% at 50% 0%,#EDE9FF 0%,#F4F6FC 60%)}
.cc-chat-top{display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));border-bottom:1px solid var(--line);background:rgba(255,255,255,.85);backdrop-filter:blur(10px)}
.cc-chat-id{display:flex;flex-direction:column;line-height:1.2}
.cc-chat-id strong{font-size:16px}
.cc-chat-sub{font-size:12px;color:var(--muted)}
.cc-chat-main{flex:1 1 auto;overflow-y:auto;padding:18px 16px;max-width:680px;width:100%;margin:0 auto;box-sizing:border-box;display:flex;flex-direction:column;gap:12px}
.cc-chat-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:8px 0 6px}
.cc-chat-hero h2{margin:6px 0 0;font-family:Unbounded,Manrope,sans-serif;font-weight:600;font-size:22px}
.cc-chat-hero p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.5;max-width:420px}
.cc-chips{display:flex;gap:8px;flex-wrap:wrap}
.cc-chat .cc-tool{min-width:56px;min-height:42px;border-radius:12px;background:#fff;border:2px solid var(--line);color:var(--text);font-weight:800}
.cc-chat .cc-tool.is-on{border-color:var(--ca);background:var(--csoft);color:var(--ca)}
.cc-scenes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cc-scene{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px;border-radius:16px;border:2px solid var(--line);background:#fff;color:var(--text);box-shadow:0 3px 0 var(--line);min-height:84px}
.cc-scene strong{font-size:15px}.cc-scene span{font-size:12.5px;color:var(--muted);line-height:1.35}
.cc-scene:hover{border-color:var(--ca)}
.cc-chat-note{margin:6px 0 0;font-size:12px;color:var(--muted);line-height:1.45;text-align:center}
.cc-msgs{display:flex;flex-direction:column;gap:12px}
.cc-msg{max-width:84%;padding:12px 14px;border-radius:18px;font-size:16px;line-height:1.45;animation:cc-in .25s ease}
@keyframes cc-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.cc-msg p{margin:0}
.cc-msg.is-lia{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:6px;box-shadow:0 6px 18px rgba(20,26,51,.06)}
.cc-msg.is-me{align-self:flex-end;color:#fff;background:linear-gradient(135deg,var(--ca),var(--cb));border-bottom-right-radius:6px;box-shadow:0 6px 18px rgba(91,61,245,.25)}
.cc-msg.is-me.is-good::after{content:"✓";display:inline-block;margin-left:8px;font-weight:800;color:#9CFFD5}
.cc-msg-tr{margin-top:8px!important;padding-top:8px;border-top:1px dashed var(--line);color:var(--muted);font-size:14.5px}
.cc-msg-tools{display:flex;gap:6px;margin-top:8px}
.cc-msg-tools button{min-height:34px;min-width:34px;padding:0 10px;border-radius:10px;border:none;background:var(--csoft);color:var(--ca);font-weight:700;font-size:13px;display:inline-flex;align-items:center;justify-content:center}
.cc-msg-tools .cc-ico svg{width:18px;height:18px}
.cc-msg-note{margin-top:8px!important;font-size:13px;color:#8A5A00;background:#FFF4D6;border-radius:10px;padding:8px 10px}
.cc-fix{margin-top:10px;padding:10px 12px;border-radius:12px;background:#FFF4D6;color:#5A3A00;display:flex;flex-direction:column;gap:2px;font-size:14px;line-height:1.4}
.cc-fix strong{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#B26B00}
.cc-msg.is-typing{display:flex;gap:5px;padding:14px 16px}
.cc-msg.is-typing i{width:8px;height:8px;border-radius:50%;background:var(--ca);opacity:.4;animation:cc-dot 1s infinite}
.cc-msg.is-typing i:nth-child(2){animation-delay:.15s}.cc-msg.is-typing i:nth-child(3){animation-delay:.3s}
@keyframes cc-dot{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
.cc-chat-foot{flex:0 0 auto;border-top:1px solid var(--line);background:rgba(255,255,255,.92);backdrop-filter:blur(10px);padding:10px 14px;padding-bottom:max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.cc-chat-foot:empty{display:none}
.cc-sugg{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;max-width:680px;width:100%;margin:0 auto}
.cc-sugg:empty{display:none}
.cc-sugg-chip{flex:0 0 auto;min-height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--ca);background:var(--csoft);color:var(--ca);font-weight:700;font-size:14px;white-space:nowrap}
.cc-input-row{display:flex;align-items:flex-end;gap:8px;max-width:680px;width:100%;margin:0 auto}
.cc-input{flex:1 1 auto;min-height:48px;max-height:120px;resize:none;box-sizing:border-box;padding:12px 14px;border-radius:16px;border:2px solid var(--line);font:inherit;font-size:16px;color:var(--text);background:#fff;outline:none}
.cc-input:focus{border-color:var(--ca)}
.cc-send,.cc-mic{flex:0 0 auto;width:48px;height:48px;border-radius:16px;border:none;display:flex;align-items:center;justify-content:center}
.cc-send{color:#fff;background:linear-gradient(135deg,var(--ca),var(--cb));box-shadow:0 0 16px rgba(91,61,245,.35)}
.cc-send:disabled{background:#DDE2F0;box-shadow:none;color:#8A93B2}
.cc-mic{background:var(--csoft);color:var(--ca)}
.cc-mic.is-rec{background:#FF5F7E;color:#fff;animation:cc-glow 1s ease-in-out infinite}

.cc-voice-toggle{margin-left:auto;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--ca);background:var(--csoft);color:var(--ca);font-size:12.5px;font-weight:800;white-space:nowrap}
.cc-voice-toggle[aria-pressed="false"]{border-color:var(--line2);background:#fff;color:var(--muted)}
.cc-msg-tools button.is-loading{animation:cc-glow .8s ease-in-out infinite;opacity:.7}

/* etapas premium */
#faf-course .cc-node.is-premium:not(.is-locked):not(.is-done){background:radial-gradient(circle at 35% 30%,#FFF6C8 0%,#FFD24A 35%,#E08A00 100%);color:#4A2A00;box-shadow:0 7px 0 #9A5A00,0 0 0 4px rgba(255,226,122,.5),0 0 30px rgba(255,200,60,.85)}
#faf-course .cc-node.is-premium.is-locked{box-shadow:0 7px 0 rgba(16,8,80,.35),inset 0 0 0 2px rgba(255,226,122,.55)}
.cc-node-tag{font-size:9.5px;font-weight:800;letter-spacing:.14em;color:#3A2400;background:linear-gradient(135deg,#FFE27A,#FFB020);border-radius:999px;padding:2px 8px;box-shadow:0 0 10px rgba(255,200,60,.6)}
.cc-kicker-premium{color:#B26B00}
.cc-premium-actions{display:flex;gap:10px;flex-wrap:wrap}
.cc-premium-actions .cc-btn{min-height:46px;font-size:15px}
.cc-vocab.is-dialog li{align-items:flex-start}
.cc-dlg-who{font-size:12px!important;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ca)!important}
body.cc-locked #faf-sheet{z-index:96}

</style>
</head>
<body>
<template id="app-template">
<div style="width: 100%; max-width: 560px; margin: 0 auto; height: 100vh; height: 100dvh; box-sizing: border-box; display: flex; flex-direction: column; background: #F4F6FC; color: #141A33; font-family: Inter, system-ui, sans-serif; overflow: hidden">

<div id="scroller" style="flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: calc(24px + env(safe-area-inset-top)) 20px 28px 20px; box-sizing: border-box">

<!-- ============ INÍCIO ============ -->
<sc-if value="{{showInicio}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 20px">
  <div style="display: flex; flex-direction: column; gap: 4px; padding-top: 8px">
    <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.01em; color: #5B3DF5">Frase a Frase</span>
    <h1 style="margin: 0; font-family: Unbounded, 'Manrope', system-ui, sans-serif; font-weight: 600; letter-spacing: -0.01em; font-size: 34px; line-height: 1.1;">¡Hola! Vamos praticar?</h1>
  </div>

  <button onClick="{{goCurso}}" aria-label="Abrir o Curso Premium" style="display: flex; flex-direction: column; gap: 10px; text-align: left; border: none; border-radius: 20px; padding: 18px; color: #FFFFFF; background: linear-gradient(135deg, #5B3DF5, #2F6FE0); box-shadow: 0 12px 28px rgba(59,45,184,0.25)">
    <span style="display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%">
      <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.04em; background: rgba(255,255,255,0.2); border-radius: 999px; padding: 4px 10px">PREMIUM</span>
      <span style="font-size: 13px; font-weight: 700; opacity: 0.9">{{courseStats}}</span>
    </span>
    <span style="font-size: 20px; font-weight: 800">{{courseTitle}}</span>
    <span style="font-size: 14px; opacity: 0.9; line-height: 1.4">{{courseSub}}</span>
  </button>

  <div style="background: #FFFFFF; border: 1px solid #E1E6F3; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <span style="font-size: 15px; font-weight: 700">Meta de hoje</span>
      <span style="font-size: 14px; color: #5D6788">{{goalCount}} de {{goalTotal}} atividades</span>
    </div>
    <div style="height: 10px; background: #E9EDF8; border-radius: 999px; overflow: hidden">
      <div style="{{goalBar}}"></div>
    </div>
    <span style="font-size: 13px; color: #5D6788">{{goalMsg}}</span>
  </div>

  <div style="background: #3B2DB8; color: #FFFFFF; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 12px">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.01em; color: #FFD34D">Frase do dia · {{dia.cat}}</span>
    <p style="margin: 0; font-family: Manrope, system-ui, sans-serif; font-weight: 600; font-size: 26px; line-height: 1.2">{{dia.es}}</p>
    <p style="margin: 0; font-size: 15px; color: #D9DCFF">{{dia.pt}}</p>
    <sc-if value="{{dia.hasNota}}" hint-placeholder-val="{{ true }}">
      <p style="margin: 0; font-size: 13px; line-height: 1.45; color: #B9BEF0">{{dia.nota}}</p>
    </sc-if>
    <button onClick="{{speakDia}}" style="align-self: flex-start; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border: 1px solid rgba(255,255,255,0.45); background: transparent; color: #FFFFFF; border-radius: 999px; font-size: 14px; font-weight: 600">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5Z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M19 5a10 10 0 0 1 0 14"></path></svg>
      Ouvir
    </button>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
    <div style="background: #FFFFFF; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 2px; border: 1px solid #E1E6F3">
      <span style="font-family: Manrope, system-ui, sans-serif; font-size: 26px; font-weight: 700">{{knownCount}}</span>
      <span style="font-size: 12px; line-height: 1.3; color: #5D6788">de {{phraseTotal}} frases que você sabe</span>
    </div>
    <div style="background: #FFFFFF; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 2px; border: 1px solid #E1E6F3">
      <span style="font-family: Manrope, system-ui, sans-serif; font-size: 26px; font-weight: 700">{{reviewCount}}</span>
      <span style="font-size: 12px; line-height: 1.3; color: #5D6788">frases para revisar</span>
    </div>
    <div style="background: #FFFFFF; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 2px; border: 1px solid #E1E6F3">
      <span style="font-family: Manrope, system-ui, sans-serif; font-size: 26px; font-weight: 700">{{readCount}}</span>
      <span style="font-size: 12px; line-height: 1.3; color: #5D6788">de {{textTotal}} textos concluídos</span>
    </div>
  </div>

  <sc-if value="{{hasReview}}" hint-placeholder-val="{{ false }}">
    <button onClick="{{goReview}}" style="min-height: 52px; border: none; background: #5B3DF5; color: #FFFFFF; border-radius: 14px; font-size: 15px; font-weight: 600">Revisar agora ({{reviewCount}})</button>
  </sc-if>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <h2 style="margin: 0; font-size: 16px; font-weight: 700">Continuar</h2>
    <button onClick="{{goFrases}}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; background: #FFFFFF; border: 1px solid #E1E6F3; border-radius: 16px; padding: 16px; color: #141A33">
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 16px; font-weight: 600">Frases por situação</span>
        <span style="font-size: 13px; color: #5D6788">{{homeCatsLine}}</span>
      </span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
    </button>
    <button onClick="{{goTextos}}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; background: #FFFFFF; border: 1px solid #E1E6F3; border-radius: 16px; padding: 16px; color: #141A33">
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 16px; font-weight: 600">Leitura guiada</span>
        <span style="font-size: 13px; color: #5D6788">{{homeTextsLine}}</span>
      </span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
    </button>
    <button onClick="{{goPratica}}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; background: #FFFFFF; border: 1px solid #E1E6F3; border-radius: 16px; padding: 16px; color: #141A33">
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 16px; font-weight: 600">Prática</span>
        <span style="font-size: 13px; color: #5D6788">Montar frases, escuta e lacunas</span>
      </span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
    </button>
    <button onClick="{{goOuvir}}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; background: #FFFFFF; border: 1px solid #E1E6F3; border-radius: 16px; padding: 16px; color: #141A33">
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 16px; font-weight: 600">Ouvir e assistir</span>
        <span style="font-size: 13px; color: #5D6788">Podcasts e vídeos reais de falantes nativos</span>
      </span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
    </button>
  </div>

  <div style="background: #FFFFFF; border: 1px solid #E1E6F3; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
    <h2 style="margin: 0; font-size: 16px; font-weight: 700">Áudio</h2>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; color: #5D6788">Sotaque</span>
      <div style="display: flex; gap: 8px">
        <button onClick="{{setSpain}}" style="{{accentSpain}}">Espanha</button>
        <button onClick="{{setMexico}}" style="{{accentMexico}}">México</button>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; color: #5D6788">Velocidade</span>
      <div style="display: flex; gap: 8px">
        <button onClick="{{setNormal}}" style="{{rateNormal}}">Normal</button>
        <button onClick="{{setSlow}}" style="{{rateSlow}}">Lenta</button>
      </div>
    </div>
    <button onClick="{{resetAll}}" style="align-self: flex-start; min-height: 44px; padding: 0 4px; border: none; background: transparent; color: #5B3DF5; font-size: 14px; font-weight: 600; text-decoration: underline">Apagar meu progresso</button>
  </div>
</div>
</sc-if>

<!-- ============ FRASES ============ -->
<sc-if value="{{showFrases}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 16px">
  <h1 style="margin: 0; padding-top: 8px; font-family: Unbounded, 'Manrope', system-ui, sans-serif; font-weight: 600; letter-spacing: -0.01em; font-size: 30px;">Frases</h1>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 4px; background: #E9EDF8; border-radius: 14px">
    <button onClick="{{viewCats}}" style="{{fseg.cats}}">Categorias</button>
    <button onClick="{{viewCards}}" style="{{fseg.cards}}">Cartões</button>
    <button onClick="{{viewLista}}" style="{{fseg.lista}}">Lista</button>
  </div>
  <sc-if value="{{notCatsView}}">
  <div style="display: flex; flex-wrap: wrap; gap: 8px">
    <button onClick="{{viewCats}}" style="{{curPill}}">{{curCatLabel}}</button>
    <button onClick="{{pickAll}}" style="{{allPill}}">Todas</button>
    <button onClick="{{pickReview}}" style="{{reviewPill}}">Revisar ({{reviewCount}})</button>
  </div>
  <div role="group" aria-label="Idioma da tradução" style="display: flex; align-items: center; gap: 8px">
    <span style="font-size: 13px; color: #5D6788">Tradução em</span>
    <button onClick="{{langPt}}" aria-pressed="{{langPtOn}}" style="{{langPtStyle}}">Português</button>
    <button onClick="{{langEn}}" aria-pressed="{{langEnOn}}" style="{{langEnStyle}}">Inglês</button>
  </div>
  <button onClick="{{readDeck}}" aria-label="Ouvir as frases desta lista em sequência" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border: none; border-radius: 14px; color: #FFFFFF; background: linear-gradient(135deg, #5B3DF5, #2F6FE0); font-size: 15px; font-weight: 700; box-shadow: 0 6px 16px rgba(91,61,245,0.25)">
    <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z"/></svg>
    {{readDeckLabel}}
  </button>
  </sc-if>

  <sc-if value="{{isCatsView}}">
  <div style="display: flex; flex-direction: column; gap: 22px">
    <span style="font-size: 13px; color: #5D6788">{{catSummary}}</span>
    <sc-for list="{{catGroups}}" as="g">
      <section style="display: flex; flex-direction: column; gap: 10px">

<script>/* Frase a Frase — motor de renderização leve (substitui o runtime do protótipo) */
(function () {
  'use strict';

  function get(scope, path) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    var parts = path.split('.');
    var v = scope[parts[0]];
    for (var i = 1; i < parts.length; i++) v = v == null ? undefined : v[parts[i]];
    return v;
  }
  function interp(str, scope) {
    return str.replace(/\{\{([^}]+)\}\}/g, function (m, p) {
      var v = get(scope, p);
      return v == null ? '' : String(v);
    });
  }
  function whole(str) {
    var m = /^\s*\{\{([^}]+)\}\}\s*$/.exec(str || '');
    return m ? m[1] : null;
  }
  var EVENTS = { onclick: 'click', onchange: 'input', oninput: 'input', onsubmit: 'submit', onkeydown: 'keydown' };

  function build(src, scope, out) {
    for (var n = src.firstChild; n; n = n.nextSibling) {
      if (n.nodeType === 3) {
        out.appendChild(document.createTextNode(n.nodeValue.indexOf('{{') >= 0 ? interp(n.nodeValue, scope) : n.nodeValue));
        continue;
      }
      if (n.nodeType !== 1) continue;
      var tag = n.localName;
      if (tag === 'sc-if') {
        if (get(scope, whole(n.getAttribute('value')) || 'false')) build(n, scope, out);
        continue;
      }
      if (tag === 'sc-for') {
        var list = get(scope, whole(n.getAttribute('list')) || '') || [];
        var as = n.getAttribute('as') || 'item';
        for (var i = 0; i < list.length; i++) {
          var s2 = Object.create(scope);
          s2[as] = list[i];
          build(n, s2, out);
        }
        continue;
      }
      var el = document.importNode(n, false);
      var attrs = Array.prototype.slice.call(n.attributes);
      for (var a = 0; a < attrs.length; a++) {
        var name = attrs[a].name, val = attrs[a].value;
        if (name.indexOf('hint-') === 0) { el.removeAttribute(name); continue; }
        if (val.indexOf('{{') < 0) continue;
        var lname = name.toLowerCase();
        if (EVENTS[lname]) {
          el.removeAttribute(name);
          var fn = get(scope, whole(val) || '');
          if (typeof fn === 'function') el.addEventListener(EVENTS[lname], (function (f) { return function (e) { f(e); }; })(fn));
          continue;
        }
        if (lname === 'value' && (tag === 'input' || tag === 'textarea')) {
          var v = get(scope, whole(val) || '');
          el.removeAttribute(name);
          el.value = v == null ? '' : String(v);
          continue;
        }
        el.setAttribute(name, interp(val, scope));
      }
      build(n, scope, el);
      out.appendChild(el);
    }
  }

  var tpl, mount, inst, pending = false, lastKey = null;

  function render() {
    pending = false;
    var vals = inst.renderVals();
    var scroller = document.getElementById('scroller');
    var top = scroller ? scroller.scrollTop : 0;
    var ae = document.activeElement, focusId = ae && ae.id, selS = null, selE = null;
    try { if (focusId && ae.selectionStart != null) { selS = ae.selectionStart; selE = ae.selectionEnd; } } catch (e) {}
    var frag = document.createDocumentFragment();
    build(tpl.content, vals, frag);
    mount.replaceChildren(frag);
    var s = inst.state;
    var key = s.tab + '|' + s.reading + '|' + s.textIdx + '|' + s.pmode;
    scroller = document.getElementById('scroller');
    if (scroller) scroller.scrollTop = key === lastKey ? top : 0;
    lastKey = key;
    if (focusId) {
      var f = document.getElementById(focusId);
      if (f) { f.focus(); try { if (selS != null) f.setSelectionRange(selS, selE); } catch (e) {} }
    }
    if (inst.componentDidUpdate) inst.componentDidUpdate();
    document.dispatchEvent(new CustomEvent('faf:render'));
  }

  window.DCLogic = function DCLogic(props) { this.props = props || {}; this.state = {}; };
  window.DCLogic.prototype.setState = function (p) {
    Object.assign(this.state, typeof p === 'function' ? p(this.state) : p);
    if (!pending && mount) { pending = true; Promise.resolve().then(render); }
  };

  window.FAFBoot = function (Component) {
    tpl = document.getElementById('app-template');
    mount = document.getElementById('app');
    inst = new Component({});
    window.__fafApp = inst;
    render();
  };
})();
</script>
<script>/* Frase a Frase — player de podcasts e vídeos dentro do app */
(function () {
  'use strict';
  var POS_KEY = 'fraseafrase.pos';
  var SPEEDS = [0.75, 0.9, 1, 1.25];
  var cache = {};
  var audio = new Audio();
  audio.preload = 'metadata';
  var cur = null; // { media, ep }

  function $(id) { return document.getElementById(id); }
  function h(tag, attrs, kids) {
    var el = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === 'text') el.textContent = attrs[k];
      else if (k === 'html') el.innerHTML = attrs[k];
      else if (k.indexOf('on') === 0) el.addEventListener(k.slice(2), attrs[k]);
      else el.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c) el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return el;
  }
  function fmt(sec) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    sec = Math.floor(sec);
    var m = Math.floor(sec / 60), s = sec % 60, hh = Math.floor(m / 60);
    if (hh) return hh + ':' + String(m % 60).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    return m + ':' + String(s).padStart(2, '0');
  }
  function fmtDate(iso) {
    var d = new Date(iso); if (!iso || isNaN(d)) return ''; return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' });
  }
  function https(u) { return u ? String(u).replace(/^http:\/\//, 'https://') : u; }

  function loadPos() { try { return JSON.parse(localStorage.getItem(POS_KEY)) || {}; } catch (e) { return {}; } }
  function savePos(url, t) {
    try {
      var p = loadPos();
      if (t < 5) delete p[url]; else p[url] = { t: Math.floor(t), at: Date.now() };
      var keys = Object.keys(p).sort(function (a, b) { return p[b].at - p[a].at; });
      keys.slice(40).forEach(function (k) { delete p[k]; });
      localStorage.setItem(POS_KEY, JSON.stringify(p));
    } catch (e) {}
  }

  function jsonp(url, ms) {
    return new Promise(function (resolve, reject) {
      var cb = '__faf' + Date.now() + Math.floor(Math.random() * 1e5);
      var s = document.createElement('script');
      var timer = setTimeout(function () { done(); reject(new Error('timeout')); }, ms || 9000);
      function done() { clearTimeout(timer); try { delete window[cb]; } catch (e) { window[cb] = undefined; } s.remove(); }
      window[cb] = function (data) { done(); resolve(data); };
      s.onerror = function () { done(); reject(new Error('network')); };
      s.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'callback=' + cb;
      document.head.appendChild(s);
    });
  }

  function txt(el, tag) { var x = el.getElementsByTagName(tag)[0]; return x ? x.textContent.trim() : ''; }
  function parseDur(v) {
    if (!v) return null;
    if (/^\d+$/.test(v)) return +v;
    var p = v.split(':').map(Number), s = 0;
    p.forEach(function (n) { s = s * 60 + n; });
    return s || null;
  }
  function fetchEpisodes(m) {
    if (cache[m.id]) return Promise.resolve(cache[m.id]);
    return fetch(m.feed).then(function (r) { if (!r.ok) throw new Error('feed'); return r.text(); }).then(function (xml) {
      var doc = new DOMParser().parseFromString(xml, 'text/xml');
      var ch = doc.getElementsByTagName('channel')[0];
      var chImg = ch && ch.getElementsByTagName('itunes:image')[0];
      var showArt = chImg ? chImg.getAttribute('href') : '';
      var eps = [];
      Array.prototype.forEach.call(doc.getElementsByTagName('item'), function (it) {
        var enc = it.getElementsByTagName('enclosure')[0];
        if (!enc) return;
        var trs = Array.prototype.map.call(it.getElementsByTagName('podcast:transcript'), function (e) {
          return { url: e.getAttribute('url'), type: (e.getAttribute('type') || '').toLowerCase() };
        });
        var tr = trs.filter(function (t) { return /json/.test(t.type); })[0] ||
          trs.filter(function (t) { return /vtt/.test(t.type) || /\.vtt$/.test(t.url); })[0] ||
          trs.filter(function (t) { return /srt|subrip/.test(t.type) || /\.srt$/.test(t.url); })[0];
        if (!tr) return;
        var img = it.getElementsByTagName('itunes:image')[0];
        eps.push({
          title: txt(it, 'title'), url: https(enc.getAttribute('url')), date: txt(it, 'pubDate'),
          dur: parseDur(txt(it, 'itunes:duration')), tr: tr,
          art: https((img && img.getAttribute('href')) || showArt)
        });
      });

<script>/* Curso Premium: trilha sequencial A1–B2 com gamificação. Progresso em localStorage
