<script>/* Idioma do curso: "es" (espanhol, padrão) ou "en" (inglês). Escolhido no menu > Idioma.
   No inglês, todo o progresso fica em chaves separadas (fraseafrase.en.*), então o espanhol nunca é alterado. */
(function () {
  var P = Storage.prototype, rawGet = P.getItem, rawSet = P.setItem, rawRem = P.removeItem;
  window.__fafRaw = { get: rawGet, set: rawSet, rem: rawRem };
  var idi = 'es';
  try { idi = rawGet.call(localStorage, 'fraseafrase.idioma') === 'en' ? 'en' : 'es'; } catch (e) {}
  window.FAF_IDIOMA = idi;
  document.documentElement.setAttribute('data-idioma', idi);
  // Chaves que valem para os dois idiomas (não separam).
  var SHARED = { 'fraseafrase.idioma': 1, 'fraseafrase.theme': 1, 'fraseafrase.sync': 1 };
  function phys(k) {
    if (idi !== 'en' || window.__fafWiping || typeof k !== 'string') return k;
    if (k.indexOf('fraseafrase.') !== 0 || k.indexOf('fraseafrase.en.') === 0 || SHARED[k]) return k;
    return 'fraseafrase.en.' + k.slice(12);
  }
  window.__fafPhys = phys;
  if (idi === 'en') {
    P.getItem = function (k) { return rawGet.call(this, this === localStorage ? phys(k) : k); };
    P.setItem = function (k, v) { return rawSet.call(this, this === localStorage ? phys(k) : k, v); };
    P.removeItem = function (k) { return rawRem.call(this, this === localStorage ? phys(k) : k); };
  }
  window.fafSetIdioma = function (v) {
    try { rawSet.call(localStorage, 'fraseafrase.idioma', v === 'en' ? 'en' : 'es'); } catch (e) {}
    location.reload();
  };
  // Endereço dos dados de conteúdo conforme o idioma.
  window.fafData = function (f) { return idi === 'en' ? 'data/en/' + f : 'data/' + f; };
})();
</script>
<script>/* Tema escolhido em Configurações: "light", "dark" ou automático (segue o celular). Aplicado antes de desenhar, para não piscar. */
(function () {
  function apply(t) {
    var root = document.documentElement;
    if (t === 'light' || t === 'dark') root.setAttribute('data-theme', t); else root.removeAttribute('data-theme');
    var metas = document.querySelectorAll('meta[name="theme-color"]');
    for (var i = 0; i < metas.length; i++) {
      var dark = /dark/.test(metas[i].getAttribute('media') || '');
      if (t === 'light') metas[i].setAttribute('content', '#FBFBFD');
      else if (t === 'dark') metas[i].setAttribute('content', '#121318');
      else metas[i].setAttribute('content', dark ? '#121318' : '#FBFBFD');
    }
  }
  window.fafTheme = function () { try { var t = localStorage.getItem('fraseafrase.theme'); return t === 'light' || t === 'dark' ? t : 'auto'; } catch (e) { return 'auto'; } };
  window.fafSetTheme = function (t) {
    try { if (t === 'light' || t === 'dark') localStorage.setItem('fraseafrase.theme', t); else localStorage.removeItem('fraseafrase.theme'); } catch (e) {}
    apply(t);
  };
  apply(window.fafTheme());
})();
</script>

html,body{margin:0;background:var(--ink);height:100%}
body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;font-family:Manrope,system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}

/* mini player */
#faf-dock{position:fixed;left:0;right:0;bottom:80px;z-index:20;display:flex;justify-content:center;pointer-events:none;padding:0 10px}
#faf-dock[hidden]{display:none}
.faf-dock-card{pointer-events:auto;width:100%;max-width:540px;box-sizing:border-box;background:var(--deck);border:1px solid var(--line2);color:var(--text);border-radius:16px;padding:10px 12px 8px;box-shadow:0 18px 40px rgba(20,26,51,.14);display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.faf-dock-top{display:flex;align-items:center;gap:8px}
#faf-dock-info{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:none;color:inherit;text-align:left;padding:0}
#faf-dock-art{width:40px;height:40px;border-radius:8px;object-fit:cover;flex:0 0 auto;background:var(--deck2)}
.faf-dock-text{min-width:0;display:flex;flex-direction:column}
#faf-dock-title{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#faf-dock-show{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.faf-ic{flex:0 0 auto;width:40px;height:40px;border-radius:999px;border:none;background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
#faf-toggle{width:44px;height:44px;background:var(--red);color:#FFFFFF}
#faf-speed{width:auto;min-width:44px;padding:0 8px;border:1px solid var(--line2);height:30px;font-size:12px}
.faf-dock-bottom{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
#faf-seek{flex:1 1 auto;accent-color:var(--red);height:20px;margin:0}

/* sheet */
#faf-sheet{position:fixed;inset:0;z-index:30;background:rgba(20,26,51,.45);display:flex;align-items:flex-end;justify-content:center}
#faf-sheet[hidden]{display:none}
.faf-panel{width:100%;max-width:600px;max-height:90vh;max-height:90dvh;background:var(--ink);border:1px solid var(--line);border-bottom:none;border-radius:20px 20px 0 0;display:flex;flex-direction:column;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom);position:relative}
.faf-head{display:flex;align-items:flex-start;gap:12px;padding:18px 18px 10px}
.faf-head-text{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px}
#faf-sheet-title{margin:0;font-family:Unbounded,Manrope,sans-serif;font-size:19px;line-height:1.25;font-weight:600;letter-spacing:-.01em}
#faf-sheet-sub{font-size:13px;color:var(--muted)}
#faf-sheet-close{width:40px;height:40px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
#faf-sheet-body{overflow-y:auto;padding:4px 18px 22px;display:flex;flex-direction:column;gap:12px}
.faf-video{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.faf-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.faf-tip{margin:0;padding:12px 14px;background:var(--deck);border:1px solid var(--line);border-radius:12px;font-size:14px;line-height:1.5;color:var(--text2)}
.faf-note{margin:0;font-size:13px;line-height:1.5;color:var(--muted)}
.faf-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.faf-btn{min-height:46px;display:flex;align-items:center;justify-content:center;border-radius:12px;font-size:14px;font-weight:700;text-decoration:none;padding:0 14px;box-sizing:border-box;text-align:center}
.faf-btn-red{border:none;background:var(--red);color:#FFFFFF}
.faf-btn-light{border:1px solid var(--line2);background:transparent;color:var(--text)}
a.faf-btn-light{color:var(--text)}
.faf-list{display:flex;flex-direction:column}
.faf-ep{display:flex;align-items:center;gap:14px;text-align:left;background:transparent;border:none;border-bottom:1px solid var(--line);padding:14px 2px;color:var(--text);min-height:60px}
.faf-ep:first-child{border-top:1px solid var(--line)}
.faf-ep-icon{flex:0 0 auto;width:36px;height:36px;border-radius:999px;border:1px solid var(--line2);color:var(--text);display:flex;align-items:center;justify-content:center}
.faf-ep.is-playing .faf-ep-icon{background:var(--red);border-color:var(--red);color:#FFFFFF}
.faf-ep.is-playing .faf-ep-title{color:var(--accent-t)}
.faf-ep-text{min-width:0;display:flex;flex-direction:column;gap:3px}
.faf-ep-title{font-size:15px;font-weight:700;line-height:1.35}
.faf-ep-meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* transcrição */
body.tr-open #faf-dock{z-index:40;bottom:0 !important}
body.tr-open .faf-panel{height:96vh;height:96dvh;max-height:none}
body.tr-open .faf-head{display:none}
body.tr-open #faf-sheet-body{padding:0 0 150px;gap:0}
.faf-tr-top{position:sticky;top:0;z-index:2;background:var(--glass-ink);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 16px 10px;display:flex;flex-direction:column;gap:10px}
.faf-tr-bar{display:flex;align-items:center;gap:10px}
.faf-round{flex:0 0 auto;width:38px;height:38px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center}
.faf-tr-heading{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:1px}
.faf-tr-show{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.faf-tr-title{margin:0;font-size:15px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.faf-tools{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.faf-tools::-webkit-scrollbar{display:none}
.faf-chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 11px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--text2);font-size:13px;font-weight:600;white-space:nowrap}
.faf-chip .dot{width:8px;height:8px;border-radius:999px;background:currentColor;opacity:.5}
.faf-chip[aria-pressed="true"]{background:var(--deck2);border-color:transparent;color:var(--text)}
.faf-chip[aria-pressed="true"] .dot{opacity:1}
.faf-chip.pt[aria-pressed="true"] .dot{background:var(--saffron)}
.faf-chip.en[aria-pressed="true"] .dot{background:var(--cyan)}
.faf-chip.es[aria-pressed="true"] .dot{background:var(--red)}
.faf-sep{flex:0 0 auto;width:1px;height:20px;background:var(--line2);margin:0}
.faf-size{flex:0 0 auto;min-width:34px;height:34px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--text);font-weight:700;font-size:13px}
.faf-tr{display:flex;flex-direction:column;padding:18px 16px 0}
.faf-line{position:relative;display:grid;grid-template-columns:44px 1fr;gap:4px 10px;align-items:baseline;text-align:left;width:100%;border:none;background:transparent;color:var(--text2);padding:12px 10px 12px 0;border-radius:0;font-size:var(--tr-size);line-height:1.55;transition:color .25s}
.faf-line-time{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;text-align:right;padding-top:.35em}
.faf-line-body{display:flex;flex-direction:column;gap:4px;min-width:0}
.faf-line-text{font-weight:500}
.faf-line.is-past{color:var(--faint)}
.faf-line.is-now{color:var(--text)}
.faf-line.is-now .faf-line-text{font-weight:700;font-size:1.12em;line-height:1.45}
.faf-line.is-now .faf-line-time{color:var(--red)}
.faf-line.is-now::before{content:"";position:absolute;left:52px;right:0;bottom:4px;height:2px;border-radius:2px;background:var(--line)}
.faf-line.is-now::after{content:"";position:absolute;left:52px;bottom:4px;height:2px;border-radius:2px;background:var(--red);width:calc((100% - 52px) * var(--p,0));transition:width .25s linear}
.faf-line:hover .faf-line-text{color:var(--red)}
.faf-tl{display:none;font-size:.86em;line-height:1.5;font-weight:500}
.faf-tl-pt{color:var(--accent-t)}
.faf-tl-en{color:var(--blue-t)}
.faf-line.is-past .faf-tl{opacity:.6}
.faf-tl.is-err{color:var(--muted);font-size:12px}
.show-pt .faf-tl-pt,.show-en .faf-tl-en{display:block}
.faf-tr.is-blur .faf-line-text{filter:blur(7px);transition:filter .2s}
.faf-tr.is-blur .faf-line:focus .faf-line-text,.faf-tr.is-blur .faf-line:active .faf-line-text{filter:none}
.faf-tr-foot{padding:18px 16px 0 70px}
#faf-follow{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(122px + env(safe-area-inset-bottom));z-index:3;min-height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line2);background:var(--deck);color:var(--text);font-size:13px;font-weight:700;box-shadow:0 10px 24px rgba(20,26,51,.14)}
#faf-follow[hidden]{display:none}
.faf-rd-ctl{flex:0 0 auto;z-index:3;display:flex;align-items:center;justify-content:center;gap:14px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line)}
body.rd-open #faf-sheet-body{padding-bottom:24px}
.faf-rd-play{width:60px;height:60px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--brand-grad);box-shadow:0 6px 18px rgba(91,61,245,.35)}
.faf-rd-play svg{width:26px;height:26px}
.faf-rd-btn{width:48px;height:48px;border-radius:50%;border:1px solid var(--line2);background:var(--deck);color:var(--text);display:flex;align-items:center;justify-content:center}
.faf-rd-speed{min-width:56px;height:40px;border-radius:999px;border:1px solid var(--line2);background:var(--deck);color:var(--text);font-weight:700;font-size:14px}
.faf-line-time.is-who{font-size:10.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--accent-t);width:auto;min-width:56px;max-width:none;white-space:nowrap;overflow:visible}
.faf-rd-pos{min-width:56px;font-size:13px;color:var(--muted);text-align:center}
/* Curso Premium */
#faf-course{position:fixed;z-index:40;overflow-y:auto;overscroll-behavior:contain;background:var(--ink);--ca:#5B3DF5;--cb:#2F6FE0;--csoft:#EDE9FF;padding:20px 20px 40px;box-sizing:border-box}
#faf-course[hidden]{display:none}
.cc-ico{display:inline-flex;line-height:0}
.cc-loading{padding:40px 8px;color:var(--muted);text-align:center;font-size:15px}
.cc-link{border:none;background:none;color:var(--ca);font-weight:700;text-decoration:underline;padding:0;font-size:inherit}
.cc-head{display:flex;flex-direction:column;gap:14px;margin-bottom:22px}
.cc-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.cc-title{margin:0;font-family:Unbounded,Manrope,sans-serif;font-weight:600;font-size:28px;letter-spacing:-.01em;color:var(--text)}
.cc-sub{margin:4px 0 0;color:var(--muted);font-size:14px}
.cc-premium{flex:0 0 auto;font-size:12px;font-weight:800;letter-spacing:.04em;color:#fff;background:linear-gradient(135deg,var(--ca),var(--cb));padding:6px 12px;border-radius:999px}
.cc-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cc-stat{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--deck);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.cc-stat strong{font-size:20px;font-weight:800;color:var(--text);line-height:1.1}
.cc-stat-l{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cc-stat.is-flame .cc-ico{color:var(--faint)}.cc-stat.is-flame.is-lit .cc-ico{color:#FF8A1F}
.cc-stat.is-xp .cc-ico{color:#F2A900}.cc-stat.is-heart .cc-ico{color:#F0476D}
.cc-level{background:var(--deck);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:7px}
.cc-level-top{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.cc-level-top strong{color:var(--text);font-size:14px}
.cc-bar{height:10px;border-radius:999px;background:var(--deck2);overflow:hidden}
.cc-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--ca),var(--cb));transition:width .5s ease}
.cc-bar.is-goal i{background:linear-gradient(90deg,#FFB020,#FF8A1F)}
.cc-tools{display:flex;flex-wrap:wrap;gap:8px}
.cc-tool{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:var(--deck);color:var(--text);font-size:13px;font-weight:600}
.cc-tool b{color:var(--ca)}
.cc-tool:hover,.cc-opt:hover:not(:disabled),.cc-chip:hover:not(:disabled){border-color:var(--ca)}
.cc-levels{display:flex;flex-direction:column;gap:26px}
.cc-lv{display:flex;flex-direction:column;gap:12px}
.cc-lv-title{margin:0;display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;color:var(--text)}
.cc-lv-code{font-family:Unbounded,Manrope,sans-serif;font-size:13px;font-weight:600;color:#fff;background:var(--solid);border-radius:8px;padding:4px 8px}
.cc-unit{background:var(--deck);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.cc-unit.is-locked{background:transparent;border-style:dashed;opacity:.8}
.cc-unit.is-open{border-color:var(--ca);box-shadow:0 10px 30px rgba(20,26,51,.06)}
.cc-unit.is-done{border-color:#33C08D}
.cc-unit-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.cc-unit-n{font-size:12px;font-weight:700;color:var(--muted)}
.cc-unit h3{margin:2px 0 0;font-size:16px;color:var(--text)}
.cc-unit p{margin:6px 0 0;font-size:13.5px;color:var(--muted);line-height:1.45}
.cc-badge{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--muted);background:var(--deck2);border-radius:999px;padding:5px 10px}
.cc-badge.is-done{color:var(--green-t);background:var(--tint-green)}
.cc-path{list-style:none;margin:34px 0 6px;padding:0;display:flex;flex-direction:column;align-items:center;gap:40px}
.cc-step{display:flex;flex-direction:column;align-items:center;gap:6px;transform:translateX(calc(var(--x) * 34px));position:relative}
.cc-node{width:68px;height:68px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(145deg,var(--ca),var(--cb));box-shadow:0 6px 0 rgba(20,26,51,.18);transition:transform .12s}
.cc-node:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 rgba(20,26,51,.18)}
.cc-node.is-done{background:linear-gradient(145deg,#33C08D,#14915D)}
.cc-node.is-locked{background:var(--off);color:var(--faint);box-shadow:0 6px 0 var(--line2);cursor:not-allowed}
.cc-node.is-current{animation:cc-pulse 1.8s ease-in-out infinite}
.cc-node.is-chest{background:linear-gradient(145deg,#FFC93C,#F29A1F)}
.cc-node.is-chest.is-locked{background:#EFE6CF;color:#C7B98F;box-shadow:0 6px 0 #E3D6B5}
.cc-node.is-chest.is-done{background:var(--deck2);color:var(--faint);box-shadow:0 6px 0 #D6DCEC}
.cc-node.is-test{width:76px;height:76px}
.cc-node.is-big{width:80px;height:80px}
.cc-node-label{font-size:12.5px;font-weight:700;color:var(--text);text-align:center;max-width:140px}
.cc-stars{display:flex;gap:1px;color:var(--star-off)}
.cc-stars .is-on{color:#F2A900}
.cc-start{position:absolute;top:-32px;white-space:nowrap;z-index:1;font-size:12px;font-weight:800;color:var(--ca);background:#fff;border:2px solid var(--ca);border-radius:10px;padding:3px 10px;animation:cc-bob 1.6s ease-in-out infinite}
@keyframes cc-pulse{0%,100%{box-shadow:0 6px 0 rgba(20,26,51,.18),0 0 0 0 rgba(91,61,245,.35)}50%{box-shadow:0 6px 0 rgba(20,26,51,.18),0 0 0 12px rgba(91,61,245,0)}}
@keyframes cc-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* modais e avisos */
.cc-modal{position:fixed;inset:0;z-index:90;background:rgba(20,26,51,.45);display:flex;align-items:center;justify-content:center;padding:20px}
.cc-modal-box{position:relative;overflow:hidden;width:100%;max-width:380px;max-height:86vh;overflow-y:auto;background:var(--deck);border-radius:22px;padding:24px 20px;display:flex;flex-direction:column;gap:12px;text-align:center;color:var(--text);box-sizing:border-box}
.cc-modal-box.is-wide{max-width:460px;text-align:left}
.cc-modal-box h2{margin:0;font-size:20px}
.cc-muted{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.cc-muted.is-center{text-align:center;width:100%}
.cc-btn{min-height:50px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--ca),var(--cb));color:#fff;font-size:16px;font-weight:800;padding:0 20px;box-shadow:0 4px 0 rgba(20,26,51,.2)}
.cc-btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 rgba(20,26,51,.2)}
.cc-btn:disabled{background:var(--off);color:var(--faint);box-shadow:none;cursor:not-allowed}
.cc-btn.is-ghost{background:var(--deck);color:var(--text);border:1px solid var(--line2);box-shadow:none}
.cc-btn.is-wide{width:100%}
.cc-hidden{display:none}
.cc-ach{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.cc-ach li{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--deck2);color:var(--faint)}
.cc-ach li div{display:flex;flex-direction:column;gap:2px}
.cc-ach li strong{color:var(--muted);font-size:14px}.cc-ach li span{font-size:12.5px}
.cc-ach li.is-got{background:var(--cs);color:var(--ca)}
.cc-ach li.is-got strong{color:var(--text)}.cc-ach li.is-got span{color:var(--muted)}
.cc-themes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cc-theme{display:flex;align-items:center;gap:8px;min-height:52px;padding:0 12px;border-radius:14px;border:2px solid var(--line);background:var(--deck);color:var(--text);font-weight:700;font-size:14px}
.cc-theme.is-on{border-color:var(--ca)}
.cc-theme:disabled{opacity:.55;cursor:not-allowed}
.cc-swatch{display:inline-block;width:22px;height:22px;border-radius:7px;flex:0 0 auto}
.cc-big-ico{width:84px;height:84px;margin:4px auto 0;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(145deg,var(--ca),var(--cb))}
.cc-big-ico .cc-ico svg{width:40px;height:40px}
.cc-big-ico.is-heart{background:linear-gradient(145deg,#FF7A93,#F0476D)}
.cc-big-ico.is-level{background:linear-gradient(145deg,#FFC93C,#F29A1F)}
.cc-big-ico strong{font-family:Unbounded,Manrope,sans-serif;font-size:34px}
.cc-toast{position:fixed;left:50%;top:14px;z-index:120;transform:translate(-50%,-140%);transition:transform .3s ease;display:flex;gap:12px;align-items:center;background:var(--solid);color:#fff;border-radius:16px;padding:12px 16px;box-shadow:0 14px 30px rgba(20,26,51,.25);max-width:calc(100vw - 32px)}
.cc-toast.is-in{transform:translate(-50%,0)}
.cc-toast .cc-ico{color:#FFC93C}
.cc-toast div{display:flex;flex-direction:column;font-size:13px}.cc-toast strong{font-size:14px}
.cc-confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.cc-chest{margin:6px auto 0;width:120px;height:120px;border:none;border-radius:28px;background:linear-gradient(145deg,#FFC93C,#F29A1F);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 0 #D9800F}
.cc-chest .cc-ico svg{width:64px;height:64px}
.cc-chest.is-shake{animation:cc-shake .6s ease}
.cc-chest.is-open{transform:scale(1.08);background:linear-gradient(145deg,#FFE08A,#FFC93C)}
@keyframes cc-shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
.cc-chest-info{display:flex;flex-direction:column;gap:10px}
.cc-rewards{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;text-align:left}
.cc-rewards li{display:flex;align-items:center;gap:10px;background:var(--deck2);border-radius:12px;padding:10px 12px;font-weight:700}
.cc-rewards .cc-ico{color:var(--ca)}

/* lição */
body.cc-locked{overflow:hidden}
.cc-lesson{position:fixed;inset:0;z-index:80;background:var(--deck);display:flex;flex-direction:column;color:var(--text);overflow:hidden}
.cc-lesson.is-shake{animation:cc-nudge .35s ease}
@keyframes cc-nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.cc-l-top{display:flex;align-items:center;gap:12px;padding:14px 16px 6px;padding-top:max(14px,env(safe-area-inset-top));max-width:680px;width:100%;margin:0 auto;box-sizing:border-box}
.cc-bar.is-lesson{flex:1 1 auto;height:14px}
.cc-icon-btn{width:44px;height:44px;border:none;background:none;color:var(--faint);display:flex;align-items:center;justify-content:center;border-radius:12px;flex:0 0 auto}
.cc-l-hearts{display:flex;align-items:center;gap:4px;color:#F0476D;font-weight:800;font-size:17px;min-width:40px;justify-content:flex-end}
.cc-l-score{color:var(--text);font-size:15px}
.cc-combo{height:22px;text-align:center;font-size:13px;font-weight:800;color:#FF8A1F;opacity:0;transform:scale(.8);transition:all .2s}
.cc-combo.is-on{opacity:1;transform:scale(1)}
.cc-l-main{flex:1 1 auto;overflow-y:auto;padding:10px 20px 20px;max-width:640px;width:100%;margin:0 auto;box-sizing:border-box;display:flex;flex-direction:column;gap:16px;position:relative}
.cc-kicker{margin:0;font-size:13px;font-weight:800;color:var(--ca);letter-spacing:.02em}
.cc-kicker.is-retry{color:#E0663A}
.cc-l-title{margin:0;font-size:24px;font-weight:800;text-align:inherit}
.cc-tip{margin:0;font-size:15.5px;line-height:1.55;color:var(--text2);background:var(--cs);border-radius:14px;padding:14px 16px}
.cc-tip.is-center{text-align:center;background:none;padding:0}
.cc-vocab{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.cc-vocab li{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.cc-vocab li div{display:flex;flex-direction:column}
.cc-vocab strong{font-size:17px;line-height:1.35}.cc-vocab span{font-size:13.5px;color:var(--muted)}
.cc-say{width:44px;height:44px;flex:0 0 auto;border-radius:12px;border:none;background:var(--cs);color:var(--ca);display:inline-flex;align-items:center;justify-content:center}
.cc-say.is-inline{width:40px;height:40px;margin-right:10px;vertical-align:middle}
.cc-q{margin:0;font-size:22px;line-height:1.35;font-weight:700}
.cc-blank{display:inline-block;min-width:80px;border-bottom:3px solid var(--ca);color:var(--ca);text-align:center;padding:0 6px;white-space:pre}
.cc-listen{display:flex;gap:14px;justify-content:center;padding:12px 0}
.cc-play{width:96px;height:96px;border-radius:24px;border:none;background:linear-gradient(145deg,var(--ca),var(--cb));color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 rgba(20,26,51,.2)}
.cc-play .cc-ico svg{width:44px;height:44px}
.cc-play.is-slow{width:64px;height:64px;align-self:flex-end;border-radius:18px}
.cc-play.is-slow .cc-ico svg{width:28px;height:28px}
.cc-opts{display:flex;flex-direction:column;gap:10px}
.cc-opt{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--deck);color:var(--text);font-size:16.5px;font-weight:600;text-align:left;box-shadow:0 3px 0 var(--line)}
.cc-opt-n{width:26px;height:26px;flex:0 0 auto;border-radius:8px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.cc-opt.is-sel{border-color:var(--ca);background:var(--cs);box-shadow:0 3px 0 var(--ca)}
.cc-opt.is-sel .cc-opt-n{border-color:var(--ca);color:var(--ca)}
.cc-opt:disabled{cursor:default}
.cc-match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cc-col{display:flex;flex-direction:column;gap:10px}
.cc-opt.is-match{justify-content:center;text-align:center;min-height:58px}
.cc-opt.is-ok{border-color:#33C08D;background:var(--tint-green);color:var(--green-t);box-shadow:none;opacity:.7}
.cc-opt.is-bad{border-color:#F0476D;background:var(--tint-red);color:var(--red-t)}
.cc-build{min-height:62px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:10px 0;border-bottom:2px solid var(--line);border-top:2px solid var(--line)}
.cc-bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-top:6px}
.cc-chip{min-height:46px;padding:0 14px;border-radius:12px;border:2px solid var(--line);background:var(--deck);color:var(--text);font-size:16px;font-weight:600;box-shadow:0 3px 0 var(--line)}
.cc-chip.is-used{color:transparent;background:var(--deck2);border-color:var(--deck2);box-shadow:none}
.cc-l-foot{flex:0 0 auto;padding:14px 20px;padding-bottom:max(18px,env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px;max-width:680px;width:100%;margin:0 auto;box-sizing:border-box;transition:background .2s}
.cc-l-foot.is-ok{background:var(--tint-green);border-color:var(--line-green)}
.cc-l-foot.is-bad{background:var(--tint-red);border-color:var(--line-red)}
.cc-l-foot.is-ok .cc-btn{background:linear-gradient(135deg,#33C08D,#14915D)}
.cc-l-foot.is-bad .cc-btn{background:linear-gradient(135deg,#FF6B8B,#E0365E)}
.cc-fb{display:flex;flex-direction:column;gap:4px}
.cc-fb strong{font-size:19px}
.cc-l-foot.is-ok .cc-fb strong{color:var(--green-t)}.cc-l-foot.is-bad .cc-fb strong{color:var(--red-t)}
.cc-fb span{font-size:15px;color:var(--text)}
.cc-result{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-top:20px}
.cc-res-stars{display:flex;gap:10px;color:var(--star-off)}
.cc-res-stars .cc-ico svg{width:58px;height:58px}
.cc-res-stars .is-on{color:#F2A900;animation:cc-pop .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes cc-pop{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
.cc-res-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:360px}
.cc-res-grid div{border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.cc-res-grid strong{font-size:22px;color:var(--ca)}
.cc-res-grid span{font-size:12.5px;color:var(--muted)}
.cc-streak-line{display:flex;align-items:center;gap:6px;margin:0;font-weight:800;color:#FF8A1F}
@media (prefers-reduced-motion:reduce){.cc-node.is-current,.cc-start,.cc-chest.is-shake,.cc-lesson.is-shake{animation:none}}

/* ===== Visual de jogo (futurista) ===== */
#faf-course{background:radial-gradient(120% 60% at 50% 0%,#6C4BFF 0%,rgba(108,75,255,0) 60%),linear-gradient(180deg,#3A23C9 0%,#4B33E0 30%,#3567EA 70%,#2A86E8 100%);color:#fff;isolation:isolate}
#faf-course::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:34px 34px;mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.35) 60%,transparent 100%);-webkit-mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.35) 60%,transparent 100%)}
.cc-stars-bg{position:absolute;inset:0;height:100%;min-height:100%;z-index:-1;pointer-events:none;background-image:radial-gradient(2px 2px at 12% 18%,#fff,transparent),radial-gradient(1.5px 1.5px at 78% 9%,#fff,transparent),radial-gradient(2px 2px at 64% 34%,rgba(255,255,255,.8),transparent),radial-gradient(1.5px 1.5px at 30% 52%,#fff,transparent),radial-gradient(2px 2px at 88% 61%,rgba(255,255,255,.7),transparent),radial-gradient(1.5px 1.5px at 8% 78%,#fff,transparent),radial-gradient(2px 2px at 46% 88%,rgba(255,255,255,.8),transparent);background-size:100% 900px;animation:cc-twinkle 4s ease-in-out infinite alternate}
@keyframes cc-twinkle{from{opacity:.55}to{opacity:1}}
#faf-course .cc-loading{color:rgba(255,255,255,.85)}
#faf-course .cc-title{color:#fff;font-size:30px;text-shadow:0 0 24px rgba(124,243,255,.45)}
#faf-course .cc-sub{color:rgba(255,255,255,.78)}
#faf-course .cc-premium{background:linear-gradient(135deg,#FFE27A,#FFB020);color:#3A2400;box-shadow:0 0 0 1px rgba(255,255,255,.4) inset,0 0 18px rgba(255,200,60,.55)}
.cc-stat,.cc-level,#faf-course .cc-unit.is-open,#faf-course .cc-tool{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.26);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 28px rgba(16,8,80,.25),inset 0 1px 0 rgba(255,255,255,.25)}
#faf-course .cc-stat strong{color:#fff;font-family:Unbounded,Manrope,sans-serif;font-size:19px}
#faf-course .cc-stat-l{color:rgba(255,255,255,.75)}
#faf-course .cc-stat.is-flame .cc-ico{color:rgba(255,255,255,.45)}
#faf-course .cc-stat.is-flame.is-lit .cc-ico{color:#FFB547;filter:drop-shadow(0 0 6px #FF8A1F)}
#faf-course .cc-stat.is-xp .cc-ico{color:#FFE27A;filter:drop-shadow(0 0 6px rgba(255,210,80,.8))}
#faf-course .cc-stat.is-heart .cc-ico{color:#FF6B8B;filter:drop-shadow(0 0 6px rgba(255,80,120,.8))}
.cc-hud{display:flex;align-items:center;gap:14px}
.cc-ring{position:relative;width:72px;height:72px;flex:0 0 auto;filter:drop-shadow(0 0 10px rgba(124,243,255,.45))}
.cc-ring svg{display:block}
.cc-ring-p{transition:stroke-dashoffset 1s ease}
.cc-ring strong{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Unbounded,Manrope,sans-serif;font-size:22px;color:#fff}
.cc-hud-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.cc-hud-k{font-size:11px;font-weight:800;letter-spacing:.14em;color:#7CF3FF}
.cc-hud-txt strong{font-size:18px;color:#fff}
.cc-hud-s{font-size:12.5px;color:rgba(255,255,255,.75)}
#faf-course .cc-level-top{color:rgba(255,255,255,.8)}
#faf-course .cc-level-top strong{color:#fff}
#faf-course .cc-bar{background:rgba(255,255,255,.16);height:12px;position:relative}
#faf-course .cc-bar i{background:linear-gradient(90deg,#7CF3FF,#C38BFF);box-shadow:0 0 12px rgba(124,243,255,.7);position:relative;overflow:hidden}
#faf-course .cc-bar.is-goal i{background:linear-gradient(90deg,#FFE27A,#FF8A1F);box-shadow:0 0 12px rgba(255,160,40,.7)}
.cc-bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.55) 50%,transparent 80%);transform:translateX(-100%);animation:cc-shine 2.4s ease-in-out infinite}
@keyframes cc-shine{60%,100%{transform:translateX(100%)}}
#faf-course .cc-tool{color:#fff;border-radius:12px}
#faf-course .cc-tool b{color:#7CF3FF}
#faf-course .cc-tool:hover{border-color:#7CF3FF;box-shadow:0 0 16px rgba(124,243,255,.35)}
#faf-course .cc-lv-title{color:#fff;font-family:Unbounded,Manrope,sans-serif;font-weight:600;font-size:16px;letter-spacing:.01em}
#faf-course .cc-lv-code{background:linear-gradient(135deg,#7CF3FF,#C38BFF);color:#1B1060;box-shadow:0 0 14px rgba(124,243,255,.55)}
#faf-course .cc-unit{color:#fff}
#faf-course .cc-unit.is-open{border-color:rgba(124,243,255,.55);border-radius:22px}
#faf-course .cc-unit.is-done{border-color:rgba(80,240,170,.7)}
#faf-course .cc-unit.is-locked{background:rgba(10,6,60,.18);border:1px dashed rgba(255,255,255,.28);opacity:1}
#faf-course .cc-unit.is-locked h3{color:rgba(255,255,255,.7)}
#faf-course .cc-unit-n{color:#7CF3FF;letter-spacing:.08em;text-transform:uppercase;font-size:11px}
#faf-course .cc-unit h3{color:#fff;font-size:18px}
#faf-course .cc-unit p{color:rgba(255,255,255,.78)}
#faf-course .cc-badge{background:rgba(255,255,255,.14);color:rgba(255,255,255,.85)}
#faf-course .cc-badge.is-done{background:rgba(80,240,170,.2);color:#9CFFD5}
#faf-course .cc-path{position:relative}
.cc-wire{position:absolute;left:0;top:0;z-index:0;pointer-events:none;overflow:visible}
.cc-wire-bg{fill:none;stroke:rgba(255,255,255,.28);stroke-width:5;stroke-dasharray:2 12;stroke-linecap:round}
.cc-wire-on{fill:none;stroke:#7CF3FF;stroke-width:5;stroke-linecap:round;filter:drop-shadow(0 0 6px #7CF3FF)}
#faf-course .cc-step{z-index:1}
#faf-course .cc-node{background:radial-gradient(circle at 35% 30%,#B9A6FF 0%,#7B5CFF 35%,#4B2FE0 100%);box-shadow:0 7px 0 #2A178F,0 0 0 4px rgba(255,255,255,.18),0 0 26px rgba(160,130,255,.75)}
#faf-course .cc-node.is-done{background:radial-gradient(circle at 35% 30%,#B8FFE2 0%,#3FE0A0 38%,#139A69 100%);box-shadow:0 7px 0 #0B6B48,0 0 0 4px rgba(255,255,255,.18),0 0 24px rgba(63,224,160,.7)}
#faf-course .cc-node.is-locked{background:rgba(255,255,255,.14);color:rgba(255,255,255,.55);box-shadow:0 7px 0 rgba(16,8,80,.35),inset 0 0 0 2px rgba(255,255,255,.2)}
#faf-course .cc-node.is-chest{background:radial-gradient(circle at 35% 30%,#FFF1B0 0%,#FFC93C 40%,#F08A10 100%);box-shadow:0 7px 0 #A85A00,0 0 0 4px rgba(255,255,255,.18),0 0 26px rgba(255,190,60,.8);color:#5A3300}
#faf-course .cc-node.is-chest.is-locked{background:rgba(255,220,120,.18);color:rgba(255,230,160,.7);box-shadow:0 7px 0 rgba(16,8,80,.35),inset 0 0 0 2px rgba(255,220,120,.35)}
#faf-course .cc-node.is-chest.is-done{background:rgba(255,255,255,.14);color:rgba(255,255,255,.6);box-shadow:0 7px 0 rgba(16,8,80,.35)}
#faf-course .cc-node.is-test{border-radius:22px;transform:rotate(45deg)}
#faf-course .cc-node.is-test .cc-ico{transform:rotate(-45deg)}
#faf-course .cc-node.is-test:not(.is-locked):not(.is-done){background:radial-gradient(circle at 35% 30%,#FFD1F3 0%,#FF5FC8 40%,#B21F9A 100%);box-shadow:0 7px 0 #74115F,0 0 0 4px rgba(255,255,255,.18),0 0 28px rgba(255,95,200,.75)}
#faf-course .cc-node.is-current{animation:cc-glow 1.6s ease-in-out infinite}
@keyframes cc-glow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.18)}}
#faf-course .cc-node.is-current::after{content:"";position:absolute;inset:-12px;border-radius:inherit;border:2px solid rgba(124,243,255,.85);animation:cc-ripple 1.8s ease-out infinite;pointer-events:none}
#faf-course .cc-node{position:relative}
@keyframes cc-ripple{0%{transform:scale(.85);opacity:1}100%{transform:scale(1.35);opacity:0}}
#faf-course .cc-node-label{color:#fff;text-shadow:0 2px 8px rgba(16,8,80,.6);font-size:13px}
#faf-course .cc-stars{color:rgba(255,255,255,.3)}
#faf-course .cc-stars .is-on{color:#FFE27A;filter:drop-shadow(0 0 4px rgba(255,210,80,.9))}
#faf-course .cc-start{background:#fff;color:#4B2FE0;border:none;box-shadow:0 0 0 3px #7CF3FF,0 0 22px rgba(124,243,255,.8);letter-spacing:.06em;text-transform:uppercase;font-size:11.5px}

/* lição com acabamento de jogo */
.cc-lesson{background:radial-gradient(90% 40% at 50% 0%,var(--cs) 0%,var(--deck) 70%)}
.cc-bar.is-lesson{height:16px;background:var(--deck2);box-shadow:inset 0 2px 3px rgba(20,26,51,.08)}
.cc-bar.is-lesson i{background:linear-gradient(90deg,#3FE0A0,#7CF3FF,var(--ca));box-shadow:0 0 12px rgba(63,224,160,.6);position:relative;overflow:hidden}
.cc-combo{display:flex;align-items:center;justify-content:center;gap:4px;height:26px}
.cc-combo.is-on{color:#fff;background:linear-gradient(135deg,#FFB020,#FF5F3C);border-radius:999px;width:max-content;margin:0 auto;padding:0 12px;box-shadow:0 0 18px rgba(255,120,40,.6);letter-spacing:.05em;animation:cc-combo .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes cc-combo{0%{transform:scale(.6)}100%{transform:scale(1)}}
.cc-kicker{text-transform:uppercase;letter-spacing:.1em;font-size:11.5px}
.cc-opt{transition:transform .08s,border-color .15s,box-shadow .15s}
.cc-opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 var(--line)}
.cc-opt.is-sel{box-shadow:0 3px 0 var(--ca),0 0 0 4px rgba(91,61,245,.12)}
.cc-play{box-shadow:0 6px 0 rgba(20,26,51,.2),0 0 26px rgba(91,61,245,.45)}
.cc-l-foot.is-ok{background:linear-gradient(180deg,var(--tint-green),var(--tint-green2))}
.cc-l-foot.is-bad{background:linear-gradient(180deg,var(--tint-red),var(--tint-red2))}
.cc-l-foot.is-ok .cc-fb strong::before{content:"✓ ";}
.cc-l-foot.is-bad .cc-fb strong::before{content:"✕ ";}
.cc-result{position:relative}
.cc-lesson:has(.cc-result){background:radial-gradient(120% 60% at 50% 0%,#6C4BFF 0%,rgba(108,75,255,0) 60%),linear-gradient(180deg,#3A23C9,#3567EA)}
.cc-lesson:has(.cc-result) .cc-l-title{color:#fff;font-family:Unbounded,Manrope,sans-serif;font-weight:600;text-shadow:0 0 22px rgba(124,243,255,.5)}
.cc-lesson:has(.cc-result) .cc-tip.is-center{color:rgba(255,255,255,.85)}
.cc-lesson:has(.cc-result) .cc-res-grid div{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.28);backdrop-filter:blur(10px)}
.cc-lesson:has(.cc-result) .cc-res-grid strong{color:#fff;font-family:Unbounded,Manrope,sans-serif;font-size:20px}
.cc-lesson:has(.cc-result) .cc-res-grid .is-xp strong{color:#FFE27A;text-shadow:0 0 14px rgba(255,210,80,.7)}
.cc-lesson:has(.cc-result) .cc-res-grid span{color:rgba(255,255,255,.75)}
.cc-lesson:has(.cc-result) .cc-res-stars{color:rgba(255,255,255,.25)}
.cc-lesson:has(.cc-result) .cc-res-stars .is-on{color:#FFE27A;filter:drop-shadow(0 0 12px rgba(255,210,80,.9))}
.cc-lesson:has(.cc-result) .cc-streak-line{color:#FFD08A}
.cc-lesson:has(.cc-result) .cc-l-foot{border-top-color:rgba(255,255,255,.2);background:transparent}
.cc-lesson:has(.cc-result) .cc-l-foot .cc-btn{background:#fff;color:#4B2FE0;box-shadow:0 5px 0 #2A178F,0 0 24px rgba(124,243,255,.6)}
.cc-lesson:has(.cc-result) .cc-l-top .cc-bar{background:rgba(255,255,255,.2)}
.cc-lesson:has(.cc-result) .cc-icon-btn,.cc-lesson:has(.cc-result) .cc-l-hearts{color:#fff}
.cc-lesson:has(.cc-result) .cc-big-ico{box-shadow:0 0 34px rgba(255,210,80,.7)}
.cc-modal-box{box-shadow:0 30px 80px rgba(16,8,80,.35)}
.cc-big-ico.is-level{box-shadow:0 0 40px rgba(255,200,60,.75);animation:cc-pop .5s cubic-bezier(.2,1.6,.4,1)}
@media (prefers-reduced-motion:reduce){.cc-stars-bg,.cc-bar i::after,#faf-course .cc-node.is-current::after,#faf-course .cc-node.is-current{animation:none}}

/* ===== Conversa com a Lía ===== */
.cc-lia-card{display:flex;align-items:center;gap:14px;width:100%;margin:0 0 24px;padding:16px;border-radius:22px;border:1px solid rgba(255,255,255,.35);text-align:left;color:#fff;background:linear-gradient(120deg,rgba(255,95,200,.35),rgba(124,243,255,.25));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(16,8,80,.3),0 0 30px rgba(255,95,200,.25),inset 0 1px 0 rgba(255,255,255,.3);position:relative;overflow:hidden}
.cc-lia-card::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.25) 50%,transparent 70%);transform:translateX(-100%);animation:cc-shine 3.2s ease-in-out infinite;pointer-events:none}
.cc-lia-avatar{flex:0 0 auto;width:54px;height:54px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-family:Unbounded,Manrope,sans-serif;font-weight:600;font-size:24px;color:#fff;background:conic-gradient(from 210deg,#7CF3FF,#C38BFF,#FF5FC8,#7CF3FF);box-shadow:0 0 0 3px rgba(255,255,255,.35),0 0 22px rgba(195,139,255,.8);animation:cc-avatar 6s linear infinite}
@keyframes cc-avatar{0%,100%{filter:hue-rotate(0deg)}50%{filter:hue-rotate(25deg)}}
.cc-lia-avatar.is-sm{width:38px;height:38px;border-radius:12px;font-size:17px}
.cc-lia-avatar.is-xl{width:84px;height:84px;border-radius:26px;font-size:38px;margin:0 auto}
.cc-lia-txt{display:flex;flex-direction:column;gap:4px;font-size:13.5px;line-height:1.4;color:rgba(255,255,255,.9)}
.cc-lia-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cc-lia-top strong{font-size:17px;color:#fff}
.cc-lia-tag{font-size:10.5px;font-weight:800;letter-spacing:.1em;color:#1B1060;background:#7CF3FF;border-radius:999px;padding:3px 8px;box-shadow:0 0 12px rgba(124,243,255,.7)}
.cc-chat{background:radial-gradient(120% 50% at 50% 0%,var(--tint-purple) 0%,var(--ink) 60%)}
.cc-chat-top{display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));border-bottom:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px)}
.cc-chat-id{display:flex;flex-direction:column;line-height:1.2}
.cc-chat-id strong{font-size:16px}
.cc-chat-sub{font-size:12px;color:var(--muted)}
.cc-chat-main{flex:1 1 auto;overflow-y:auto;padding:18px 16px;max-width:680px;width:100%;margin:0 auto;box-sizing:border-box;display:flex;flex-direction:column;gap:12px}
.cc-chat-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:8px 0 6px}
.cc-chat-hero h2{margin:6px 0 0;font-family:Unbounded,Manrope,sans-serif;font-weight:600;font-size:22px}
.cc-chat-hero p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.5;max-width:420px}
.cc-chips{display:flex;gap:8px;flex-wrap:wrap}
.cc-chat .cc-tool{min-width:56px;min-height:42px;border-radius:12px;background:var(--deck);border:2px solid var(--line);color:var(--text);font-weight:800}
.cc-chat .cc-tool.is-on{border-color:var(--ca);background:var(--cs);color:var(--ca)}
.cc-scenes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cc-scene{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px;border-radius:16px;border:2px solid var(--line);background:var(--deck);color:var(--text);box-shadow:0 3px 0 var(--line);min-height:84px}
.cc-scene strong{font-size:15px}.cc-scene span{font-size:12.5px;color:var(--muted);line-height:1.35}
.cc-scene:hover{border-color:var(--ca)}
.cc-chat-note{margin:6px 0 0;font-size:12px;color:var(--muted);line-height:1.45;text-align:center}
.cc-msgs{display:flex;flex-direction:column;gap:12px}
.cc-msg{max-width:84%;padding:12px 14px;border-radius:18px;font-size:16px;line-height:1.45;animation:cc-in .25s ease}
@keyframes cc-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.cc-msg p{margin:0}
.cc-msg.is-lia{align-self:flex-start;background:var(--deck);border:1px solid var(--line);border-bottom-left-radius:6px;box-shadow:0 6px 18px rgba(20,26,51,.06)}
.cc-msg.is-me{align-self:flex-end;color:#fff;background:linear-gradient(135deg,var(--ca),var(--cb));border-bottom-right-radius:6px;box-shadow:0 6px 18px rgba(91,61,245,.25)}
.cc-msg.is-me.is-good::after{content:"✓";display:inline-block;margin-left:8px;font-weight:800;color:#9CFFD5}
.cc-msg-tr{margin-top:8px!important;padding-top:8px;border-top:1px dashed var(--line);color:var(--muted);font-size:14.5px}
.cc-msg-tools{display:flex;gap:6px;margin-top:8px}
.cc-msg-tools button{min-height:34px;min-width:34px;padding:0 10px;border-radius:10px;border:none;background:var(--cs);color:var(--ca);font-weight:700;font-size:13px;display:inline-flex;align-items:center;justify-content:center}
.cc-msg-tools .cc-ico svg{width:18px;height:18px}
.cc-msg-note{margin-top:8px!important;font-size:13px;color:var(--yellow-t);background:var(--tint-yellow);border-radius:10px;padding:8px 10px}
.cc-fix{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--tint-yellow);color:#5A3A00;display:flex;flex-direction:column;gap:2px;font-size:14px;line-height:1.4}
.cc-fix strong{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--yellow-t)}
.cc-msg.is-typing{display:flex;gap:5px;padding:14px 16px}
.cc-msg.is-typing i{width:8px;height:8px;border-radius:50%;background:var(--ca);opacity:.4;animation:cc-dot 1s infinite}
.cc-msg.is-typing i:nth-child(2){animation-delay:.15s}.cc-msg.is-typing i:nth-child(3){animation-delay:.3s}
@keyframes cc-dot{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
.cc-chat-foot{flex:0 0 auto;border-top:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);padding:10px 14px;padding-bottom:max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.cc-chat-foot:empty{display:none}
.cc-sugg{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;max-width:680px;width:100%;margin:0 auto}
.cc-sugg:empty{display:none}
.cc-sugg-chip{flex:0 0 auto;min-height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--ca);background:var(--cs);color:var(--ca);font-weight:700;font-size:14px;white-space:nowrap}
.cc-input-row{display:flex;align-items:flex-end;gap:8px;max-width:680px;width:100%;margin:0 auto}
.cc-input{flex:1 1 auto;min-height:48px;max-height:120px;resize:none;box-sizing:border-box;padding:12px 14px;border-radius:16px;border:2px solid var(--line);font:inherit;font-size:16px;color:var(--text);background:var(--deck);outline:none}
.cc-input:focus{border-color:var(--ca)}
.cc-send,.cc-mic{flex:0 0 auto;width:48px;height:48px;border-radius:16px;border:none;display:flex;align-items:center;justify-content:center}
.cc-send{color:#fff;background:linear-gradient(135deg,var(--ca),var(--cb));box-shadow:0 0 16px rgba(91,61,245,.35)}
.cc-send:disabled{background:var(--off);box-shadow:none;color:var(--faint)}
.cc-mic{background:var(--cs);color:var(--ca)}
.cc-mic.is-rec{background:#FF5F7E;color:#fff;animation:cc-glow 1s ease-in-out infinite}

.cc-voice-toggle{margin-left:auto;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--ca);background:var(--cs);color:var(--ca);font-size:12.5px;font-weight:800;white-space:nowrap}
.cc-voice-toggle[aria-pressed="false"]{border-color:var(--line2);background:var(--deck);color:var(--muted)}
.cc-msg-tools button.is-loading{animation:cc-glow .8s ease-in-out infinite;opacity:.7}

/* etapas premium */
#faf-course .cc-node.is-premium:not(.is-locked):not(.is-done){background:radial-gradient(circle at 35% 30%,#FFF6C8 0%,#FFD24A 35%,#E08A00 100%);color:#4A2A00;box-shadow:0 7px 0 #9A5A00,0 0 0 4px rgba(255,226,122,.5),0 0 30px rgba(255,200,60,.85)}
#faf-course .cc-node.is-premium.is-locked{box-shadow:0 7px 0 rgba(16,8,80,.35),inset 0 0 0 2px rgba(255,226,122,.55)}
.cc-node-tag{font-size:9.5px;font-weight:800;letter-spacing:.14em;color:#3A2400;background:linear-gradient(135deg,#FFE27A,#FFB020);border-radius:999px;padding:2px 8px;box-shadow:0 0 10px rgba(255,200,60,.6)}
.cc-kicker-premium{color:var(--yellow-t)}
.cc-premium-actions{display:flex;gap:10px;flex-wrap:wrap}
.cc-premium-actions .cc-btn{min-height:46px;font-size:15px}
.cc-vocab.is-dialog li{align-items:flex-start}
.cc-dlg-who{font-size:12px!important;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ca)!important}
body.cc-locked #faf-sheet{z-index:96}

.cc-input{width:100%;box-sizing:border-box;min-height:84px;margin-top:14px;padding:14px;border:2px solid var(--line);border-radius:14px;font:inherit;font-size:18px;color:var(--text);background:var(--deck);resize:none}
.cc-input:focus{outline:none;border-color:var(--ca,#5B3DF5)}
.cc-keys{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cc-key{min-width:40px;min-height:40px;border-radius:10px;border:2px solid var(--line);background:var(--deck);color:var(--text);font-size:17px;font-weight:700}
.cc-mic-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:22px}
.cc-bigmic{width:84px;height:84px;border-radius:50%;border:none;color:#fff;background:var(--brand-grad);box-shadow:0 6px 0 #2A178F;display:flex;align-items:center;justify-content:center}
.cc-bigmic.is-on{animation:cc-pulse 1s ease-in-out infinite;background:linear-gradient(135deg,#E0457B,#B4234A);box-shadow:0 6px 0 #74113A}
.cc-heard{margin:0;text-align:center;font-size:15px;color:var(--muted);min-height:22px}
.cc-note{display:block;margin-top:4px;font-size:14px}
.cc-fill-pt{margin:8px 0 0;font-size:15px;line-height:1.4;color:var(--muted)}

/* tela inicial (modelo navy + dourado) */
.hm{position:relative}
.hm button{font-family:Inter,system-ui,sans-serif}
.hm-premium{position:fixed;top:calc(17px + env(safe-area-inset-top));right:max(16px,calc((100vw - 560px) / 2 + 16px));z-index:25;display:flex;align-items:center;gap:8px;height:44px;padding:0 18px 0 14px;border-radius:999px;border:1.5px solid #EBC274;background:#FFF9EC;color:var(--gold-deep,#B07A1C);font-size:16px;font-weight:600;box-shadow:0 4px 14px rgba(176,122,28,.10)}
body.tr-open .hm-premium{display:none}
.hm-hello{padding-top:14px}
.hm-hello h1{margin:0;font-family:Inter,system-ui,sans-serif;font-weight:800;font-size:52px;line-height:1.05;letter-spacing:-.025em;color:var(--text)}
.hm-hello p{margin:2px 0 0;font-size:32px;line-height:1.2;font-weight:500;letter-spacing:-.015em;color:#38466E}
.hm-course{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:none;border-radius:22px;padding:14px 16px 14px 14px;color:#fff;background:radial-gradient(120% 140% at 100% 0%,#24407A 0%,rgba(36,64,122,0) 55%),linear-gradient(135deg,#1A2E5C 0%,#0F1D3D 100%);box-shadow:0 14px 30px rgba(15,29,61,.28)}
.hm-course-art{flex:0 0 auto;width:78px;height:72px;border-radius:16px;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center}
.hm-course-sep{flex:0 0 auto;width:1px;align-self:stretch;margin:6px 0;background:rgba(255,255,255,.16)}
.hm-course-body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:5px}
.hm-course-title{font-size:19px;font-weight:700;letter-spacing:-.01em}
.hm-course-sub{font-size:13.5px;color:rgba(255,255,255,.78);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hm-course-bar{display:block;height:7px;margin-top:8px;border-radius:999px;background:rgba(255,255,255,.28);overflow:hidden}
.hm-course-side{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:10px}
.hm-play{width:50px;height:50px;border-radius:999px;background:linear-gradient(180deg,#F7C55A,#EFA92E);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(242,179,61,.35);padding-left:3px;box-sizing:border-box}
.hm-pct{font-size:14px;font-weight:600;color:#fff}
.hm-goal{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:var(--deck);border:1px solid var(--line);border-radius:22px;padding:16px 16px 16px 20px;color:var(--text);box-shadow:0 6px 20px rgba(15,27,61,.05)}
.hm-goal-ic{flex:0 0 auto;display:flex}
.hm-sep{flex:0 0 auto;width:1px;height:40px;background:var(--line2)}
.hm-sep.is-gold{height:28px;background:#E6C38A}
.hm-goal-body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px}
.hm-goal-title{font-size:18px;font-weight:700}
.hm-goal-sub{font-size:15px;color:var(--muted)}
.hm-chev{flex:0 0 auto;color:var(--faint)}
.hm-day{position:relative;overflow:hidden;border-radius:22px;padding:20px 20px 22px;background:linear-gradient(135deg,#FDF6EA 0%,#FBEEDB 100%);border:1px solid #F3E2C4;display:flex;flex-direction:column;gap:8px}
.hm-day-deco{position:absolute;right:-46px;bottom:-34px;color:#E8CFA3;opacity:.4;pointer-events:none}
.hm-day-head{position:relative;display:flex;align-items:center;gap:12px;color:#B07A1C;font-size:14.5px;font-weight:600;margin-bottom:6px}
.hm-day-es{position:relative;margin:0;font-size:25px;font-weight:700;line-height:1.2;letter-spacing:-.01em;color:var(--text);max-width:88%}
.hm-day-pt{position:relative;margin:0;font-size:16px;color:var(--muted)}
.hm-day-nota{position:relative;margin:0;font-size:13px;line-height:1.45;color:#8A6A3A;max-width:80%}
.hm-day-btn{position:relative;align-self:flex-start;display:flex;align-items:center;gap:10px;min-height:48px;margin-top:10px;padding:0 24px 0 20px;border:1.5px solid #C9A065;background:rgba(255,255,255,.35);color:var(--text);border-radius:999px;font-size:16px;font-weight:600}
.hm-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:12px 0 6px}
.hm-stats>div{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:0 8px}
.hm-stats>div+div{border-left:1px solid var(--line2)}
.hm-stats strong{font-size:36px;font-weight:800;line-height:1.1;color:var(--text)}
.hm-stats span{font-size:14px;line-height:1.3;color:var(--muted)}
#app nav.hm-nav{margin:0 12px calc(8px + env(safe-area-inset-bottom));padding:6px 4px;border:1px solid var(--line)!important;border-radius:26px;box-shadow:0 8px 28px rgba(15,27,61,.10);background:var(--glass)!important}
.hm-nav button{position:relative}
.hm-nav button.is-on::after{content:"";position:absolute;bottom:2px;left:22%;right:22%;height:4px;border-radius:999px;background:var(--gold,#F2B33D)}
@media (prefers-color-scheme:dark){
html:not([data-theme="light"]) .hm-hello p{color:var(--text2)}
html:not([data-theme="light"]) .hm-premium{background:rgba(242,179,61,.12);border-color:rgba(242,179,61,.45);color:#F5C66A}
html:not([data-theme="light"]) .hm-goal-ic circle,html:not([data-theme="light"]) .hm-goal-ic path[stroke="#0F1B3D"]{stroke:var(--text)}
html:not([data-theme="light"]) .hm-goal-ic circle[fill="#0F1B3D"]{fill:var(--text)}
html:not([data-theme="light"]) .hm-day{background:linear-gradient(135deg,#2A2418,#221D14);border-color:#3A3020}
html:not([data-theme="light"]) .hm-day-deco{color:#5A4A2C}
html:not([data-theme="light"]) .hm-day-head{color:#F5C66A}
html:not([data-theme="light"]) .hm-day-nota{color:#C9B48E}
html:not([data-theme="light"]) .hm-day-btn{border-color:#8A6A3A;background:transparent}
}

html[data-theme="dark"] .hm-hello p{color:var(--text2)}
html[data-theme="dark"] .hm-premium{background:rgba(242,179,61,.12);border-color:rgba(242,179,61,.45);color:#F5C66A}
html[data-theme="dark"] .hm-goal-ic circle,html[data-theme="dark"] .hm-goal-ic path[stroke="#0F1B3D"]{stroke:var(--text)}
html[data-theme="dark"] .hm-goal-ic circle[fill="#0F1B3D"]{fill:var(--text)}
html[data-theme="dark"] .hm-day{background:linear-gradient(135deg,#2A2418,#221D14);border-color:#3A3020}
html[data-theme="dark"] .hm-day-deco{color:#5A4A2C}
html[data-theme="dark"] .hm-day-head{color:#F5C66A}
html[data-theme="dark"] .hm-day-nota{color:#C9B48E}
html[data-theme="dark"] .hm-day-btn{border-color:#8A6A3A;background:transparent}




/* aviso: toque em Categorias */
.ch-tip{position:relative;display:flex;align-items:center;gap:10px;margin-top:-6px;padding:12px 12px 12px 14px;border-radius:16px;background:var(--brand);color:#fff;box-shadow:0 10px 24px rgba(15,27,61,.22);animation:ch-in .5s cubic-bezier(.2,.8,.2,1) both,ch-float 2.6s ease-in-out .6s infinite}
.ch-arrow{position:absolute;top:-7px;right:calc(16.66% - 7px);width:14px;height:14px;background:var(--brand);transform:rotate(45deg);border-radius:3px}
.ch-ic{flex:0 0 auto;width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.14);color:var(--gold,#F2B33D);display:flex;align-items:center;justify-content:center;animation:ch-tap 1.6s ease-in-out .8s infinite}
.ch-txt{flex:1 1 auto;font-size:14px;line-height:1.4}
.ch-txt b{color:var(--gold,#F2B33D)}
.ch-x{flex:0 0 auto;width:36px;height:36px;border:none;border-radius:999px;background:rgba(255,255,255,.12);color:#fff;font-size:20px;line-height:1}
.ch-pulse{position:relative;animation:ch-pulse 1.8s ease-in-out infinite}
@keyframes ch-in{from{opacity:0;transform:translateY(-8px) scale(.97)}to{opacity:1;transform:none}}
@keyframes ch-float{0%,100%{translate:0 0}50%{translate:0 3px}}
@keyframes ch-tap{0%,100%{transform:scale(1)}50%{transform:scale(.86)}}
@keyframes ch-pulse{0%,100%{box-shadow:0 0 0 0 rgba(242,179,61,0)}50%{box-shadow:0 0 0 4px rgba(242,179,61,.55)}}
@media (prefers-reduced-motion:reduce){.ch-tip,.ch-ic,.ch-pulse{animation:none}}
/* boas-vindas (novos usuários) */
.fw{position:fixed;inset:0;z-index:104;display:flex;flex-direction:column;background:var(--ink);font-family:Inter,system-ui,sans-serif;overflow-y:auto;animation:fm-fade .25s ease}
.fw.is-out{opacity:0;transition:opacity .3s}
body.fw-open #faf-menu-btn,body.fw-open .hm-premium{display:none}
.fw-top{position:relative;flex:1 0 auto;display:flex;flex-direction:column;justify-content:flex-end;gap:14px;padding:calc(34px + env(safe-area-inset-top)) 26px 30px;color:#fff;background:radial-gradient(120% 80% at 100% 0%,#2A4C93 0%,rgba(42,76,147,0) 60%),linear-gradient(160deg,#1A2E5C 0%,#0F1D3D 100%);border-radius:0 0 32px 32px;overflow:hidden}
.fw-top::after{content:"";position:absolute;right:-60px;bottom:-60px;width:220px;height:220px;border-radius:50%;border:28px solid rgba(242,179,61,.12)}
.fw-bubbles{display:flex;flex-direction:column;gap:10px;margin-bottom:auto;padding-top:6px}
.fw-b{max-width:70%;padding:12px 16px;border-radius:20px;font-size:17px;font-weight:600;box-shadow:0 10px 24px rgba(0,0,0,.18)}
.fw-b.is-es{align-self:flex-start;background:#F2B33D;color:#0F1B3D;border-bottom-left-radius:6px;animation:fw-pop .5s .15s both cubic-bezier(.2,.8,.2,1)}
.fw-b.is-pt{align-self:flex-end;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.25);border-bottom-right-radius:6px;animation:fw-pop .5s .45s both cubic-bezier(.2,.8,.2,1)}
@keyframes fw-pop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.fw-brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;color:#F5C66A;margin-top:18px}
.fw-logo{width:34px;height:34px;border-radius:11px;background:#F2B33D;color:#0F1B3D;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
.fw-top h1{margin:0;font-size:34px;line-height:1.1;font-weight:800;letter-spacing:-.025em}
.fw-list{margin:4px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.fw-list li{position:relative;padding-left:26px;font-size:15px;line-height:1.4;color:rgba(255,255,255,.85)}
.fw-list li::before{content:"";position:absolute;left:2px;top:5px;width:12px;height:7px;border-left:2.5px solid #F2B33D;border-bottom:2.5px solid #F2B33D;transform:rotate(-45deg)}
.fw-card{flex:0 0 auto;width:100%;max-width:520px;margin:0 auto;box-sizing:border-box;padding:22px 22px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.fw-skip{align-self:center;min-height:44px;padding:0 12px;border:none;background:transparent;color:var(--text);font:inherit;font-size:15px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.fw-card .fa-small{text-align:center}
.fw-wait{margin:0;padding:18px 0;text-align:center;font-size:15px;color:var(--muted)}
.fw-err{margin:0;padding:10px 12px;border-radius:12px;font-size:14px;background:var(--tint-red);color:var(--red-t)}
@media (prefers-reduced-motion:reduce){.fw,.fw-b{animation:none}}
/* conta (login) */
.fa-wrap{position:fixed;inset:0;z-index:105;display:flex;align-items:flex-end;justify-content:center;font-family:Inter,system-ui,sans-serif}
.fa-wrap[hidden]{display:none}
.fa-back{position:absolute;inset:0;background:rgba(15,27,61,.45);animation:fm-fade .2s ease}
.fa-sheet{position:relative;width:100%;max-width:520px;max-height:94vh;max-height:94dvh;overflow-y:auto;box-sizing:border-box;background:var(--ink);color:var(--text);border-radius:26px 26px 0 0;padding:12px 22px calc(26px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;animation:fa-up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes fa-up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (min-width:600px){.fa-wrap{align-items:center}.fa-sheet{border-radius:26px}}
.fa-top{display:flex;justify-content:flex-end}
.fa-x{width:42px;height:42px;border-radius:999px;border:1px solid var(--line2);background:var(--deck);color:var(--text);display:flex;align-items:center;justify-content:center}
.fa-hero{width:56px;height:56px;border-radius:18px;background:var(--brand-grad);color:var(--gold,#F2B33D);display:flex;align-items:center;justify-content:center;margin-top:-8px}
.fa-hero svg{width:28px;height:28px}
.fa-sheet h2{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.fa-lead{margin:-4px 0 4px;font-size:15.5px;line-height:1.5;color:var(--text2)}
.fa-small{margin:0;font-size:13px;line-height:1.5;color:var(--muted)}
.fa-small a{color:var(--text);font-weight:600}
.fa-btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;width:100%;border-radius:16px;font:inherit;font-size:16px;font-weight:700;border:none;cursor:pointer}
.fa-btn:disabled{opacity:.55;cursor:default}
.fa-btn.is-main{background:var(--brand);color:#fff}
.fa-btn.is-google{background:var(--deck);color:var(--text);border:1.5px solid var(--line2);box-shadow:0 2px 8px rgba(15,27,61,.06)}
.fa-btn.is-light{background:var(--deck);color:var(--text);border:1px solid var(--line2)}
.fa-or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
.fa-or::before,.fa-or::after{content:"";flex:1;height:1px;background:var(--line2)}
.fa-seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--deck2);border-radius:14px}
.fa-seg button{min-height:42px;border:none;border-radius:10px;background:transparent;color:var(--muted);font:inherit;font-size:14.5px;font-weight:600}
.fa-seg button[aria-selected="true"]{background:var(--deck);color:var(--text);box-shadow:0 1px 3px rgba(15,27,61,.12)}
.fa-form{display:flex;flex-direction:column;gap:12px}
.fa-field{display:flex;flex-direction:column;gap:6px}
.fa-field>span:first-child{font-size:13px;font-weight:600;color:var(--muted)}
.fa-inp{position:relative;display:flex}
.fa-inp input{flex:1;min-width:0;min-height:52px;box-sizing:border-box;border:1.5px solid var(--line2);border-radius:14px;background:var(--deck);color:var(--text);padding:0 14px;font:inherit;font-size:16px}
.fa-inp input:focus{outline:none;border-color:var(--brand)}
.fa-eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:none;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center}
.fa-msg{margin:0;padding:10px 12px;border-radius:12px;font-size:14px;line-height:1.45;background:var(--tint-red);color:var(--red-t)}
.fa-msg.is-ok{background:var(--tint-green);color:var(--green-t)}
.fa-link{align-self:center;min-height:44px;padding:0 10px;border:none;background:transparent;color:var(--text);font:inherit;font-size:14.5px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.fa-link.is-danger{color:var(--red-t)}
.fa-user{display:flex;align-items:center;gap:14px}
.fa-user img,.fa-ini{flex:0 0 auto;width:64px;height:64px;border-radius:999px;object-fit:cover}
.fa-ini{display:flex;align-items:center;justify-content:center;background:var(--brand-grad);color:#fff;font-size:26px;font-weight:700}
.fa-user h2{font-size:22px}
.fa-user p{margin:2px 0 0;font-size:14.5px;color:var(--text2);word-break:break-all}
.fa-user small{font-size:12.5px;color:var(--muted)}
.fa-sync{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--tint-green);color:var(--green-t);font-size:14px;font-weight:600}
.fa-sync.is-err{background:var(--tint-yellow);color:var(--yellow-t)}
.fa-choice{display:flex;flex-direction:column;gap:10px}
.fa-note{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:120;background:var(--solid);color:#fff;padding:12px 18px;border-radius:14px;font:600 14px Inter,system-ui,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.2);transition:opacity .4s}
.fa-note.is-out{opacity:0}
body.fa-open #faf-menu-btn{display:none}
/* menu lateral */
#faf-menu-btn{position:fixed;top:calc(14px + env(safe-area-inset-top));left:max(16px,calc((100vw - 560px) / 2 + 16px));z-index:45;width:50px;height:50px;border-radius:16px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--text);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(20,26,51,.10);cursor:pointer}
#faf-menu-btn:focus-visible,.fm-item:focus-visible,.fm-close:focus-visible{outline:3px solid #5B3DF5;outline-offset:2px}
#faf-sheet:not([hidden]) ~ #faf-menu-btn,body.tr-open #faf-menu-btn{display:none}
#faf-course .cc-head{padding-top:46px}
#faf-menu{position:fixed;inset:0;z-index:100;display:flex;justify-content:flex-start}
#faf-menu[hidden]{display:none}
.fm-backdrop{position:absolute;inset:0;background:rgba(20,26,51,.45);animation:fm-fade .2s ease}
.fm-panel{position:relative;width:min(320px,86vw);height:100%;background:var(--ink);color:var(--text);display:flex;flex-direction:column;box-shadow:12px 0 40px rgba(20,26,51,.22);animation:fm-in .24s cubic-bezier(.2,.8,.2,1);padding:calc(16px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom));box-sizing:border-box;overflow-y:auto;font-family:Inter,system-ui,sans-serif}
.fm-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 6px 14px}
.fm-brand{display:flex;flex-direction:column;gap:2px}
.fm-brand span{font-size:13px;font-weight:600;color:var(--accent-t)}
.fm-brand strong{font-family:Unbounded,Manrope,system-ui,sans-serif;font-weight:600;font-size:22px}
.fm-close{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--deck);color:var(--text);display:flex;align-items:center;justify-content:center}
.fm-sec{margin:14px 8px 6px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.fm-item{width:100%;min-height:52px;display:flex;align-items:center;gap:12px;padding:8px 12px;border:none;border-radius:14px;background:transparent;color:var(--text);text-align:left;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.fm-item:hover{background:var(--deck2)}
.fm-item.is-active{background:var(--tint-purple);color:var(--accent-t)}
.fm-item .fm-ic{flex:0 0 auto;width:36px;height:36px;border-radius:11px;background:var(--deck);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:inherit}
.fm-item.is-active .fm-ic{border-color:var(--line-purple)}
.fm-item .fm-txt{display:flex;flex-direction:column;gap:1px;min-width:0}
.fm-item .fm-txt small{font-size:12.5px;font-weight:500;color:var(--muted)}
.fm-item .fm-tag{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted);background:var(--deck2);border-radius:999px;padding:3px 8px}
.fm-item.is-danger{color:var(--red-t)}
.fm-item.is-danger .fm-ic{border-color:var(--line-red);background:var(--tint-red)}
.fm-modal{position:fixed;inset:0;z-index:110;background:rgba(20,26,51,.5);display:flex;align-items:center;justify-content:center;padding:20px;font-family:Inter,system-ui,sans-serif}
.fm-dialog{width:100%;max-width:420px;background:var(--deck);color:var(--text);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(20,26,51,.3)}
.fm-dialog h2{margin:0;font-family:Manrope,system-ui,sans-serif;font-size:21px}
.fm-dialog p{margin:0;font-size:14.5px;line-height:1.5;color:var(--text2)}
.fm-dialog label{font-size:13px;font-weight:700;color:var(--muted)}
.fm-dialog input{min-height:48px;border-radius:12px;border:2px solid var(--line2);padding:0 12px;font:inherit;font-size:16px;letter-spacing:.06em}
.fm-dialog input:focus{outline:none;border-color:#B4234A}
.fm-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.fm-actions button{min-height:48px;padding:0 18px;border-radius:12px;font:inherit;font-size:15px;font-weight:700}
.fm-cancel{border:1px solid var(--line2);background:var(--deck);color:var(--text)}
.fm-danger{border:none;background:#B4234A;color:#fff}
.fm-danger:disabled{background:#E9C3CD;color:#fff}
@keyframes fm-in{from{transform:translateX(-100%)}to{transform:none}}
@keyframes fm-fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.fm-panel,.fm-backdrop{animation:none}}


/* ===== acabamento fino (vale para claro e escuro) ===== */
:root{--hair:rgba(20,26,51,.07);--hair2:rgba(20,26,51,.12);--lift:0 1px 2px rgba(20,26,51,.04),0 8px 24px -12px rgba(20,26,51,.10);--ease:cubic-bezier(.2,.8,.2,1)}
@media (prefers-color-scheme:dark){html:not([data-theme="light"]){--hair:rgba(255,255,255,.06);--hair2:rgba(255,255,255,.10);--lift:none}}
html[data-theme="dark"]{--hair:rgba(255,255,255,.06);--hair2:rgba(255,255,255,.10);--lift:none}
html{text-rendering:optimizeLegibility}
#app,#app button,#app input,#app textarea,#app select{font-family:Inter,Manrope,system-ui,sans-serif;font-feature-settings:"cv11","ss01","ss03"}
#app{letter-spacing:-.006em}
/* títulos: mais finos e justos */
#app h1{font-family:Inter,Manrope,system-ui,sans-serif!important;font-weight:700!important;letter-spacing:-.035em!important;font-size:30px!important;line-height:1.1!important}
#app h2{letter-spacing:-.015em}
#app [style*="font-weight: 800"]{font-weight:700!important}
#app p[style*="font-size: 26px"],#app span[style*="font-size: 26px"]{letter-spacing:-.025em;font-variant-numeric:tabular-nums}
/* cartões: borda de um fio e sombra quase invisível */
#app [style*="background: var(--deck)"][style*="border: 1px solid var(--line)"]{border-color:var(--hair)!important;box-shadow:var(--lift)}
#app [style*="background: var(--deck)"][style*="border-radius: 20px"],#app [style*="background: var(--deck)"][style*="border-radius: 18px"]{border-radius:18px!important}
/* botões secundários e chips: contorno mais leve */
#app button[style*="border: 1px solid var(--line2)"]{border-color:var(--hair2)!important;box-shadow:none}
#app [style*="border: 1px solid var(--line2)"]:not(button){border-color:var(--hair2)!important}
#app input,#app textarea{border-color:var(--hair2)!important;transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
#app input:focus,#app textarea:focus{outline:none;border-color:var(--accent-t)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent-t) 18%,transparent)}
/* blocos de destaque: sombra suave e brilho discreto */
#app button[style*="var(--brand-grad)"]{box-shadow:0 10px 30px -12px rgba(91,61,245,.55)!important}
#app [style*="background: var(--brand-deep)"]{background-image:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.10),rgba(255,255,255,0) 55%)!important}
/* barras de progresso mais finas */
#app [style*="height: 10px; background: var(--deck2)"],#app [style*="height: 8px; background: var(--deck2)"]{height:6px!important}
/* ícones com traço mais fino */
#app svg[stroke-width="2"],#faf-menu-btn svg,.fm-panel svg{stroke-width:1.75}
/* toque: resposta suave */
#app button,.fm-item,.cc-btn,.cc-opt,.cc-tool{transition:transform .14s var(--ease),background-color .2s var(--ease),border-color .2s var(--ease),color .2s var(--ease),opacity .2s}
#app button:active:not(:disabled),.fm-item:active,.cc-tool:active{transform:scale(.975)}
/* barra inferior: vidro, fio fino e indicador só no ícone ativo */
#app nav{background:var(--glass)!important;backdrop-filter:saturate(1.4) blur(16px)!important;-webkit-backdrop-filter:saturate(1.4) blur(16px)!important;border-top:1px solid var(--hair)!important;padding-top:6px!important}
#app nav button{min-height:52px!important;font-size:11px!important;font-weight:600!important;gap:3px!important;letter-spacing:0}
#app nav button svg{width:22px;height:22px;padding:4px 18px;border-radius:999px;box-sizing:content-box;transition:background-color .25s var(--ease)}
#app nav button[style*="color: var(--accent-t)"] svg{background:var(--tint-purple);stroke-width:2}
/* botão do menu e painel */
#faf-menu-btn{border-color:var(--hair)!important;box-shadow:var(--lift)!important}
/* rolagem sem barra pesada */
@media (prefers-color-scheme:dark){html:not([data-theme="light"]) #app button[style*="background: var(--brand-deep)"]{background:var(--brand)!important;border-color:var(--brand)!important}}
html[data-theme="dark"] #app button[style*="background: var(--brand-deep)"]{background:var(--brand)!important;border-color:var(--brand)!important}
#scroller{scrollbar-width:none}#scroller::-webkit-scrollbar{display:none}

/* ===== movimento: suave e elegante ===== */
:root{--ease-out:cubic-bezier(.16,1,.3,1);--ease-io:cubic-bezier(.65,0,.35,1);--t-fast:.18s;--t:.32s;--t-slow:.55s}
html,body,#app>div{transition:background-color .45s var(--ease-io),color .45s var(--ease-io)}
@keyframes faf-rise{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:none}}
@keyframes faf-fade{from{opacity:0}to{opacity:1}}
@keyframes faf-pop{0%{opacity:0;transform:scale(.94)}100%{opacity:1;transform:none}}
@keyframes faf-sheet-up{from{transform:translate3d(0,24px,0);opacity:0}to{transform:none;opacity:1}}
@keyframes faf-slide-up{from{transform:translate3d(0,100%,0)}to{transform:none}}
@keyframes faf-chip-in{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
@keyframes faf-shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-4px)}40%,60%{transform:translateX(4px)}}
@keyframes faf-glow-ok{0%{box-shadow:0 0 0 0 rgba(20,145,93,.35)}100%{box-shadow:0 0 0 10px rgba(20,145,93,0)}}

/* cores, contornos e larguras mudam com transição (a tela reaproveita os elementos) */
#app *,.fm-panel *,#faf-course *,.cc-lesson *{transition-property:background-color,border-color,color,fill,stroke,box-shadow,opacity,transform,width;transition-duration:var(--t);transition-timing-function:var(--ease-out)}
#app [style*="border-radius: 999px"]>[style*="width:"],#app [style*="border-radius: 999px; overflow: hidden"]>div,.cc-bar i{transition:width .7s var(--ease-out)!important}
#app button:active:not(:disabled),.fm-item:active,.cc-tool:active,.cc-btn:active:not(:disabled),.cc-opt:active:not(:disabled),.cc-chip:active,.cc-unit:active{transform:scale(.975);transition-duration:var(--t-fast)}

/* entrada de cada tela: sobe e aparece, em cascata */
body.faf-enter #scroller>div>*{animation:faf-rise var(--t-slow) var(--ease-out) both}
body.faf-enter #scroller>div>*:nth-child(2){animation-delay:.04s}
body.faf-enter #scroller>div>*:nth-child(3){animation-delay:.08s}
body.faf-enter #scroller>div>*:nth-child(4){animation-delay:.12s}
body.faf-enter #scroller>div>*:nth-child(5){animation-delay:.16s}
body.faf-enter #scroller>div>*:nth-child(6){animation-delay:.2s}
body.faf-enter #scroller>div>*:nth-child(7){animation-delay:.24s}
body.faf-enter #scroller>div>*:nth-child(n+8){animation-delay:.28s}
body.faf-enter #scroller [style*="display: grid"]>*{animation:faf-rise var(--t-slow) var(--ease-out) both}
body.faf-enter #scroller [style*="display: grid"]>*:nth-child(2n){animation-delay:.05s}
body.faf-enter #scroller [style*="display: grid"]>*:nth-child(3n){animation-delay:.09s}
body.faf-enter-first #scroller>div>*{animation-duration:.8s}

/* barra inferior: ícone ativo com leve impulso */
#app nav button svg{transition:background-color var(--t) var(--ease-out),transform var(--t) var(--ease-out),stroke-width var(--t)}
#app nav button[style*="color: var(--accent-t)"] svg{transform:translateY(-1px)}
#app nav button:active svg{transform:scale(.9)}

/* menu, janelas e player */
.fm-panel{animation:fm-in .42s var(--ease-out)!important}
.fm-backdrop{animation:faf-fade .3s var(--ease-io)!important}
.fm-panel .fm-item{animation:faf-rise .45s var(--ease-out) both}
.fm-panel .fm-item:nth-of-type(2){animation-delay:.03s}.fm-panel .fm-item:nth-of-type(3){animation-delay:.06s}.fm-panel .fm-item:nth-of-type(4){animation-delay:.09s}.fm-panel .fm-item:nth-of-type(5){animation-delay:.12s}.fm-panel .fm-item:nth-of-type(n+6){animation-delay:.15s}
.fm-dialog,.cc-modal-box{animation:faf-pop .38s var(--ease-out) both}
.cc-modal{animation:faf-fade .25s var(--ease-io) both}
#faf-sheet:not([hidden]){animation:faf-fade .28s var(--ease-io) both}
#faf-sheet:not([hidden]) .faf-panel{animation:faf-sheet-up .45s var(--ease-out) both}
#faf-dock:not([hidden]) .faf-dock-card{animation:faf-sheet-up .45s var(--ease-out) both}
.faf-line{transition:color .35s var(--ease-out),transform .35s var(--ease-out)}
.faf-line.is-now .faf-line-text{transition:font-size .3s var(--ease-out)}
.cc-toast{transition:transform .5s var(--ease-out)!important}

/* curso: mapa aparece em cascata; lições abrem com suavidade */
#faf-course:not([hidden]){animation:faf-fade .35s var(--ease-io) both}
#faf-course .cc-head,#faf-course .cc-lia-card,#faf-course .cc-level,#faf-course .cc-unit{animation:faf-rise .6s var(--ease-out) both}
#faf-course .cc-lia-card{animation-delay:.06s}
#faf-course .cc-level{animation-delay:.1s}
#faf-course .cc-unit{animation-delay:.14s}
.cc-lesson{animation:faf-sheet-up .45s var(--ease-out) both}
.cc-l-main>*{animation:faf-rise .5s var(--ease-out) both}
.cc-l-main>*:nth-child(2){animation-delay:.05s}.cc-l-main>*:nth-child(3){animation-delay:.1s}.cc-l-main>*:nth-child(4){animation-delay:.15s}.cc-l-main>*:nth-child(n+5){animation-delay:.2s}
.cc-opts>*,.cc-options>*{animation:faf-rise .45s var(--ease-out) both}
.cc-opts>*:nth-child(2),.cc-options>*:nth-child(2){animation-delay:.04s}.cc-opts>*:nth-child(3),.cc-options>*:nth-child(3){animation-delay:.08s}.cc-opts>*:nth-child(4),.cc-options>*:nth-child(4){animation-delay:.12s}
.cc-chip{animation:faf-chip-in .3s var(--ease-out) both}
.cc-build.is-live .cc-chip,.cc-bank.is-live .cc-chip{animation:none}
.cc-l-foot.is-ok,.cc-l-foot.is-bad{animation:faf-sheet-up .4s var(--ease-out) both}
.cc-l-foot.is-bad .cc-fb{animation:faf-shake .45s var(--ease-io) both}
.cc-opt.is-ok,.cc-opt.is-right{animation:faf-glow-ok .7s var(--ease-out)}
.cc-result>*{animation:faf-pop .6s var(--ease-out) both}
.cc-result>*:nth-child(2){animation-delay:.08s}.cc-result>*:nth-child(3){animation-delay:.16s}.cc-result>*:nth-child(4){animation-delay:.24s}.cc-result>*:nth-child(n+5){animation-delay:.32s}
.cc-msg{animation:faf-rise .4s var(--ease-out) both}

@media (prefers-reduced-motion:reduce){
*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
}
#faf-exit-hint{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));z-index:200;transform:translate(-50%,12px);opacity:0;pointer-events:none;background:var(--solid);color:#fff;font:600 14px/1.3 Inter,Manrope,system-ui,sans-serif;padding:11px 18px;border-radius:999px;box-shadow:0 12px 30px rgba(0,0,0,.25);transition:opacity .3s cubic-bezier(.16,1,.3,1),transform .3s cubic-bezier(.16,1,.3,1);white-space:nowrap}
#faf-exit-hint.is-on{opacity:1;transform:translate(-50%,0)}

/* ===== Curso: neon 3D holográfico (15/11/2026) ===== */
