<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frase a Frase</title>
<meta name="description" content="Aprenda espanhol frase a frase: cartões, leitura guiada, prática e podcasts reais.">
<meta name="theme-color" content="#F6F5F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Frase a Frase">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#F6F5F1;height:100%}
body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;font-family:Inter,system-ui,sans-serif;color:#16181D}
a{color:#B4232A}a:hover{color:#8A1A20}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #F2C230;outline-offset:2px}
#app{height:100%}
body.has-dock #scroller{padding-bottom:132px !important}

/* mini player */
#faf-dock{position:fixed;left:0;right:0;bottom:80px;z-index:20;display:flex;justify-content:center;pointer-events:none;padding:0 8px}
#faf-dock[hidden]{display:none}
.faf-dock-card{pointer-events:auto;width:100%;max-width:544px;box-sizing:border-box;background:#16181D;color:#fff;border-radius:18px;padding:10px 12px 8px;box-shadow:0 8px 24px rgba(22,24,29,.28);display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.faf-dock-top{display:flex;align-items:center;gap:10px}
#faf-dock-info{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:none;color:inherit;text-align:left;padding:0}
#faf-dock-art{width:40px;height:40px;border-radius:8px;object-fit:cover;flex:0 0 auto;background:#2A2D35}
.faf-dock-text{min-width:0;display:flex;flex-direction:column}
#faf-dock-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#faf-dock-show{font-size:12px;color:#B9BCC5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.faf-ic{flex:0 0 auto;width:40px;height:40px;border-radius:999px;border:none;background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
#faf-toggle{width:44px;height:44px;background:#B4232A}
#faf-speed{width:auto;min-width:44px;padding:0 8px;border:1px solid #4A4E58;height:32px;font-size:12px}
.faf-dock-bottom{display:flex;align-items:center;gap:8px;font-size:11px;color:#B9BCC5;font-variant-numeric:tabular-nums}
#faf-seek{flex:1 1 auto;accent-color:#F2C230;height:20px;margin:0}

/* sheet */
#faf-sheet{position:fixed;inset:0;z-index:30;background:rgba(22,24,29,.5);display:flex;align-items:flex-end;justify-content:center}
#faf-sheet[hidden]{display:none}
.faf-panel{width:100%;max-width:560px;max-height:90vh;max-height:90dvh;background:#F6F5F1;border-radius:22px 22px 0 0;display:flex;flex-direction:column;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom)}
.faf-head{display:flex;align-items:flex-start;gap:12px;padding:18px 18px 10px}
.faf-head-text{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
#faf-sheet-title{margin:0;font-family:Fraunces,Georgia,serif;font-size:22px;line-height:1.2;font-weight:700}
#faf-sheet-sub{font-size:13px;color:#5B5F6B}
#faf-sheet-close{width:44px;height:44px;border-radius:999px;border:1px solid #D6D3CA;background:#fff;color:#16181D;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
#faf-sheet-body{overflow-y:auto;padding:4px 18px 22px;display:flex;flex-direction:column;gap:12px}
.faf-video{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000}
.faf-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.faf-apple iframe{width:100%;height:450px;border:0;border-radius:12px;background:#fff}
.faf-tip{margin:0;padding:10px 12px;background:#fff;border:1px solid #E6E4DD;border-radius:10px;font-size:14px;line-height:1.45;color:#3A3D45}
.faf-note{margin:0;font-size:13px;line-height:1.45;color:#5B5F6B}
.faf-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.faf-btn{min-height:48px;display:flex;align-items:center;justify-content:center;border-radius:12px;font-size:14px;font-weight:600;text-decoration:none;padding:0 12px;box-sizing:border-box;text-align:center}
.faf-btn-red{border:none;background:#B4232A;color:#fff}
.faf-btn-light{border:1px solid #D6D3CA;background:#fff;color:#16181D}
a.faf-btn-light{color:#16181D}
body.tr-open #faf-dock{z-index:40;bottom:0 !important}
body.tr-open .faf-panel{height:92vh;height:92dvh;max-height:none}
body.tr-open #faf-sheet-body{padding-bottom:130px}
.faf-tr-head{display:flex;flex-direction:column;gap:6px;position:sticky;top:-4px;background:#F6F5F1;padding:4px 0 8px;z-index:1;border-bottom:1px solid #E6E4DD}
.faf-tr-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.faf-tl-row{justify-content:flex-start;gap:8px}
.faf-tl-label{font-size:14px;color:#3A3D45}
.faf-tl-btn{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid #D6D3CA;background:#fff;color:#16181D;font-size:14px;font-weight:600}
.faf-tl-btn.is-on{background:#16181D;border-color:#16181D;color:#fff}
.faf-line-body{display:flex;flex-direction:column;gap:3px;min-width:0}
.faf-tl{display:none;font-size:15px;line-height:1.45;font-weight:400}
.faf-tl-pt{color:#1E6B45}
.faf-tl-en{color:#1D3D66;font-style:italic}
.faf-tl.is-err{color:#8A8E99;font-size:13px}
.show-pt .faf-tl-pt,.show-en .faf-tl-en{display:block}
.faf-back-btn{min-height:40px;padding:0 14px}
.faf-blur-toggle{display:flex;align-items:center;gap:6px;font-size:14px;color:#3A3D45;min-height:40px}
.faf-blur-toggle input{width:18px;height:18px;accent-color:#B4232A}
.faf-tr-title{margin:0;font-family:Fraunces,Georgia,serif;font-size:18px;line-height:1.3;font-weight:700}
.faf-tr{display:flex;flex-direction:column;gap:2px}
.faf-line{display:flex;gap:10px;align-items:baseline;text-align:left;width:100%;border:none;background:transparent;color:#16181D;padding:10px 12px;border-radius:12px;font-size:17px;line-height:1.5;transition:background .2s,color .2s}
.faf-line-time{flex:0 0 auto;min-width:40px;font-size:12px;color:#8A8E99;font-variant-numeric:tabular-nums}
.faf-line.is-past{color:#7A7E89}
.faf-line.is-now{background:#FBE9E7;color:#16181D;font-weight:600}
.faf-line.is-now .faf-line-time{color:#B4232A}
.faf-tr.is-blur .faf-line-text{filter:blur(6px)}
.faf-tr.is-blur .faf-line:hover .faf-line-text,.faf-tr.is-blur .faf-line:focus .faf-line-text{filter:none}
.faf-list{display:flex;flex-direction:column;gap:8px}
.faf-ep{display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:1px solid #E6E4DD;border-radius:14px;padding:12px;color:#16181D;min-height:56px}
.faf-ep.is-playing{border:2px solid #B4232A;background:#FBE9E7}
.faf-ep-icon{flex:0 0 auto;width:36px;height:36px;border-radius:999px;background:#16181D;color:#fff;display:flex;align-items:center;justify-content:center}
.faf-ep.is-playing .faf-ep-icon{background:#B4232A}
.faf-ep-text{min-width:0;display:flex;flex-direction:column;gap:2px}
.faf-ep-title{font-size:15px;font-weight:600;line-height:1.3}
.faf-ep-meta{font-size:12px;color:#5B5F6B}
</style>
</head>
<body>
<template id="app-template">
<div style="width: 100%; max-width: 560px; margin: 0 auto; height: 100vh; height: 100dvh; box-sizing: border-box; display: flex; flex-direction: column; background: #F6F5F1; color: #16181D; font-family: Inter, system-ui, sans-serif; overflow: hidden">

<div id="scroller" style="flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: calc(24px + env(safe-area-inset-top)) 20px 28px 20px; box-sizing: border-box">

<!-- ============ INÍCIO ============ -->
<sc-if value="{{showInicio}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 20px">
  <div style="display: flex; flex-direction: column; gap: 4px; padding-top: 8px">
    <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #B4232A">Frase a Frase</span>
    <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 34px; line-height: 1.1; font-weight: 700">¡Hola! Vamos praticar?</h1>
  </div>

  <div style="background: #FFFFFF; border: 1px solid #E6E4DD; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <span style="font-size: 15px; font-weight: 700">Meta de hoje</span>
      <span style="font-size: 14px; color: #5B5F6B">{{goalCount}} de {{goalTotal}} atividades</span>
    </div>
    <div style="height: 10px; background: #EFEDE6; border-radius: 999px; overflow: hidden">
      <div style="{{goalBar}}"></div>
    </div>
    <span style="font-size: 13px; color: #5B5F6B">{{goalMsg}}</span>
  </div>

  <div style="background: #16181D; color: #FFFFFF; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 12px">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #F2C230">Frase do dia · {{dia.cat}}</span>
    <p style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 26px; line-height: 1.2">{{dia.es}}</p>
    <p style="margin: 0; font-size: 15px; color: #D4D6DC">{{dia.pt}}</p>
    <sc-if value="{{dia.hasNota}}" hint-placeholder-val="{{ true }}">
      <p style="margin: 0; font-size: 13px; line-height: 1.45; color: #B9BCC5">{{dia.nota}}</p>
    </sc-if>
    <button onClick="{{speakDia}}" style="align-self: flex-start; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border: 1px solid #4A4E58; background: transparent; color: #FFFFFF; border-radius: 999px; font-size: 14px; font-weight: 600">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5Z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M19 5a10 10 0 0 1 0 14"></path></svg>
      Ouvir
    </button>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
    <div style="background: #FFFFFF; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 2px; border: 1px solid #E6E4DD">
      <span style="font-family: Fraunces, Georgia, serif; font-size: 26px; font-weight: 700">{{knownCount}}</span>
      <span style="font-size: 12px; line-height: 1.3; color: #5B5F6B">de {{phraseTotal}} frases que você sabe</span>
    </div>
    <div style="background: #FFFFFF; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 2px; border: 1px solid #E6E4DD">
      <span style="font-family: Fraunces, Georgia, serif; font-size: 26px; font-weight: 700">{{reviewCount}}</span>
      <span style="font-size: 12px; line-height: 1.3; color: #5B5F6B">frases para revisar</span>
    </div>
    <div style="background: #FFFFFF; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 2px; border: 1px solid #E6E4DD">
      <span style="font-family: Fraunces, Georgia, serif; font-size: 26px; font-weight: 700">{{readCount}}</span>
      <span style="font-size: 12px; line-height: 1.3; color: #5B5F6B">de {{textTotal}} textos concluídos</span>
    </div>
  </div>

  <sc-if value="{{hasReview}}" hint-placeholder-val="{{ false }}">
    <button onClick="{{goReview}}" style="min-height: 52px; border: none; background: #B4232A; color: #FFFFFF; border-radius: 14px; font-size: 15px; font-weight: 600">Revisar agora ({{reviewCount}})</button>
  </sc-if>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <h2 style="margin: 0; font-size: 16px; font-weight: 700">Continuar</h2>
    <button onClick="{{goFrases}}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; background: #FFFFFF; border: 1px solid #E6E4DD; border-radius: 16px; padding: 16px; color: #16181D">
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 16px; font-weight: 600">Frases por situação</span>
        <span style="font-size: 13px; color: #5B5F6B">6 temas, do restaurante ao trabalho</span>
      </span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
    </button>
    <button onClick="{{goTextos}}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; background: #FFFFFF; border: 1px solid #E6E4DD; border-radius: 16px; padding: 16px; color: #16181D">
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 16px; font-weight: 600">Leitura guiada</span>
        <span style="font-size: 13px; color: #5B5F6B">6 textos, do básico ao avançado</span>
      </span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
    </button>
    <button onClick="{{goPratica}}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; background: #FFFFFF; border: 1px solid #E6E4DD; border-radius: 16px; padding: 16px; color: #16181D">
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 16px; font-weight: 600">Prática</span>
        <span style="font-size: 13px; color: #5B5F6B">Montar frases, escuta e lacunas</span>
      </span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
    </button>
    <button onClick="{{goOuvir}}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; background: #FFFFFF; border: 1px solid #E6E4DD; border-radius: 16px; padding: 16px; color: #16181D">
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 16px; font-weight: 600">Ouvir e assistir</span>
        <span style="font-size: 13px; color: #5B5F6B">Podcasts e vídeos reais de falantes nativos</span>
      </span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
    </button>
  </div>

  <div style="background: #FFFFFF; border: 1px solid #E6E4DD; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
    <h2 style="margin: 0; font-size: 16px; font-weight: 700">Áudio</h2>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; color: #5B5F6B">Sotaque</span>
      <div style="display: flex; gap: 8px">
        <button onClick="{{setSpain}}" style="{{accentSpain}}">Espanha</button>
        <button onClick="{{setMexico}}" style="{{accentMexico}}">México</button>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; color: #5B5F6B">Velocidade</span>
      <div style="display: flex; gap: 8px">
        <button onClick="{{setNormal}}" style="{{rateNormal}}">Normal</button>
        <button onClick="{{setSlow}}" style="{{rateSlow}}">Lenta</button>
      </div>
    </div>
    <button onClick="{{resetAll}}" style="align-self: flex-start; min-height: 44px; padding: 0 4px; border: none; background: transparent; color: #B4232A; font-size: 14px; font-weight: 600; text-decoration: underline">Apagar meu progresso</button>
  </div>
</div>
</sc-if>

<!-- ============ FRASES ============ -->
<sc-if value="{{showFrases}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 16px">
  <h1 style="margin: 0; padding-top: 8px; font-family: Fraunces, Georgia, serif; font-size: 30px; font-weight: 700">Frases</h1>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; padding: 4px; background: #EFEDE6; border-radius: 14px">
    <button onClick="{{viewCards}}" style="{{fseg.cards}}">Cartões</button>
    <button onClick="{{viewLista}}" style="{{fseg.lista}}">Lista</button>
  </div>
  <div style="display: flex; flex-wrap: wrap; gap: 8px">
    <button onClick="{{pickAll}}" style="{{allPill}}">Todas</button>
    <sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
      <button onClick="{{c.pick}}" style="{{c.style}}">{{c.name}}</button>
    </sc-for>
    <button onClick="{{pickReview}}" style="{{reviewPill}}">Revisar ({{reviewCount}})</button>
  </div>

  <sc-if value="{{isLista}}" hint-placeholder-val="{{ false }}">
  <div style="display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="busca-frase" style="font-size: 13px; font-weight: 600; color: #5B5F6B">Buscar frase</label>
      <input id="busca-frase" type="search" value="{{query}}" onChange="{{onQuery}}" placeholder="Em espanhol ou português" style="min-height: 48px; box-sizing: border-box; width: 100%; padding: 0 14px; border: 1px solid #D6D3CA; border-radius: 12px; background: #FFFFFF; color: #16181D; font-family: inherit; font-size: 16px">
    </div>
    <span style="font-size: 13px; color: #5B5F6B">{{listCount}} · toque para estudar no cartão</span>
    <sc-for list="{{listItems}}" as="p" hint-placeholder-count="6">
      <div style="display: flex; align-items: stretch; gap: 8px; background: #FFFFFF; border: 1px solid #E6E4DD; border-radius: 16px; padding: 6px">
        <button onClick="{{p.open}}" style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; padding: 10px; border: none; background: transparent; color: #16181D; border-radius: 12px">
          <span style="font-family: Fraunces, Georgia, serif; font-size: 18px; line-height: 1.3">{{p.es}}</span>
          <span style="font-size: 14px; line-height: 1.4; color: #5B5F6B">{{p.pt}}</span>
          <span style="display: flex; align-items: center; gap: 6px; padding-top: 2px">
            <span style="font-size: 12px; font-weight: 600; color: #B4232A">{{p.cat}}</span>
            <sc-if value="{{p.isKnown}}" hint-placeholder-val="{{ false }}">
              <span style="font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #E3F1E8; color: #0F3F27">Já sei</span>
            </sc-if>
            <sc-if value="{{p.isReview}}" hint-placeholder-val="{{ false }}">
              <span style="font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #FDF3D0; color: #4A3A00">Revisar</span>
            </sc-if>
          </span>
        </button>
        <button onClick="{{p.speak}}" aria-label="Ouvir frase" style="flex: 0 0 auto; align-self: center; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid #D6D3CA; background: #FFFFFF; color: #16181D; border-radius: 999px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5Z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path></svg>
        </button>
      </div>
    </sc-for>
    <sc-if value="{{listEmpty}}" hint-placeholder-val="{{ false }}">
      <div style="background: #FFFFFF; border: 1px solid #E6E4DD; border-radius: 16px; padding: 20px; font-size: 14px; line-height: 1.5; color: #5B5F6B">{{listEmptyMsg}}</div>
    </sc-if>
  </div>
  </sc-if>

  <sc-if value="{{isCards}}" hint-placeholder-val="{{ true }}">
  <div style="display: flex; flex-direction: column; gap: 16px">
  <sc-if value="{{deckEmpty}}" hint-placeholder-val="{{ false }}">
    <div style="background: #FFFFFF; border: 1px solid #E6E4DD; border-radius: 24px; padding: 28px 22px; display: flex; flex-direction: column; gap: 10px">
      <p style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 22px">Nada para revisar.</p>
      <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #5B5F6B">As frases que você marcar como "Revisar depois" aparecem aqui. Escolha um tema acima para continuar.</p>
    </div>
  </sc-if>

(function () {
  'use strict';

  function get(scope, path) {
    path = path.trim();

    if (path === 'false') return false;
    var parts = path.split('.');
    var v = scope[parts[0]];
    for (var i = 1; i < parts.length; i++) v = v == null ? undefined : v[parts[i]];

  }
  function interp(str, scope) {
    return str.replace(/\{\{([^}]+)\}\}/g, function (m, p) {
      var v = get(scope, p);

  }
  function whole(str) {
    var m = /^\s*\{\{([^}]+)\}\}\s*$/.exec(str || '');
    return m ? m[1] : null;
  }
  var EVENTS = { onclick: 'click', onchange: 'input', oninput: 'input', onsubmit: 'submit', onkeydown: 'keydown' };

  function build(src, scope, out) {
    for (var n = src.firstChild; n; n = n.nextSibling) {

        out.appendChild(document.createTextNode(n.nodeValue.indexOf('{{') >= 0 ? interp(n.nodeValue, scope) : n.nodeValue));

        continue;
      }

        var list = get(scope, whole(n.getAttribute('list')) || '') || [];
        var as = n.getAttribute('as') || 'item';
        for (var i = 0; i < list.length; i++) {
          var s2 = Object.create(scope);
          s2[as] = list[i];
          build(n, s2, out);
        }
        continue;
      }
      var el = document.importNode(n, false);
      var attrs = Array.prototype.slice.call(n.attributes);
      for (var a = 0; a < attrs.length; a++) {
        var name = attrs[a].name, val = attrs[a].value;
        if (name.indexOf('hint-') === 0) { el.removeAttribute(name); continue; }
        if (val.indexOf('{{') < 0) continue;
        var lname = name.toLowerCase();
        if (EVENTS[lname]) {
          el.removeAttribute(name);
          var fn = get(scope, whole(val) || '');
          if (typeof fn === 'function') el.addEventListener(EVENTS[lname], (function (f) { return function (e) { f(e); }; })(fn));
          continue;
        }
        if (lname === 'value' && (tag === 'input' || tag === 'textarea')) {
          var v = get(scope, whole(val) || '');
          el.removeAttribute(name);
          el.value = v == null ? '' : String(v);
          continue;
        }
        el.setAttribute(name, interp(val, scope));
      }
      build(n, scope, el);
      out.appendChild(el);
    }
  }

  var tpl, mount, inst, pending = false, lastKey = null;

  function render() {
    pending = false;
    var vals = inst.renderVals();
    var scroller = document.getElementById('scroller');
    var top = scroller ? scroller.scrollTop : 0;
    var ae = document.activeElement, focusId = ae && ae.id, selS = null, selE = null;
    try { if (focusId && ae.selectionStart != null) { selS = ae.selectionStart; selE = ae.selectionEnd; } } catch (e) {}

    build(tpl.content, vals, frag);
    mount.replaceChildren(frag);
    var s = inst.state;
    var key = s.tab + '|' + s.reading + '|' + s.textIdx + '|' + s.pmode;
    scroller = document.getElementById('scroller');
    if (scroller) scroller.scrollTop = key === lastKey ? top : 0;
    lastKey = key;
    if (focusId) {
      var f = document.getElementById(focusId);

  };

  window.FAFBoot = function (Component) {
    tpl = document.getElementById('app-template');
    mount = document.getElementById('app');
    inst = new Component({});
    window.__fafApp = inst;
    render();
  };
})();

function todayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
}

function dayIndex() {
  var d = new Date();
  var start = new Date(d.getFullYear(), 0, 0);
  return Math.floor((d - start) / 86400000);
}

function optStyle(answered, idx, correct, picked) {
  var base = 'text-align: left; min-height: 48px; padding: 10px 14px; border-radius: 12px; font-size: 15px; font-weight: 500; ';
  if (answered && idx === correct) return base + 'border: 2px solid #1E6B45; background: #E3F1E8; color: #0F3F27';
  if (answered && idx === picked) return base + 'border: 2px solid #B4232A; background: #FBE9E7; color: #7A161B';
  return base + 'border: 1px solid #D6D3CA; background: #FFFFFF; color: #16181D';
}

      textListCount: textList.length === 1 ? '1 texto' : textList.length + ' textos',
      textList: textList.map(function (x) {
        var done = !!s.read[x.idx];
        var answered = x.questions.filter(function (q, qi) { return s.answers.hasOwnProperty(x.idx + '-' + qi); }).length;
        var status = done ? 'Concluído' : answered > 0 ? 'Em andamento' : 'Novo';
        return {
          title: x.title, nivel: x.nivel,
          preview: x.sentences[0][0],
          meta: x.sentences.length + ' frases · ' + x.words.length + ' palavras-chave · ' + x.questions.length + ' perguntas',
          status: status,
          statusStyle: 'font-size: 12px; font-weight: 600; ' + (done ? 'color: #1E6B45' : answered > 0 ? 'color: #B4232A' : 'color: #5B5F6B'),
          open: function () { self.setState({ textIdx: x.idx, reading: true, open: {} }); }
        };
      }),

      // Home
      goalCount: Math.min(s.goalCount, GOAL),
      goalTotal: GOAL,
      goalBar: 'height: 100%; width: ' + goalPct + '%; background: ' + (s.goalCount >= GOAL ? '#1E6B45' : '#B4232A') + '; border-radius: 999px',
      goalMsg: goalMsg,
      dia: { es: dia.es, pt: dia.pt, nota: dia.nota, hasNota: !!dia.nota, cat: dia.cat },
      speakDia: function () { speak(dia.es); },
      knownCount: knownCount,
      phraseTotal: ALL.length,
      reviewCount: reviewCount,
      hasReview: reviewCount > 0,
      readCount: Object.keys(s.read).length,
      textTotal: TEXTS.length,
      accentSpain: pill(s.lang === 'es-ES'),
      accentMexico: pill(s.lang === 'es-MX'),
      rateNormal: pill(s.rate !== 0.7),
      rateSlow: pill(s.rate === 0.7),
      setSpain: function () { self.setState({ lang: 'es-ES' }); },
      setMexico: function () { self.setState({ lang: 'es-MX' }); },
      setNormal: function () { self.setState({ rate: 0.9 }); },
      setSlow: function () { self.setState({ rate: 0.7 }); },
      resetAll: function () {
        self.setState({ known: {}, review: {}, answers: {}, read: {}, goalCount: 0, card: 0, cat: 0, flipped: false });
      },

      // Frases
      cats: CATS.map(function (x, idx) {
        return { name: x.name, style: pill(idx === s.cat), pick: function () { self.setState({ cat: idx, card: 0, flipped: false }); } };
      }),
      reviewPill: pill(s.cat === -1),
      deckEmpty: deck.length === 0,
      deckHas: deck.length > 0,
      deckLabel: s.cat === -1 ? 'Revisão' : s.cat === -2 ? 'Todas' : CATS[s.cat].name,
      card: { es: c.es, pt: c.pt, nota: c.nota, hasNota: !!c.nota, cat: c.cat, isKnown: !!s.known[c.key], isReview: !!s.review[c.key] },
      cardPos: cardIdx + 1,
      cardTotal: deck.length,
      deckKnown: deckKnown,
      barStyle: 'height: 100%; width: ' + pct + '%; background: #B4232A; border-radius: 999px',
      flipped: s.flipped,
      notFlipped: !s.flipped,
      flip: function () { self.setState({ flipped: true }); },
      speakCard: function () { speak(c.es); },
      speakCardSlow: function () { speak(c.es, true); },
      prevCard: function () {
        if (!deck.length) return;
        self.setState({ card: (cardIdx - 1 + deck.length) % deck.length, flipped: false });
      },
      markKnown: function () { self.mark(true); },
      markReview: function () { self.mark(false); },

      // Leitura
      text: { title: t.title, nivel: t.nivel },
      speakText: function () { speak(t.sentences.map(function (p) { return p[0]; }).join(' ')); },
      toggleAllLabel: allOpen ? 'Ocultar traduções' : 'Traduzir tudo',
      toggleAll: function () {
        var open = {};
        if (!allOpen) t.sentences.forEach(function (x, i) { open[i] = true; });
        self.setState({ open: open });
      },
      sentences: t.sentences.map(function (pair, idx) {
        var isOpen = !!s.open[idx];
        return {
          es: pair[0], pt: pair[1], open: isOpen,
          style: 'text-align: left; width: 100%; min-height: 44px; padding: 12px; border: none; border-radius: 12px; font-family: Fraunces, Georgia, serif; font-size: 19px; line-height: 1.4; color: #16181D; ' + (isOpen ? 'background: #FDF3D0' : 'background: transparent'),
          toggle: function () {
            var open = Object.assign({}, s.open);
            if (open[idx]) delete open[idx]; else open[idx] = true;
            self.setState({ open: open });
            if (!isOpen) speak(pair[0]);
          },
          speak: function () { speak(pair[0]); }
        };
      }),
      words: t.words.map(function (w) { return { es: w[0], pt: w[1], speak: function () { speak(w[0]); } }; }),
      questions: t.questions.map(function (qq, qi) {
        var key = s.textIdx + '-' + qi;
        var picked = s.answers.hasOwnProperty(key) ? s.answers[key] : null;
        var answered = picked !== null;
        var ok = answered && picked === qq.correct;
        return {
          num: qi + 1, text: qq.q, answered: answered,
          fbText: ok ? '¡Muy bien! Resposta certa.' : 'Quase. A resposta certa está em verde.',
          fbStyle: fbStyle(ok),
          options: qq.options.map(function (label, oi) {
            return {
              label: label,
              style: optStyle(answered, oi, qq.correct, picked),
              pick: function () {
                if (answered) return;
                var answers = Object.assign({}, s.answers);
                answers[key] = oi;
                var read = Object.assign({}, s.read);
                var allRight = t.questions.every(function (q2, j) {
                  var k = s.textIdx + '-' + j;
                  var a = k === key ? oi : answers[k];
                  return a === q2.correct;
                });
                if (allRight) read[s.textIdx] = true;
                var extra = { answers: answers, read: read };
                if (oi === qq.correct) self.bump(extra); else self.setState(extra);
              }
            };
          })
        };
      }),
      textDone: textDone,
      hasNextText: s.textIdx < TEXTS.length - 1,
      nextText: function () { self.setState({ textIdx: s.textIdx + 1, open: {} }); },

      // Prática
      seg: { montar: segStyle(s.pmode === 'montar'), escuta: segStyle(s.pmode === 'escuta'), lacuna: segStyle(s.pmode === 'lacuna') },
      modeMontar: function () { self.setState({ pmode: 'montar' }); },
      modeEscuta: function () { self.setState({ pmode: 'escuta' }); },
      modeLacuna: function () { self.setState({ pmode: 'lacuna' }); },
      isMontar: s.pmode === 'montar',
      isEscuta: s.pmode === 'escuta',
      isLacuna: s.pmode === 'lacuna',

      ex: { pt: ex.pt, answer: answerStr },
      exPos: s.ex + 1,
      exTotal: EXS.length,
      built: s.built.map(function (i, pos) {
        return { word: ex.words[i], remove: function () {
          var b = s.built.slice(); b.splice(pos, 1);
          self.setState({ built: b, checked: false });
        } };
      }),
      builtEmpty: s.built.length === 0,
      pool: ex.order.filter(function (i) { return !used[i]; }).map(function (i) {
        return { word: ex.words[i], add: function () { self.setState({ built: s.built.concat([i]), checked: false }); } };
      }),
      exChecked: s.checked,
      exFbTitle: exOk ? '¡Correcto!' : 'Ainda não. A ordem certa é:',
      exFbStyle: 'display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-radius: 14px; ' + (exOk ? 'background: #E3F1E8; color: #0F3F27' : 'background: #FBE9E7; color: #7A161B'),
      primaryExLabel: s.checked && exOk ? 'Próxima' : 'Verificar',
      primaryExStyle: 'min-height: 52px; border: none; border-radius: 14px; font-size: 15px; font-weight: 600; ' + (primaryReady ? 'background: #B4232A; color: #FFFFFF' : 'background: #E6E4DD; color: #5B5F6B'),
      primaryEx: function () {
        if (s.checked && exOk) {
          self.setState({ ex: (s.ex + 1) % EXS.length, built: [], checked: false });
        } else if (complete) {
          if (exOk) { self.bump({ checked: true }); speak(answerStr); }
          else self.setState({ checked: true });
        }
      },
      resetEx: function () { self.setState({ built: [], checked: false }); },

      li: { es: li.es },
      liPos: s.li + 1,
      liTotal: LISTEN.length,
      liPlay: function () { speak(li.es); },
      liPlaySlow: function () { speak(li.es, true); },
      liShowText: s.lshow,
      liTextLabel: s.lshow ? 'Ocultar frase' : 'Mostrar frase',
      liToggleText: function () { self.setState({ lshow: !s.lshow }); },
      liOptions: li.options.map(function (label, oi) {
        return {
          label: label,
          style: optStyle(lAns, oi, li.correct, s.lpick),
          pick: function () {
            if (lAns) return;
            if (oi === li.correct) self.bump({ lpick: oi, lshow: true }); else self.setState({ lpick: oi, lshow: true });
          }
        };
      }),
      liAnswered: lAns,
      liFbText: lOk ? '¡Muy bien! Você entendeu de ouvido.' : 'Quase. Ouça de novo e compare com a frase escrita.',
      liFbStyle: fbStyle(lOk),
      liNext: function () { self.setState({ li: (s.li + 1) % LISTEN.length, lpick: null, lshow: false }); },

      gap: { before: g.before, after: g.after, pt: g.pt },
      gPos: s.gi + 1,
      gTotal: GAPS.length,
      gapText: gAns ? g.options[s.gpick] : '______',
      gapStyle: 'padding: 0 6px; border-radius: 8px; ' + (!gAns ? 'background: #EFEDE6; color: #5B5F6B' : gOk ? 'background: #E3F1E8; color: #0F3F27' : 'background: #FBE9E7; color: #7A161B; text-decoration: line-through'),
      gOptions: g.options.map(function (label, oi) {
        return {
          label: label,
          style: optStyle(gAns, oi, g.correct, s.gpick),
          pick: function () {
            if (gAns) return;
            if (oi === g.correct) {
              self.bump({ gpick: oi });
              speak(g.before + label + g.after);
            } else self.setState({ gpick: oi });
          }
        };
      }),
      gAnswered: gAns,
      gFbText: gOk ? '¡Correcto!' : 'A resposta certa é "' + g.options[g.correct] + '".',
      gFbStyle: fbStyle(gOk),
      gNext: function () { self.setState({ gi: (s.gi + 1) % GAPS.length, gpick: null }); }
    };
  }
}

FAFBoot(Component);

});
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
