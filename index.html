        if (cfg.mode === 'lesson' || cfg.mode === 'premium') S.queue.push({ e: item.e, retry: true });
        ov.classList.add('is-shake'); setTimeout(function () { ov.classList.remove('is-shake'); }, 400);
      }
      save(); paintTop();
      main.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
      foot.className = 'cc-l-foot is-' + (ok ? 'ok' : 'bad');
      var msg = ok ? PRAISE[Math.floor(Math.random() * PRAISE.length)] : 'Resposta certa:';
      var cont = h('button', { type: 'button', class: 'cc-btn is-wide', onclick: next, text: 'Continuar' });
      foot.replaceChildren(h('div', { class: 'cc-fb' }, [h('strong', { text: msg }), ok && item.e.t !== 'build' && item.e.t !== 'match' ? null : h('span', { text: item.explain })]), cont);
      if (ok && item.e.t === 'fill') foot.querySelector('.cc-fb').appendChild(h('span', { text: item.e.pt }));
      cont.focus();
    }

    function outOfHearts() {
      main.replaceChildren(h('div', { class: 'cc-big-ico is-heart' }, [icon('heart')]), h('h2', { class: 'cc-l-title', text: 'Suas vidas acabaram' }),
        h('p', { class: 'cc-tip', text: 'Você chegou longe. Uma vida volta a cada 30 minutos, ou você pode recuperar uma agora com uma revisão rápida.' }));
      var can = Object.keys(st.lessons).length > 0;
      setFoot([h('button', { type: 'button', class: 'cc-btn is-wide', disabled: !can, onclick: function () { close(); startReview(); }, text: can ? 'Revisar para ganhar 1 vida' : 'Volte em ' + nextHeartIn() + ' min' }),
        h('button', { type: 'button', class: 'cc-btn is-wide is-ghost', onclick: close, text: 'Voltar ao mapa' })]);
    }

    function finish() {
      var secs = Math.round((Date.now() - S.start) / 1000), acc = Math.round(S.right / S.total * 100), lvUp = 0, earned = 0, title, sub, stars = 0, passed = true;
      if (cfg.mode === 'lesson') {
        stars = S.errors === 0 ? 3 : S.errors <= 2 ? 2 : 1;
        var prev = st.lessons[cfg.lesson.id];
        earned = prev ? 5 + (stars === 3 ? 5 : 0) : 10 + (stars === 3 ? 5 : 0);
        st.lessons[cfg.lesson.id] = { stars: Math.max(stars, prev ? prev.stars : 0), at: Date.now(), times: (prev ? prev.times : 0) + 1 };
        unlock('primeira'); if (stars === 3) unlock('perfeita');
        title = stars === 3 ? 'Lição perfeita!' : 'Lição concluída!'; sub = cfg.lesson.title;
      } else if (cfg.mode === 'premium') {
        stars = S.errors === 0 ? 3 : S.errors <= 2 ? 2 : 1;
        var prevP = st.lessons[cfg.lesson.id];
        earned = prevP ? 5 + (stars === 3 ? 5 : 0) : 15 + (stars === 3 ? 5 : 0);
        st.lessons[cfg.lesson.id] = { stars: Math.max(stars, prevP ? prevP.stars : 0), at: Date.now(), times: (prevP ? prevP.times : 0) + 1 };
        if (stars === 3) unlock('perfeita');
        title = cfg.kind === 'texto' ? 'Leitura concluída!' : 'Frases dominadas!'; sub = cfg.lesson.title;
      } else if (cfg.mode === 'test') {
        passed = S.right >= TEST_PASS;
        if (passed) { st.tests[cfg.unit.id + 't'] = { passed: true, score: S.right, at: Date.now() }; earned = 30; unlock('prova'); title = 'Aprovado!'; sub = 'Você passou na prova da unidade.'; }
        else { title = 'Quase lá'; sub = 'Para passar, acerte ' + TEST_PASS + ' de ' + S.total + '. Revise as lições e tente de novo.'; earned = 0; }
      } else {
        passed = S.right >= 4;
        if (passed) { regen(); st.hearts.n = Math.min(HEART_MAX, st.hearts.n + 1); unlock('revisao'); earned = 5; title = 'Você ganhou 1 vida!'; sub = 'Revisar é o melhor jeito de fixar.'; }
        else { title = 'Faltou pouco'; sub = 'Acerte pelo menos 4 de 5 para ganhar uma vida.'; }
      }
      if (earned) { lvUp = addXP(earned); touchStreak(); }
      S.finished = true;
      save();
      if (!toastOn) nextToast();
      paintTop(); bar.firstChild.style.width = '100%';
      comboEl.classList.remove('is-on');
      if (passed) { SFX.done(); confetti(ov); }
      main.replaceChildren(
        h('div', { class: 'cc-result' }, [
          cfg.mode === 'lesson' || cfg.mode === 'premium' ? h('div', { class: 'cc-res-stars', 'aria-label': stars + ' de 3 estrelas' }, [0, 1, 2].map(function (k) { var s = icon('star', k < stars ? 'is-on' : ''); s.style.animationDelay = (0.15 + k * 0.2) + 's'; return s; })) :
            h('div', { class: 'cc-big-ico ' + (passed ? 'is-level' : 'is-heart') }, [icon(passed ? 'trophy' : 'heart')]),
          h('h2', { class: 'cc-l-title', text: title }),
          h('p', { class: 'cc-tip is-center', text: sub }),
          h('div', { class: 'cc-res-grid' }, [
            h('div', { class: 'is-xp' }, [countUp(earned, '+'), h('span', { text: 'XP' })]),
            h('div', {}, [h('strong', { text: acc + '%' }), h('span', { text: 'acertos' })]),
            h('div', {}, [h('strong', { text: S.maxCombo }), h('span', { text: 'melhor sequência' })]),
            h('div', {}, [h('strong', { text: Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0') }), h('span', { text: 'tempo' })])
          ]),
          streakNow() ? h('p', { class: 'cc-streak-line' }, [icon('flame'), streakNow() + (streakNow() === 1 ? ' dia de ofensiva' : ' dias de ofensiva')]) : null
        ]));
      setFoot([h('button', { type: 'button', class: 'cc-btn is-wide', onclick: function () { close(); if (lvUp) levelUp(lvUp); }, text: 'Continuar' })]);
      foot.querySelector('button').focus();
    }

    paintTop();
    if (S.intro) showIntro(); else next();
  }

  // ---------- Conversa com a Lía (IA) ----------
  var CHAT_SCENES = [
    { id: 'livre', t: 'Conversa livre', d: 'Fale sobre você e o seu dia.' },
    { id: 'apresentar', t: 'Conhecer alguém', d: 'Apresente-se numa festa.' },
    { id: 'cafe', t: 'No café', d: 'Peça algo para comer e pague.' },
    { id: 'hotel', t: 'No hotel', d: 'Faça o check-in.' },
    { id: 'caminho', t: 'Pedir direções', d: 'Encontre o caminho até um museu.' },
    { id: 'entrevista', t: 'Entrevista de emprego', d: 'Para quem já está no B1.' }
  ];
  var CHAT_XP_MAX = 10;
  function chatLevel() { var lv = 'A1'; try { lv = localStorage.getItem('fraseafrase.lialevel') || 'A1'; } catch (e) {} return lv; }
  function openChat() {
    loadCourse().then(function () {
      var url = course.ai && course.ai.url;
      var ov = h('div', { class: 'cc-lesson cc-chat', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Conversa com a Lía' });
      applyTheme(ov);
      var main = h('div', { class: 'cc-chat-main' }), foot = h('div', { class: 'cc-chat-foot' });
      var sub = h('span', { class: 'cc-chat-sub', text: 'IA do Frase a Frase · teste' });
      ov.appendChild(h('div', { class: 'cc-chat-top' }, [
        h('button', { type: 'button', class: 'cc-icon-btn', 'aria-label': 'Fechar conversa', onclick: close }, [icon('close')]),
        h('span', { class: 'cc-lia-avatar is-sm', 'aria-hidden': 'true', text: 'L' }),
        h('div', { class: 'cc-chat-id' }, [h('strong', { text: 'Lía' }), sub]),
        url ? (function () {
          var vb = h('button', { type: 'button', class: 'cc-voice-toggle', 'aria-pressed': liaVoiceOn() ? 'true' : 'false' });
          function paint() { vb.textContent = liaVoiceOn() ? 'Voz da Lía' : 'Voz do aparelho'; vb.setAttribute('aria-pressed', liaVoiceOn() ? 'true' : 'false'); vb.title = 'Trocar a voz das respostas'; }
          vb.onclick = function () { try { localStorage.setItem('fraseafrase.liavoz', liaVoiceOn() ? 'aparelho' : 'lia'); } catch (e) {} stopLia(); paint(); };
          paint(); return vb;
        })() : null
      ]));
      ov.appendChild(main); ov.appendChild(foot);
      document.body.appendChild(ov); document.body.classList.add('cc-locked');
      var C = { scene: 'livre', level: chatLevel(), msgs: [], sent: 0, xp: 0, busy: false };
      function close() {
        ov.remove(); document.body.classList.remove('cc-locked'); try { speechSynthesis.cancel(); } catch (e) {} stopLia(); liaReq++;
        if (C.xp) { var up = addXP(C.xp); touchStreak(); save(); toast('+' + C.xp + ' XP de conversa', C.sent + (C.sent === 1 ? ' mensagem enviada' : ' mensagens enviadas')); renderMap(); if (up) levelUp(up); }
      }

      function pickScreen() {
        foot.replaceChildren();
        main.replaceChildren(
          h('div', { class: 'cc-chat-hero' }, [
            h('span', { class: 'cc-lia-avatar is-xl', 'aria-hidden': 'true', text: 'L' }),
            h('h2', { text: '¡Hola! Soy Lía.' }),
            h('p', { text: 'Sou a inteligência artificial do Frase a Frase. Escolha o seu nível e um cenário para conversar comigo em espanhol.' })
          ]),
          h('p', { class: 'cc-kicker', text: 'Seu nível' }),
          h('div', { class: 'cc-chips' }, ['A1', 'A2', 'B1', 'B2'].map(function (lv) {
            return h('button', { type: 'button', class: 'cc-tool' + (C.level === lv ? ' is-on' : ''), 'aria-pressed': C.level === lv ? 'true' : 'false',
              onclick: function () { C.level = lv; try { localStorage.setItem('fraseafrase.lialevel', lv); } catch (e) {} pickScreen(); }, text: lv });
          })),
          h('p', { class: 'cc-kicker', text: 'Cenário' }),
          h('div', { class: 'cc-scenes' }, CHAT_SCENES.map(function (s) {
            return h('button', { type: 'button', class: 'cc-scene', onclick: function () { C.scene = s.id; startChat(); } }, [h('strong', { text: s.t }), h('span', { text: s.d })]);
          })),
          h('p', { class: 'cc-chat-note', text: 'A Lía é uma IA em fase de teste: ela pode errar. As mensagens são enviadas para um serviço de IA para gerar as respostas; não escreva dados pessoais.' })
        );
      }

      var list, input, sugg, sendBtn, micBtn;
      function startChat() {
        main.replaceChildren(list = h('div', { class: 'cc-msgs', 'aria-live': 'polite' }));
        sub.textContent = CHAT_SCENES.filter(function (s) { return s.id === C.scene; })[0].t + ' · ' + C.level;
        sugg = h('div', { class: 'cc-sugg' });
        input = h('textarea', { class: 'cc-input', rows: '1', lang: 'es', placeholder: 'Escreva em espanhol…', 'aria-label': 'Sua mensagem',
          onkeydown: function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } },
          oninput: function () { onInput(); } });
        function onInput() { input.style.height = 'auto'; input.style.height = Math.min(120, input.scrollHeight) + 'px'; sendBtn.disabled = !input.value.trim() || C.busy; }
        input.onInputFix = onInput;
        sendBtn = h('button', { type: 'button', class: 'cc-send', 'aria-label': 'Enviar', disabled: true, onclick: send }, [icon('play')]);
        var Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
        micBtn = Rec ? h('button', { type: 'button', class: 'cc-mic', 'aria-label': 'Falar em espanhol', onclick: function () { listen(Rec); } }, [micIcon()]) : null;
        foot.replaceChildren(sugg, h('div', { class: 'cc-input-row' }, [input, micBtn, sendBtn]));
        if (!url) {
          bubble('lia', '¡Hola! Todavía estoy en preparación. Muy pronto podremos conversar.', { note: 'A Lía ainda não foi ligada. Falta configurar o serviço de IA (veja as instruções do projeto).' });
          input.disabled = true; if (micBtn) micBtn.disabled = true;
          return;
        }
        ask();
      }
      function micIcon() { var s = h('span', { class: 'cc-ico', 'aria-hidden': 'true' }); s.innerHTML = '<svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 0 0-7 0v6A3.5 3.5 0 0 0 12 15Z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>'; return s; }
      function listen(Rec) {
        try {
          if (window.FAF && window.FAF.stopAudio) window.FAF.stopAudio(); speechSynthesis.cancel();
          var r = new Rec(); r.lang = 'es-ES'; r.interimResults = true; r.maxAlternatives = 1;
          micBtn.classList.add('is-rec');
          r.onresult = function (e) { var txt = ''; for (var i = 0; i < e.results.length; i++) txt += e.results[i][0].transcript; input.value = txt; input.onInputFix(); };
          r.onend = r.onerror = function () { micBtn.classList.remove('is-rec'); input.focus(); };
          r.start();
        } catch (e) { micBtn.classList.remove('is-rec'); }
      }
      function bubble(who, text, extra) {
        extra = extra || {};
        var b = h('div', { class: 'cc-msg is-' + who });
        if (who === 'lia') {
          var tr = h('p', { class: 'cc-msg-tr', hidden: true });
          b.appendChild(h('p', { class: 'cc-msg-txt', lang: 'es', text: text }));
          b.appendChild(tr);
          b.appendChild(h('div', { class: 'cc-msg-tools' }, [
            h('button', { type: 'button', 'aria-label': 'Ouvir', onclick: function (e) { speakLia(text, C.level, e.currentTarget); } }, [icon('speaker')]),
            h('button', { type: 'button', class: 'cc-msg-trbtn', onclick: function () {
              if (!tr.hidden) { tr.hidden = true; return; }
              tr.hidden = false; tr.textContent = 'Traduzindo…';
              if (window.FAF && window.FAF.translate) window.FAF.translate(text, 'pt').then(function (o) { tr.textContent = o; }, function () { tr.textContent = 'Tradução indisponível agora.'; });
            }, text: 'Traduzir' })
          ]));
          if (extra.note) b.appendChild(h('p', { class: 'cc-msg-note', text: extra.note }));
        } else b.appendChild(h('p', { class: 'cc-msg-txt', lang: 'es', text: text }));
        list.appendChild(b);
        b.scrollIntoView({ block: 'end', behavior: 'smooth' });
        return b;
      }
      function setSugg(arr) {
        sugg.replaceChildren.apply(sugg, (arr || []).map(function (s) {
          return h('button', { type: 'button', class: 'cc-sugg-chip', lang: 'es', onclick: function () { input.value = s; input.onInputFix(); input.focus(); }, text: s });
        }));
      }
      function send() {
        var txt = input.value.trim(); if (!txt || C.busy) return;
        input.value = ''; input.onInputFix(); setSugg([]);
        var mine = bubble('me', txt);
        C.msgs.push({ role: 'user', content: txt }); C.sent++;
        if (C.xp < CHAT_XP_MAX) C.xp += 2;
        if (C.sent >= 3) unlock('conversa');
        if (C.sent >= 10) unlock('conversa10');
        save();
        ask(mine);
      }
      function ask(mine) {
        C.busy = true; sendBtn.disabled = true;
        var typing = h('div', { class: 'cc-msg is-lia is-typing', 'aria-label': 'Lía está escrevendo' }, [h('i'), h('i'), h('i')]);
        list.appendChild(typing); typing.scrollIntoView({ block: 'end' });
        fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ level: C.level, scenario: C.scene, messages: C.msgs }) })
          .then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.error || r.status); return d; }); })
          .then(function (d) {
            typing.remove();
            if (mine && d.correction) {
              mine.appendChild(h('div', { class: 'cc-fix' }, [h('strong', { text: 'Dica da Lía' }), h('span', { text: d.correction })]));
            } else if (mine) mine.classList.add('is-good');
            C.msgs.push({ role: 'assistant', content: d.reply });
            var lb = bubble('lia', d.reply);
            speakLia(d.reply, C.level, lb.querySelector('.cc-msg-tools button'));
            setSugg(d.suggestions);
          }, function (err) {
            typing.remove();
            if (mine) C.msgs.pop();
            bubble('lia', 'Perdón, no pude responder ahora.', { note: String(err.message) === 'rate_limited' ? 'Muitas mensagens em pouco tempo. Espere alguns minutos.' : 'Não foi possível falar com a IA. Verifique a conexão e tente de novo.' });
            if (mine) { input.value = mine.querySelector('.cc-msg-txt').textContent; mine.remove(); }
          })
          .then(function () { C.busy = false; input.onInputFix(); input.focus(); });
      }
      pickScreen();
    });
  }

  window.FAF_COURSE = {
    sync: sync,
    summary: function () {
      regen();
      return { xp: st.xp, level: levelOf(st.xp).lv, streak: streakNow(), lessons: Object.keys(st.lessons).length, hearts: st.hearts.n };
    },
    state: function () { return st; },
    openChat: function () { openChat(); },
    replaceState: function (s) { if (s && s.v === 1) { st = Object.assign(blank(), s); try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} if (visible) renderMap(); } }
  };
})();
</script>
<script>

];

var GROUPS = [
  { id: 'social', name: 'Dia a dia e social', short: 'Dia a dia' },

function seededOrder(n, seed) {
  var a = []; for (var i = 0; i < n; i++) a.push(i);
  var x = seed || 1;
  for (var j = n - 1; j > 0; j--) { x = (x * 1103515245 + 12345) % 2147483648; var k = x % (j + 1); var tmp = a[j]; a[j] = a[k]; a[k] = tmp; }
  var same = a.every(function (v, i) { return v === i; });
  if (same && n > 1) a.push(a.shift());
  return a;
}

    var textAll = TEXTS.map(function (x, idx) { return Object.assign({ idx: idx }, x); })

      .filter(function (x) { return s.tema === 'all' || x.tema === s.tema; })
      .filter(function (x) { return !tq || norm(x.title).indexOf(tq) >= 0 || x.sentences.some(function (p) { return norm(p[0]).indexOf(tq) >= 0 || norm(p[1]).indexOf(tq) >= 0; }); })
      .sort(function (a, b) { return LEVELS.indexOf(a.nivel) - LEVELS.indexOf(b.nivel) || a.idx - b.idx; });
    var textList = textAll.slice(0, s.textLimit);

    // Leitura
    var t = TEXTS[s.textIdx];
    var allOpen = t.sentences.every(function (x, i) { return s.open[i]; });
    var textDone = !!s.read[s.textIdx];

    // Montar
    var ex = EXS[s.ex % EXS.length];
    var used = {};
    s.built.forEach(function (i) { used[i] = true; });
    var answerStr = ex.words.join(' ');
    var exOk = s.built.map(function (i) { return ex.words[i]; }).join(' ') === answerStr;
    var complete = s.built.length === ex.words.length;
    var primaryReady = complete || (s.checked && exOk);

    // Escuta
    var li = LISTEN[s.li];
    var lAns = s.lpick !== null;
    var lOk = lAns && s.lpick === li.correct;

    // Lacuna
    var g = GAPS[s.gi];
    var gAns = s.gpick !== null;
    var gOk = gAns && s.gpick === g.correct;

    return {
      showInicio: s.tab === 'inicio',
      showFrases: s.tab === 'frases',
      showTextos: s.tab === 'textos',
      showPratica: s.tab === 'pratica',
      showOuvir: s.tab === 'ouvir',
      nav: {
        inicio: navStyle(s.tab === 'inicio'),
        frases: navStyle(s.tab === 'frases'),
        textos: navStyle(s.tab === 'textos'),
        pratica: navStyle(s.tab === 'pratica'),
        ouvir: navStyle(s.tab === 'ouvir'),
        curso: navStyle(s.tab === 'curso')
      },
      goOuvir: function () { self.setState({ tab: 'ouvir' }); },

      // Ouvir
      mFilters: [{ id: 'all', label: 'Todos' }, { id: 'podcast', label: 'Podcasts' }, { id: 'video', label: 'Vídeos' }, { id: 'frases', label: 'Frases' }].map(function (f) {
        return { label: f.label, style: pill(s.mfilter === f.id), pick: function () { self.setState({ mfilter: f.id }); } };
      }),
      mCount: mediaList.length === 1 ? '1 item' : mediaList.length + ' itens',
      heardCount: Object.keys(s.heard).length,
      media: mediaList.map(function (m) {
        var heard = !!s.heard[m.id];
        var typeColors = m.kind === 'video' ? 'background: #E6EEFF; color: #2547B8' : m.kind === 'frases' ? 'background: #E9EDF8; color: #323A5C' : 'background: #EDE9FF; color: #4329D6';
        return {
          title: m.title, source: m.source, nivel: m.nivel, desc: m.desc, tip: m.tip, url: m.url,
          hasPlayer: !!(m.feed || m.yt),
          noPlayer: !(m.feed || m.yt),
          playLabel: m.yt ? 'Assistir aqui' : 'Ouvir e ler',
          play: function () { if (window.FAF) window.FAF.open(m); },
          type: KIND_LABEL[m.kind],
          typeStyle: 'font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; ' + typeColors,
          heard: heard,
          heardLabel: heard ? 'Desmarcar' : 'Já ouvi',
          heardStyle: 'min-height: 48px; border-radius: 12px; font-size: 14px; font-weight: 600; ' + (heard ? 'border: 1px solid #C9D2EA; background: #FFFFFF; color: #141A33' : 'border: none; background: #5B3DF5; color: #FFFFFF'),
          toggle: function () {
            var h = Object.assign({}, s.heard);
            if (h[m.id]) { delete h[m.id]; self.setState({ heard: h }); }
            else { h[m.id] = true; self.bump({ heard: h }); }
          }
        };
      }),
      goInicio: function () { self.setState({ tab: 'inicio' }); },
      goFrases: function () { self.setState({ tab: 'frases', cat: s.cat === -1 ? 0 : s.cat }); },
      goTextos: function () { self.setState({ tab: 'textos', reading: false }); },
      goPratica: function () { self.setState({ tab: 'pratica' }); },
      goReview: function () { self.setState({ tab: 'frases', fview: 'cards', cat: -1, card: 0, flipped: false }); },

      // Frases: lista
      fseg: { cats: segStyle(s.fview === 'cats'), cards: segStyle(s.fview === 'cards'), lista: segStyle(s.fview === 'lista') },
      vozNaturalStyle: pill(s.voz !== 'aparelho'),
      vozAparelhoStyle: pill(s.voz === 'aparelho'),
      vozNota: s.voz === 'aparelho' ? 'Usa a voz instalada no aparelho. Funciona sem internet.' : 'Voz humana gerada por IA. Precisa de internet; cada áudio fica guardado depois da primeira vez. Sem internet, o app usa a voz do aparelho.',
      vozNatural: function () { try { localStorage.setItem('fraseafrase.voz', 'natural'); } catch (e) {} self.setState({ voz: 'natural' }); },
      vozAparelho: function () { try { localStorage.setItem('fraseafrase.voz', 'aparelho'); } catch (e) {} self.setState({ voz: 'aparelho' }); },
      trLabel: s.flang === 'en' ? 'Inglês' : 'Português',
      readDeckLabel: 'Ouvir as ' + deck.length + ' frases',
      readDeck: function () {
        if (!window.FAF || !window.FAF.read || !deck.length) return;
        var start = s.fview === 'cards' ? Math.min(s.card, deck.length - 1) : 0;
        window.FAF.read({ title: s.cat === -1 ? 'Revisão' : s.cat === -2 ? 'Todas as frases' : (CATS[s.cat] || CATS[0]).name, sub: 'Frases', lang: s.lang,
          items: deck.map(function (p) { return { es: p.es, pt: p.pt }; }), start: start });
      },
      langPtOn: s.flang === 'pt' ? 'true' : 'false',
      langEnOn: s.flang === 'en' ? 'true' : 'false',
      langPtStyle: pill(s.flang === 'pt') + '; min-height: 36px; padding: 0 14px; font-size: 13px',
      langEnStyle: pill(s.flang === 'en') + '; min-height: 36px; padding: 0 14px; font-size: 13px',
      langPt: function () { try { localStorage.setItem('fraseafrase.flang', 'pt'); } catch (e) {} self.setState({ flang: 'pt' }); },
      langEn: function () { try { localStorage.setItem('fraseafrase.flang', 'en'); } catch (e) {} self.setState({ flang: 'en' }); },
      viewCats: function () { self.setState({ fview: 'cats' }); },
      isCatsView: s.fview === 'cats',
      notCatsView: s.fview !== 'cats',
      curPill: pill(s.cat >= 0),
      curCatLabel: s.cat >= 0 && CATS[s.cat] ? CATS[s.cat].name : 'Escolher categoria',
      showCurso: (function () { if (window.FAF_COURSE) window.FAF_COURSE.sync(s.tab === 'curso'); return s.tab === 'curso'; })(),
      goCurso: function () { self.setState({ tab: 'curso' }); },
      courseTitle: courseSum && courseSum.lessons ? 'Continuar o curso' : 'Comece o Curso Premium',
      courseSub: courseSum && courseSum.lessons ? 'Nível ' + courseSum.level + ' · ' + courseSum.lessons + (courseSum.lessons === 1 ? ' lição concluída' : ' lições concluídas') : 'Trilha do A1 ao B2 com lições curtas, XP, ofensiva, baús e conquistas.',
      courseStats: courseSum ? courseSum.streak + (courseSum.streak === 1 ? ' dia' : ' dias') + ' · ' + courseSum.xp + ' XP' : '',
      homeCatsLine: CATS.length + ' categorias, do restaurante às finanças',
      homeTextsLine: TEXTS.length + ' textos, do básico ao avançado',
      catSummary: CATS.length + ' categorias · ' + ALL.length + ' frases · ' + knownCount + ' você já sabe',
      catGroups: GROUPS.map(function (g) {
        var list = [];
        var gTotal = 0, gKnown = 0;
        CATS.forEach(function (c, ci) {
          if ((c.group || 'social') !== g.id) return;
          var total = c.items.length;
          var k = 0;
          for (var ii = 0; ii < total; ii++) if (s.known[ci + '-' + ii]) k++;
          gTotal += total; gKnown += k;
          var pctc = total ? Math.round(k / total * 100) : 0;
          list.push({
            name: c.name,
            meta: k ? k + ' de ' + total + ' já sei' : total + ' frases',
            bar: 'display: block; height: 100%; width: ' + pctc + '%; background: ' + (pctc === 100 ? '#14915D' : '#5B3DF5') + '; border-radius: 999px',
            style: 'display: flex; flex-direction: column; align-items: stretch; gap: 8px; text-align: left; padding: 14px; min-height: 96px; border-radius: 16px; ' +
              (s.cat === ci ? 'border: 1px solid #5B3DF5; background: #FFFFFF; color: #141A33' : 'border: 1px solid #E1E6F3; background: #FFFFFF; color: #141A33'),
            pick: function () { self.setState({ cat: ci, card: 0, flipped: false, fview: 'cards' }); }
          });
        });
        return { name: g.name, meta: gKnown + '/' + gTotal, cats: list };
      }).filter(function (g) { return g.cats.length; }),
      viewCards: function () { self.setState({ fview: 'cards' }); },
      viewLista: function () { self.setState({ fview: 'lista' }); },
      isCards: s.fview === 'cards',
      isLista: s.fview === 'lista',
      allPill: pill(s.cat === -2),
      pickAll: function () { self.setState({ cat: -2, card: 0, flipped: false }); },
      pickReview: function () { self.setState({ cat: -1, card: 0, flipped: false }); },
      query: s.query,
      onQuery: function (e) { self.setState({ query: e && e.target ? e.target.value : '', listLimit: 60 }); },
      listItems: listItems.map(function (p) {
        return {
          es: p.es, pt: trOf(p, s.flang), cat: p.cat,
          isKnown: !!s.known[p.key], isReview: !!s.review[p.key],
          speak: function () { speak(p.es); },
          open: function () {
            var pos = deck.findIndex(function (d) { return d.key === p.key; });
            if (pos < 0) {
              var own = ALL.filter(function (d) { return d.ci === p.ci; });
              self.setState({ fview: 'cards', cat: p.ci, card: own.findIndex(function (d) { return d.key === p.key; }), flipped: false, query: '' });
            } else self.setState({ fview: 'cards', card: pos, flipped: false });
          }
        };
      }),
      listCount: (listAll.length === 1 ? '1 frase' : listAll.length + ' frases') + (q ? ' em todas as categorias' : ''),
      listMore: listAll.length > listItems.length,
      listMoreLabel: 'Mostrar mais ' + Math.min(60, listAll.length - listItems.length) + ' de ' + (listAll.length - listItems.length),
      showMoreList: function () { self.setState({ listLimit: s.listLimit + 60 }); },
      listEmpty: listItems.length === 0,
      listEmptyMsg: s.query ? 'Nenhuma frase encontrada para essa busca.' : 'Nenhuma frase marcada para revisar ainda.',

      // Leitura: catálogo
      isCatalog: !s.reading,
      isReading: s.reading,
      backToList: function () { self.setState({ reading: false }); },
      levels: [{ id: 'all', label: 'Todos' }].concat(LEVELS.map(function (l) { return { id: l, label: l }; })).map(function (l) {
        return { label: l.label, style: pill(s.level === l.id), pick: function () { self.setState({ level: l.id, textLimit: 20 }); } };
      }),
      textListCount: textAll.length === 1 ? '1 texto' : textAll.length + ' textos',
      tquery: s.tquery,
      onTQuery: function (e) { self.setState({ tquery: e && e.target ? e.target.value : '', textLimit: 20 }); },
      temas: [{ id: 'all', short: 'Todos os temas' }].concat(GROUPS).map(function (g) {
        return { label: g.short, style: pill(s.tema === g.id) + '; flex: 0 0 auto; white-space: nowrap', pick: function () { self.setState({ tema: g.id, textLimit: 20 }); } };
      }),
      textMore: textAll.length > textList.length,
      textMoreLabel: 'Mostrar mais ' + Math.min(20, textAll.length - textList.length) + ' de ' + (textAll.length - textList.length),
      showMoreTexts: function () { self.setState({ textLimit: s.textLimit + 20 }); },
      textEmpty: textAll.length === 0,
      textList: textList.map(function (x) {
        var done = !!s.read[x.idx];
        var answered = x.questions.filter(function (q, qi) { return s.answers.hasOwnProperty(x.idx + '-' + qi); }).length;
        var status = done ? 'Concluído' : answered > 0 ? 'Em andamento' : 'Novo';
        return {
          title: x.title, nivel: x.nivel, tema: GROUP_SHORT[x.tema] || '',
          preview: x.sentences[0][0],
          meta: x.sentences.length + ' frases · ' + x.words.length + ' palavras-chave · ' + x.questions.length + ' perguntas',
          status: status,
          statusStyle: 'font-size: 12px; font-weight: 600; ' + (done ? 'color: #14915D' : answered > 0 ? 'color: #5B3DF5' : 'color: #5D6788'),
          open: function () { self.setState({ textIdx: x.idx, reading: true, open: {} }); }
        };
      }),

      // Home
      goalCount: Math.min(s.goalCount, GOAL),
      goalTotal: GOAL,
      goalBar: 'height: 100%; width: ' + goalPct + '%; background: ' + (s.goalCount >= GOAL ? '#14915D' : '#5B3DF5') + '; border-radius: 999px',
      goalMsg: goalMsg,
      dia: { es: dia.es, pt: dia.pt, nota: dia.nota, hasNota: !!dia.nota, cat: dia.cat },
      speakDia: function () { speak(dia.es); },
      knownCount: knownCount,
      phraseTotal: ALL.length,
      reviewCount: reviewCount,
      hasReview: reviewCount > 0,
      readCount: Object.keys(s.read).length,
      textTotal: TEXTS.length,
      accentSpain: pill(s.lang === 'es-ES'),
      accentMexico: pill(s.lang === 'es-MX'),
      rateNormal: pill(s.rate !== 0.7),
      rateSlow: pill(s.rate === 0.7),
      setSpain: function () { self.setState({ lang: 'es-ES' }); },
      setMexico: function () { self.setState({ lang: 'es-MX' }); },
      setNormal: function () { self.setState({ rate: 0.9 }); },
      setSlow: function () { self.setState({ rate: 0.7 }); },
      resetAll: function () {
        self.setState({ known: {}, review: {}, answers: {}, read: {}, goalCount: 0, card: 0, cat: 0, flipped: false });
      },

      // Frases
      cats: CATS.map(function (x, idx) {
        return { name: x.name, style: pill(idx === s.cat), pick: function () { self.setState({ cat: idx, card: 0, flipped: false }); } };
      }),
      reviewPill: pill(s.cat === -1),
      deckEmpty: deck.length === 0,
      deckHas: deck.length > 0,
      deckLabel: s.cat === -1 ? 'Revisão' : s.cat === -2 ? 'Todas' : (CATS[s.cat] || CATS[0]).name,
      card: { es: c.es, pt: trOf(c, s.flang), nota: c.nota, hasNota: !!c.nota, cat: c.cat, isKnown: !!s.known[c.key], isReview: !!s.review[c.key] },
      cardPos: cardIdx + 1,
      cardTotal: deck.length,
      deckKnown: deckKnown,
      barStyle: 'height: 100%; width: ' + pct + '%; background: #5B3DF5; border-radius: 999px',
      flipped: s.flipped,
      notFlipped: !s.flipped,
      flip: function () { self.setState({ flipped: true }); },
      speakCard: function () { speak(c.es); },
      speakCardSlow: function () { speak(c.es, true); },
      prevCard: function () {
        if (!deck.length) return;
        self.setState({ card: (cardIdx - 1 + deck.length) % deck.length, flipped: false });
      },
      markKnown: function () { self.mark(true); },
      markReview: function () { self.mark(false); },

      // Leitura
      text: { title: t.title, nivel: t.nivel },
      speakText: function () { if (window.FAF && window.FAF.read) window.FAF.read({ title: t.title, sub: 'Texto · ' + t.nivel, lang: s.lang, items: t.sentences.map(function (p) { return { es: p[0], pt: p[1] }; }) }); else speak(t.sentences.map(function (p) { return p[0]; }).join(' ')); },
      toggleAllLabel: allOpen ? 'Ocultar traduções' : 'Traduzir tudo',
      toggleAll: function () {
        var open = {};
        if (!allOpen) t.sentences.forEach(function (x, i) { open[i] = true; });
        self.setState({ open: open });
      },
      sentences: t.sentences.map(function (pair, idx) {
        var isOpen = !!s.open[idx];
        return {
          es: pair[0], pt: pair[1], open: isOpen,
          style: 'text-align: left; width: 100%; min-height: 44px; padding: 12px; border: none; border-radius: 12px; font-family: Manrope, system-ui, sans-serif; font-weight: 600; font-size: 19px; line-height: 1.4; color: #141A33; ' + (isOpen ? 'background: #E6EEFF' : 'background: transparent'),
          toggle: function () {
            var open = Object.assign({}, s.open);
            if (open[idx]) delete open[idx]; else open[idx] = true;
            self.setState({ open: open });
            if (!isOpen) speak(pair[0]);
          },
          speak: function () { speak(pair[0]); }
        };
      }),
      words: t.words.map(function (w) { return { es: w[0], pt: w[1], speak: function () { speak(w[0]); } }; }),
      questions: t.questions.map(function (qq, qi) {
        var key = s.textIdx + '-' + qi;
        var picked = s.answers.hasOwnProperty(key) ? s.answers[key] : null;
        var answered = picked !== null;
        var ok = answered && picked === qq.correct;
        return {
          num: qi + 1, text: qq.q, answered: answered,
          fbText: ok ? '¡Muy bien! Resposta certa.' : 'Quase. A resposta certa está em verde.',
          fbStyle: fbStyle(ok),
          options: qq.options.map(function (label, oi) {
            return {
              label: label,
              style: optStyle(answered, oi, qq.correct, picked),
              pick: function () {
                if (answered) return;
                var answers = Object.assign({}, s.answers);
                answers[key] = oi;
                var read = Object.assign({}, s.read);
                var allRight = t.questions.every(function (q2, j) {
                  var k = s.textIdx + '-' + j;
                  var a = k === key ? oi : answers[k];
                  return a === q2.correct;
                });
                if (allRight) read[s.textIdx] = true;
                var extra = { answers: answers, read: read };
                if (oi === qq.correct) self.bump(extra); else self.setState(extra);
              }
            };
          })
        };
      }),
      textDone: textDone,
      hasNextText: s.textIdx < TEXTS.length - 1,
      nextText: function () { self.setState({ textIdx: s.textIdx + 1, open: {} }); },

      // Prática
      seg: { montar: segStyle(s.pmode === 'montar'), escuta: segStyle(s.pmode === 'escuta'), lacuna: segStyle(s.pmode === 'lacuna') },
      modeMontar: function () { self.setState({ pmode: 'montar' }); },
      modeEscuta: function () { self.setState({ pmode: 'escuta' }); },
      modeLacuna: function () { self.setState({ pmode: 'lacuna' }); },
      isMontar: s.pmode === 'montar',
      isEscuta: s.pmode === 'escuta',
      isLacuna: s.pmode === 'lacuna',

      ex: { pt: ex.pt, answer: answerStr },
      exPos: (s.ex % EXS.length) + 1,
      exTotal: EXS.length,
      built: s.built.map(function (i, pos) {
        return { word: ex.words[i], remove: function () {
          var b = s.built.slice(); b.splice(pos, 1);
          self.setState({ built: b, checked: false });
        } };
      }),
      builtEmpty: s.built.length === 0,
      pool: ex.order.filter(function (i) { return !used[i]; }).map(function (i) {
        return { word: ex.words[i], add: function () { self.setState({ built: s.built.concat([i]), checked: false }); } };
      }),
      exChecked: s.checked,
      exFbTitle: exOk ? '¡Correcto!' : 'Ainda não. A ordem certa é:',
      exFbStyle: 'display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-radius: 14px; ' + (exOk ? 'background: #E3F6EC; color: #0E6B45' : 'background: #FDECF0; color: #B4234A'),
      primaryExLabel: s.checked && exOk ? 'Próxima' : 'Verificar',
      primaryExStyle: 'min-height: 52px; border: none; border-radius: 14px; font-size: 15px; font-weight: 600; ' + (primaryReady ? 'background: #5B3DF5; color: #FFFFFF' : 'background: #E1E6F3; color: #5D6788'),
      primaryEx: function () {
        if (s.checked && exOk) {
          self.setState({ ex: (s.ex + 1) % EXS.length, built: [], checked: false });
        } else if (complete) {
          if (exOk) { self.bump({ checked: true }); speak(answerStr); }
          else self.setState({ checked: true });
        }
      },
      resetEx: function () { self.setState({ built: [], checked: false }); },

      li: { es: li.es },
      liPos: s.li + 1,
      liTotal: LISTEN.length,
      liPlay: function () { speak(li.es); },
      liPlaySlow: function () { speak(li.es, true); },
      liShowText: s.lshow,
      liTextLabel: s.lshow ? 'Ocultar frase' : 'Mostrar frase',
      liToggleText: function () { self.setState({ lshow: !s.lshow }); },
      liOptions: li.options.map(function (label, oi) {
        return {
          label: label,
          style: optStyle(lAns, oi, li.correct, s.lpick),
          pick: function () {
            if (lAns) return;
            if (oi === li.correct) self.bump({ lpick: oi, lshow: true }); else self.setState({ lpick: oi, lshow: true });
          }
        };
      }),
      liAnswered: lAns,
      liFbText: lOk ? '¡Muy bien! Você entendeu de ouvido.' : 'Quase. Ouça de novo e compare com a frase escrita.',
      liFbStyle: fbStyle(lOk),
      liNext: function () { self.setState({ li: (s.li + 1) % LISTEN.length, lpick: null, lshow: false }); },

      gap: { before: g.before, after: g.after, pt: g.pt },
      gPos: s.gi + 1,
      gTotal: GAPS.length,
      gapText: gAns ? g.options[s.gpick] : '______',
      gapStyle: 'padding: 0 6px; border-radius: 8px; ' + (!gAns ? 'background: #E9EDF8; color: #5D6788' : gOk ? 'background: #E3F6EC; color: #0E6B45' : 'background: #FDECF0; color: #B4234A; text-decoration: line-through'),
      gOptions: g.options.map(function (label, oi) {
        return {
          label: label,
          style: optStyle(gAns, oi, g.correct, s.gpick),
          pick: function () {
            if (gAns) return;
            if (oi === g.correct) {
              self.bump({ gpick: oi });
              speak(g.before + label + g.after);
            } else self.setState({ gpick: oi });
          }
        };
      }),
      gAnswered: gAns,
      gFbText: gOk ? '¡Correcto!' : 'A resposta certa é "' + g.options[g.correct] + '".',
      gFbStyle: fbStyle(gOk),
      gNext: function () { self.setState({ gi: (s.gi + 1) % GAPS.length, gpick: null }); }
    };
  }
}

FAFBoot(Component);

buildExercises();
loadContent();

});
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
